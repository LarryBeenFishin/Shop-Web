<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1"><title>Reset password</title><style>
:root{--navy:#102642;--blue:#2864eb;--muted:#65748a;--line:#dce4ef}*{box-sizing:border-box}html,body{margin:0;min-height:100%;font-family:Inter,Arial,sans-serif}body{min-height:100vh;display:grid;place-items:center;background:linear-gradient(135deg,#071426,#16345b);padding:20px;color:#172033}.card{width:min(100%,430px);background:#fff;border-radius:24px;padding:34px;box-shadow:0 28px 80px rgba(0,0,0,.35)}.logo{width:52px;height:52px;border-radius:15px;background:var(--blue);display:grid;place-items:center;color:#fff;font-weight:900;box-shadow:0 12px 24px rgba(40,100,235,.3)}h1{font-size:29px;margin:25px 0 8px}p{color:var(--muted);line-height:1.5;margin:0 0 22px}label{display:block;margin:13px 0 6px;font-size:13px;font-weight:800}input,button{font:inherit;width:100%;min-height:48px;border-radius:11px}input{border:1px solid var(--line);padding:11px 13px;font-size:16px}button{border:0;background:var(--blue);color:#fff;font-weight:850;margin-top:18px;cursor:pointer}button:disabled{opacity:.6}.notice{min-height:22px;margin-top:13px;color:#b3262c;font-size:13px;font-weight:700}.success{color:#168052}.hidden{display:none}@media(max-width:520px){body{padding:12px}.card{padding:26px 20px;border-radius:20px}}
</style></head><body><main class="card"><div class="logo">S</div><div id="formView"><h1>Choose a new password</h1><p>Enter a new password for your shop account.</p><form id="form"><label for="password">New password</label><input id="password" type="password" minlength="8" autocomplete="new-password" required><label for="confirm">Confirm password</label><input id="confirm" type="password" minlength="8" autocomplete="new-password" required><button id="submit" type="submit">Reset password</button></form><div class="notice" id="notice"></div></div><div id="successView" class="hidden"><h1>Password updated</h1><p>Your new password is ready. Return to the correct sign-in page below.</p><button id="continue" type="button">Continue to sign in</button></div></main><script>
const token=new URLSearchParams(location.search).get('token')||'',notice=document.getElementById('notice');if(!token)notice.textContent='This reset link is incomplete.';
document.getElementById('form').onsubmit=async event=>{event.preventDefault();const password=document.getElementById('password').value,confirm=document.getElementById('confirm').value,button=document.getElementById('submit');notice.textContent='';if(password.length<8){notice.textContent='Password must be at least 8 characters.';return}if(password!==confirm){notice.textContent='Passwords do not match.';return}button.disabled=true;button.textContent='Updating…';try{const response=await fetch('/api/password-reset',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({token,password})}),data=await response.json();if(!response.ok)throw new Error(data.error||'Could not reset password');document.getElementById('formView').classList.add('hidden');document.getElementById('successView').classList.remove('hidden');document.getElementById('continue').onclick=()=>location.href=data.role==='technician'?'/tech':'/admin'}catch(error){notice.textContent=error.message;button.disabled=false;button.textContent='Reset password'}};
</script></body></html>
