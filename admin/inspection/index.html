<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="robots" content="noindex,nofollow"><title>Create Inspection</title><style>
:root{--navy:#163051;--red:#af2727;--green:#1d7f4f;--gold:#f7c948;--bg:#f3f6fb;--line:#dfe7f2;--muted:#637189}*{box-sizing:border-box}body{margin:0;font-family:Arial,sans-serif;background:linear-gradient(180deg,#f7f9fd,var(--bg));color:var(--navy)}button,.btn{border:0;border-radius:14px;padding:13px 18px;background:var(--red);color:#fff;font-weight:800;cursor:pointer;font-size:15px;text-decoration:none;display:inline-flex;align-items:center;justify-content:center}.blue{background:var(--navy)}.green{background:var(--green)}.light{background:#edf3fb;color:var(--navy)}.page{width:min(1180px,calc(100% - 32px));margin:auto;padding:22px 0 34px}.hero{border-radius:26px;background:linear-gradient(135deg,var(--navy),#102640 56%,#7f1e24);color:#fff;padding:22px;margin-bottom:18px}.top{display:flex;justify-content:space-between;align-items:center;gap:16px;flex-wrap:wrap}.brand{display:flex;align-items:center;gap:14px}.brand-box{background:#fff;color:var(--navy);padding:14px 18px;border-radius:16px;font-size:20px;font-weight:900}.eyebrow{text-transform:uppercase;font-size:13px;font-weight:800;color:rgba(255,255,255,.76)}h1{margin:4px 0 0;font-size:clamp(30px,4vw,48px)}.card{background:#fff;border:1px solid var(--line);border-radius:24px;padding:22px;box-shadow:0 8px 24px rgba(22,48,81,.08)}.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:14px}label{display:block;font-weight:800;margin:0 0 7px;font-size:13px}input,select,textarea{width:100%;padding:13px 14px;border:1px solid var(--line);border-radius:14px;font:16px Arial,sans-serif}textarea{min-height:92px;resize:vertical}.items{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;margin-top:16px}.item{border:1px solid var(--line);border-radius:20px;padding:16px;background:#fff;box-shadow:0 6px 20px rgba(22,48,81,.06);border-left:5px solid var(--green)}.item.monitor{border-left-color:#d97706}.item.needs{border-left-color:var(--red)}.item h3{margin:0 0 12px}.recommend{margin-top:16px}.actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:18px}.result{display:none;margin-top:18px;padding:18px;border:1px solid rgba(29,127,79,.24);background:#f5fff9;border-radius:20px}.notice{margin-top:12px;font-weight:800}@media(max-width:980px){.items{grid-template-columns:repeat(2,1fr)}}@media(max-width:700px){.page{width:calc(100% - 20px);padding-top:10px}.hero{border-radius:22px}.brand{width:100%;justify-content:center;flex-direction:column;text-align:center}.grid,.items{grid-template-columns:1fr}.actions{flex-direction:column}.actions>*{width:100%}}
</style></head><body><script src="/config.js"></script><main class="page"><section class="hero"><div class="top"><div class="brand"><div class="brand-box" id="brand">AUTO SHOP</div><div><div class="eyebrow">Inspection Builder</div><h1>Create Inspection</h1></div></div><a class="btn light" href="/admin">Back to Admin</a></div><p>Create a clean customer-ready vehicle inspection report, then copy or open the final customer link.</p></section><section class="card"><div class="grid"><div><label>Customer Name *</label><input id="customerName"></div><div><label>Phone</label><input id="phone"></div><div><label>Email</label><input id="email"></div><div><label>Vehicle *</label><input id="vehicle" placeholder="2017 Honda Ridgeline"></div><div><label>Mileage</label><input id="mileage"></div><div><label>Technician</label><input id="technician"></div><div><label>Overall Status</label><select id="overallStatus"><option>Good</option><option selected>Monitor</option><option>Needs Attention</option></select></div></div><div class="items" id="items"></div><div class="recommend"><label>Recommendations</label><textarea id="recommendations"></textarea></div><div class="actions"><button class="green" id="createBtn" onclick="createInspection()">Create Inspection Report</button><button class="blue" onclick="clearForm()">Clear Form</button><a class="btn light" href="/admin">Cancel</a></div><div id="notice" class="notice"></div><div id="result" class="result"><h2>Inspection Created</h2><input id="reportLink" readonly><div class="actions"><button class="blue" onclick="copyLink()">Copy Link</button><a class="btn green" id="openReport" target="_blank">Open Report</a></div></div></section></main><script>
brand.textContent=(window.SHOP_CONFIG||{}).name||'AUTO SHOP';const names=['Brakes','Tires','Suspension','Fluids','Battery','Lights','Wipers','Filters','Leaks'];function key(n){return n.toLowerCase()}function build(){items.innerHTML=names.map(n=>`<div class="item monitor" id="${key(n)}Card"><h3>${n}</h3><label>Status</label><select id="${key(n)}Status" onchange="paint('${key(n)}')"><option>Good</option><option selected>Monitor</option><option>Needs Attention</option></select><label style="margin-top:12px">Notes</label><textarea id="${key(n)}Notes"></textarea></div>`).join('')}function paint(k){const c=document.getElementById(k+'Card'),v=document.getElementById(k+'Status').value;c.className='item '+(v==='Needs Attention'?'needs':v==='Monitor'?'monitor':'good')}async function createInspection(){const payload={action:'inspection',customerName:customerName.value.trim(),phone:phone.value.trim(),email:email.value.trim(),vehicle:vehicle.value.trim(),mileage:mileage.value.trim(),technician:technician.value.trim(),overallStatus:overallStatus.value,recommendations:recommendations.value.trim()};names.forEach(n=>{const k=key(n);payload[k+'Status']=document.getElementById(k+'Status').value;payload[k+'Notes']=document.getElementById(k+'Notes').value.trim()});if(!payload.customerName||!payload.vehicle){notice.textContent='Customer name and vehicle are required.';return}createBtn.disabled=true;notice.textContent='Creating inspection...';const r=await fetch('/api/admin-data?action=inspection',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(payload)});const j=await r.json();createBtn.disabled=false;if(!r.ok){notice.textContent=j.error||'Could not create inspection.';return}const link=location.origin+'/inspection?id='+j.inspectionId;reportLink.value=link;openReport.href=link;notice.textContent='Inspection created successfully.';result.style.display='block';result.scrollIntoView({behavior:'smooth'})}function clearForm(){if(!confirm('Clear this inspection form?'))return;document.querySelectorAll('input,textarea').forEach(x=>x.value='');overallStatus.value='Monitor';build();result.style.display='none';notice.textContent=''}async function copyLink(){await navigator.clipboard.writeText(reportLink.value);notice.textContent='Link copied.'}build();</script></body></html>
