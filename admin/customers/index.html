<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<title>Customer Profiles</title>
<style>
:root{--navy:#163051;--red:#af2727;--green:#1d7f4f;--bg:#f4f7fb;--line:#dfe6ef;--muted:#60708a;--amber:#b96d09}
*{box-sizing:border-box}body{margin:0;font-family:Arial,sans-serif;background:var(--bg);color:var(--navy)}
button,.btn{border:0;border-radius:11px;padding:11px 15px;background:var(--navy);color:#fff;font:700 14px Arial,sans-serif;cursor:pointer;text-decoration:none;display:inline-flex;align-items:center;justify-content:center;gap:7px}.green{background:var(--green)}.red{background:var(--red)}.light{background:#eef3fa;color:var(--navy)}
.page{max-width:1500px;margin:0 auto;padding:18px 24px 50px}.page-head{display:flex;justify-content:space-between;align-items:flex-end;gap:16px;margin-bottom:16px}.page-head h1{font-size:30px;margin:0 0 4px;letter-spacing:-.025em}.page-head p{margin:0;color:var(--muted);font-size:14px}
.filters{background:#fff;border:1px solid #e3e9f1;border-radius:16px;padding:14px;box-shadow:0 5px 18px rgba(22,48,81,.06);display:grid;grid-template-columns:minmax(260px,1.5fr) minmax(150px,.55fr) auto;gap:10px;margin-bottom:14px}.filters input,.filters select{width:100%;height:43px;border:1px solid #dce4ee;border-radius:10px;padding:9px 11px;font:14px Arial,sans-serif;color:var(--navy);background:#fff}
.table-meta{display:flex;justify-content:space-between;align-items:center;gap:12px;color:var(--muted);font-size:12px;margin:2px 2px 10px}.result-count{font-weight:850;color:#43536b}.customer-table{background:#fff;border:1px solid #e1e7ef;border-radius:17px;box-shadow:0 7px 22px rgba(22,48,81,.06);overflow:hidden}.table-head,.customer-row{display:grid;grid-template-columns:minmax(210px,1.35fr) minmax(180px,1.1fr) minmax(160px,.9fr) minmax(120px,.65fr) minmax(150px,.8fr) 176px;gap:16px;align-items:center}.table-head{padding:11px 17px;background:#f8fafc;border-bottom:1px solid #e4e9f1;color:#748197;font-size:10px;font-weight:900;letter-spacing:.07em;text-transform:uppercase}.customer-entry{border-bottom:1px solid #e9edf3}.customer-entry:last-child{border-bottom:0}.customer-row{padding:14px 17px;transition:background .15s ease}.customer-entry:hover>.customer-row,.customer-entry.open>.customer-row{background:#fbfdff}.identity{display:flex;align-items:center;gap:11px;min-width:0}.avatar{width:40px;height:40px;flex:0 0 40px;border-radius:12px;background:#edf9f2;color:var(--green);font-size:13px;font-weight:900;display:flex;align-items:center;justify-content:center}.identity h2{font-size:14px;margin:0 0 3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.customer-id{font-size:11px;color:#8390a2}.contact{color:#45566e;font-size:12px;line-height:1.45;overflow-wrap:anywhere}.contact a{color:inherit;text-decoration:none}.cell-title{font-size:13px;font-weight:850;color:#273950}.cell-sub{color:var(--muted);font-size:11px;margin-top:3px;line-height:1.35}.vehicle-count{display:inline-flex;background:#edf3fa;border-radius:999px;padding:5px 8px;font-size:10px;font-weight:900;white-space:nowrap}.history-counts{display:flex;gap:5px;flex-wrap:wrap}.history-chip{background:#f1f5fa;color:#40536e;border-radius:999px;padding:5px 7px;font-size:10px;font-weight:850;white-space:nowrap}.row-actions{display:grid;grid-template-columns:1fr 1fr;gap:7px}.row-actions button{padding:9px 10px;font-size:12px}.details-btn::after{content:'⌄';font-size:12px;transition:transform .15s}.customer-entry.open .details-btn::after{transform:rotate(180deg)}.customer-expand{display:none;background:#f8fafc;border-top:1px solid #e7ecf3;padding:16px 17px 18px}.customer-entry.open .customer-expand{display:grid;grid-template-columns:minmax(0,1.35fr) minmax(240px,.65fr);gap:18px}.expand-title{margin:0 0 9px;color:#758298;font-size:10px;font-weight:900;letter-spacing:.08em;text-transform:uppercase}.vehicle-preview{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}.vehicle-line{border:1px solid #e2e8f0;border-radius:11px;background:#fff;padding:10px 11px}.vehicle-line strong{display:block;font-size:12px}.vehicle-line span{display:block;color:var(--muted);font-size:10px;margin-top:3px}.no-vehicle{font-size:12px;color:var(--muted);padding:7px 0}.notes-preview{font-size:12px;line-height:1.5;color:#45566e;background:#fff;border:1px solid #e2e8f0;border-radius:11px;padding:11px;min-height:42px;white-space:pre-wrap}.quick-actions{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:10px}.quick-actions .btn,.quick-actions button{padding:9px 10px;font-size:11px}.quick-actions .wide{grid-column:1/-1}.empty{background:#fff;border:1px solid #e3e9f1;border-radius:16px;padding:30px;text-align:center;color:var(--muted)}
.modal-overlay{display:none;position:fixed;inset:0;background:rgba(5,15,30,.58);z-index:9999;align-items:center;justify-content:center;padding:16px}.modal-overlay.open{display:flex}.modal{width:min(820px,100%);max-height:92vh;overflow:auto;background:#fff;border-radius:20px;padding:22px;position:relative}.close{position:absolute;right:15px;top:15px;width:38px;height:38px;padding:0;border:1px solid #d8e0eb;background:#fff;color:var(--navy);font-size:22px}.modal h2{margin:0 50px 4px 0;font-size:25px}.modal-sub{color:var(--muted);font-size:13px;margin-bottom:16px}.contact-grid{display:grid;grid-template-columns:1fr 1fr;gap:9px;margin-bottom:16px}.info{border:1px solid #e4eaf2;border-radius:11px;background:#f9fbfd;padding:11px}.info label{display:block;font-size:10px;text-transform:uppercase;font-weight:900;color:#7a899e;margin-bottom:4px}.info div{font-size:13px;font-weight:700;color:#34465e;overflow-wrap:anywhere}.section{margin-top:18px}.section-head{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:9px}.section h3{font-size:14px;margin:0}.vehicle-card{border:1px solid #e3e9f1;border-radius:13px;padding:12px;margin-bottom:9px}.vehicle-card-head{display:flex;justify-content:space-between;gap:10px}.vehicle-title{font-size:14px;font-weight:900}.vehicle-meta{font-size:11px;color:var(--muted);margin-top:4px}.history{margin-top:10px;border-top:1px solid #edf1f6;padding-top:9px}.history-row{display:grid;grid-template-columns:88px 1fr auto;gap:9px;align-items:center;padding:7px 0;border-top:1px solid #f0f3f7;font-size:12px}.history-row:first-child{border-top:0}.history-date{font-weight:800}.history-copy{min-width:0;color:#45566e}.history-copy strong{color:var(--navy)}.history-link{font-size:11px;font-weight:800;color:var(--navy);text-decoration:none}.note-box{background:#f8fafc;border:1px solid #e3e9f1;border-radius:11px;padding:12px;font-size:13px;line-height:1.5;white-space:pre-wrap;color:#45566e}.modal-actions{display:grid;grid-template-columns:repeat(2,1fr);gap:8px;margin-top:18px;padding-top:15px;border-top:1px solid #e7ecf3}
.edit-modal{width:min(650px,100%)}.form{display:grid;grid-template-columns:1fr 1fr;gap:10px 12px}.form label{display:block;font-size:12px;font-weight:800;margin:0 0 5px}.form input,.form textarea{width:100%;padding:12px;border:1px solid #dce4ee;border-radius:10px;font:14px Arial,sans-serif}.form textarea{min-height:105px;resize:vertical}.full{grid-column:1/-1}.edit-actions{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:16px}
@media(max-width:1050px){.table-head,.customer-row{grid-template-columns:minmax(190px,1.2fr) minmax(165px,1fr) minmax(130px,.75fr) minmax(120px,.65fr) 170px}.table-head>*:nth-child(5),.customer-row>*:nth-child(5){display:none}}
@media(max-width:760px){.page{padding:72px 10px 40px}.page-head{align-items:flex-start;flex-direction:column}.page-head .btn{width:100%}.filters{grid-template-columns:1fr}.table-meta span:last-child,.table-head{display:none}.customer-table{background:transparent;border:0;box-shadow:none;overflow:visible}.customer-entry{background:#fff;border:1px solid #e1e7ef;border-radius:15px;margin-bottom:10px;box-shadow:0 5px 16px rgba(22,48,81,.055);overflow:hidden}.customer-row{display:grid;grid-template-columns:1fr auto;gap:11px;padding:14px}.customer-row>*{display:block!important}.identity{grid-column:1}.row-actions{grid-column:2;grid-row:1;align-self:start;display:grid!important;grid-template-columns:1fr}.contact{grid-column:1/-1}.vehicles-cell,.last-cell,.history-cell{background:#f8fafc;border-radius:10px;padding:9px 10px}.vehicles-cell{grid-column:1}.last-cell{grid-column:2}.history-cell{grid-column:1/-1}.customer-entry.open .customer-expand{grid-template-columns:1fr;padding:14px}.vehicle-preview{grid-template-columns:1fr}.contact-grid,.form{grid-template-columns:1fr}.full{grid-column:auto}.modal-overlay{padding:8px;align-items:flex-end}.modal{border-radius:20px 20px 0 0;max-height:94vh}.modal-actions{grid-template-columns:1fr}.history-row{grid-template-columns:82px 1fr}.history-link{grid-column:2}.edit-actions{grid-template-columns:1fr 1fr}}
</style>
</head>
<body>
<script src="/config.js"></script>
<main class="page">
  <div class="page-head"><div><h1>Customer Profiles</h1><p>Customers, vehicles, appointments, inspections, and shop notes in one place.</p></div><button class="green" onclick="openAdd()">+ Add Customer</button></div>
  <section class="filters"><input id="search" placeholder="Search name, phone, email, vehicle, service, notes..." oninput="render()"><select id="vehicleFilter" onchange="render()"><option value="">All Customers</option><option value="multi">Multiple Vehicles</option><option value="inspection">Has Inspections</option><option value="appointment">Has Appointments</option></select><button class="light" onclick="search.value='';vehicleFilter.value='';render()">Clear</button></section>
  <div class="table-meta"><span id="resultMeta" class="result-count">Loading customers…</span><span>Use Details to expand a customer without leaving the list.</span></div>
  <div id="grid" class="customer-table"><div class="empty">Loading customers...</div></div>
</main>
<div id="detailModal" class="modal-overlay" onclick="if(event.target===this)closeDetail()"><div class="modal"><button class="close" onclick="closeDetail()">×</button><div id="detailContent"></div></div></div>
<div id="editModal" class="modal-overlay" onclick="if(event.target===this)closeEdit()"><div class="modal edit-modal"><button class="close" onclick="closeEdit()">×</button><h2 id="editTitle">Edit Customer</h2><div class="modal-sub">Customer contact information and shop notes.</div><input type="hidden" id="fId"><div class="form"><div><label>Name *</label><input id="fName"></div><div><label>Phone *</label><input id="fPhone"></div><div class="full"><label>Email</label><input id="fEmail"></div><div class="full"><label>Internal Customer Notes</label><textarea id="fNotes" placeholder="Shop-only notes about this customer..."></textarea></div></div><div class="edit-actions"><button class="green" onclick="saveCustomer()">Save Customer</button><button class="light" onclick="closeEdit()">Cancel</button></div></div></div>
<script>
let customers=[],appointments=[],inspections=[],vehicleCache=new Map();
function esc(v){return String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}function norm(v){let d=String(v||'').replace(/\D/g,'');if(d.length===11&&d[0]==='1')d=d.slice(1);return d}function lower(v){return String(v||'').toLowerCase()}function initials(n){return String(n||'C').trim().split(/\s+/).slice(0,2).map(x=>x[0]).join('').toUpperCase()}function date(v){if(!v)return'';const d=new Date(v+'T12:00:00');return Number.isNaN(d.getTime())?v:d.toLocaleDateString(undefined,{month:'short',day:'numeric',year:'numeric'})}function inspectionDate(v){const d=new Date(v);return Number.isNaN(d.getTime())?'':d.toLocaleDateString(undefined,{month:'short',day:'numeric',year:'numeric'})}
function customerAppointments(c){const p=norm(c.phone);return appointments.filter(a=>(a.customer_id&&a.customer_id===c.id)||norm(a.phone)===p)}function customerInspections(c){const p=norm(c.phone);return inspections.filter(i=>(i.customer_id&&i.customer_id===c.id)||norm(i.phone)===p)}
function inferredVehicles(c){const map=new Map();const add=(vehicle)=>{const label=vehicleLabel(vehicle),key=lower(label);if(!key)return;const existing=map.get(key);if(!existing)map.set(key,vehicle);else if(!existing.id&&vehicle.id)map.set(key,{...existing,...vehicle})};for(const a of customerAppointments(c)){const label=[a.year,a.make,a.model].filter(Boolean).join(' ').trim();if(!label||label.includes('N/A'))continue;add({id:a.vehicle_id||null,year:a.year,make:a.make,model:a.model,label})}for(const i of customerInspections(c)){const label=String(i.vehicle||'').trim();if(!label)continue;add({id:i.vehicle_id||null,label})}return[...map.values()]}
async function getVehicles(c){if(vehicleCache.has(c.id))return vehicleCache.get(c.id);try{const r=await fetch('/api/customer-lookup?phone='+encodeURIComponent(norm(c.phone)),{cache:'no-store'}),j=await r.json();const v=r.ok&&j.found?(j.vehicles||[]):[];const all=v.length?v:inferredVehicles(c);vehicleCache.set(c.id,all);return all}catch{const all=inferredVehicles(c);vehicleCache.set(c.id,all);return all}}
function vehicleLabel(v){return v.label||[v.year,v.make,v.model].filter(Boolean).join(' ')||'Vehicle'}
function displayVehicles(c){return vehicleCache.get(c.id)||inferredVehicles(c)}
function hasVehicleMatch(record,v){if(v.id&&record.vehicle_id)return record.vehicle_id===v.id;const label=lower(vehicleLabel(v));const recLabel=lower(record.vehicle||[record.year,record.make,record.model].filter(Boolean).join(' '));return label&&recLabel===label}
function customerSearchText(c){const ap=customerAppointments(c),ins=customerInspections(c),vehicles=displayVehicles(c);return[c.name,c.phone,c.email,c.notes,c.last_service,c.vehicle,...vehicles.map(vehicleLabel),...ap.flatMap(a=>[a.service,a.year,a.make,a.model,a.message,a.internal_notes]),...ins.flatMap(i=>[i.vehicle,i.technician,i.recommendations])].join(' ').toLowerCase()}
function lastActivity(c){const events=[...customerAppointments(c).map(a=>({when:a.appointment_date,type:'Appointment',detail:a.service||'Service appointment'})),...customerInspections(c).map(i=>({when:i.created_at,type:'Inspection',detail:i.vehicle||'Vehicle inspection'}))].filter(x=>x.when).sort((a,b)=>String(b.when).localeCompare(String(a.when)));return events[0]||null}
function actionLinks(c){const customer={customerPhone:c.phone||'',customerName:c.name||'',customerEmail:c.email||''},appointment=new URLSearchParams({newAppointment:'1',...customer}),messages=new URLSearchParams({messages:'1',...customer}),inspection=new URLSearchParams({phone:c.phone||'',name:c.name||'',email:c.email||''});return{appointment:'/admin?'+appointment.toString(),messages:'/admin?'+messages.toString(),inspection:'/admin/inspection?'+inspection.toString()}}
function customerRow(c){const ap=customerAppointments(c),ins=customerInspections(c),vs=displayVehicles(c),latest=lastActivity(c),links=actionLinks(c),id=esc(c.id),phone=esc(c.phone||'No phone'),email=c.email?`<a href="mailto:${esc(c.email)}">${esc(c.email)}</a>`:'No email';const vehicleList=vs.length?vs.map(v=>{const vehicleAppts=ap.filter(a=>hasVehicleMatch(a,v)).length,vehicleInspections=ins.filter(i=>hasVehicleMatch(i,v)).length;return `<div class="vehicle-line"><strong>${esc(vehicleLabel(v))}</strong><span>${vehicleAppts} appointment${vehicleAppts===1?'':'s'} • ${vehicleInspections} inspection${vehicleInspections===1?'':'s'}</span></div>`}).join(''):'<div class="no-vehicle">No saved vehicle history yet.</div>';return `<article class="customer-entry" id="customer-${id}"><div class="customer-row"><div class="identity"><div class="avatar">${esc(initials(c.name))}</div><div><h2>${esc(c.name||'Customer')}</h2><div class="customer-id">Customer profile</div></div></div><div class="contact">${phone}<br>${email}</div><div class="vehicles-cell"><div class="cell-title"><span class="vehicle-count">${vs.length} vehicle${vs.length===1?'':'s'}</span></div><div class="cell-sub">${vs.length?esc(vehicleLabel(vs[0])):'No vehicle saved'}</div></div><div class="last-cell"><div class="cell-title">${latest?esc(latest.type==='Inspection'?inspectionDate(latest.when):date(latest.when)):'No visits yet'}</div><div class="cell-sub">${latest?esc(latest.detail):'No service history'}</div></div><div class="history-cell"><div class="history-counts"><span class="history-chip">${ap.length} appointment${ap.length===1?'':'s'}</span><span class="history-chip">${ins.length} inspection${ins.length===1?'':'s'}</span></div></div><div class="row-actions"><button onclick="openDetail('${id}')">View</button><button class="light details-btn" aria-expanded="false" onclick="toggleRow('${id}',this)">Details</button></div></div><div class="customer-expand"><div><h3 class="expand-title">Vehicles & history</h3><div class="vehicle-preview">${vehicleList}</div></div><div><h3 class="expand-title">Shop notes</h3><div class="notes-preview">${esc(c.notes||'No customer notes added.')}</div><div class="quick-actions">${c.phone?`<a class="btn green wide" href="${esc(links.messages)}">Text Customer</a>`:''}<a class="btn" href="${esc(links.appointment)}">New Appointment</a><a class="btn" href="${esc(links.inspection)}">New Inspection</a><button class="light wide" onclick="editCustomer('${id}')">Edit Customer</button></div></div></div></article>`}
function render(){const q=lower(search.value.trim()),filter=vehicleFilter.value;const rows=customers.filter(c=>{const ap=customerAppointments(c),ins=customerInspections(c),vs=displayVehicles(c);if(q&&!customerSearchText(c).includes(q))return false;if(filter==='multi'&&vs.length<2)return false;if(filter==='inspection'&&!ins.length)return false;if(filter==='appointment'&&!ap.length)return false;return true});resultMeta.textContent=`${rows.length} customer${rows.length===1?'':'s'}`;if(!rows.length){grid.className='';grid.innerHTML='<div class="empty">No customers match these filters.</div>';return}grid.className='customer-table';grid.innerHTML=`<div class="table-head"><div>Customer</div><div>Contact</div><div>Vehicles</div><div>Last Visit</div><div>History</div><div>Actions</div></div>${rows.map(customerRow).join('')}`}
function toggleRow(id,button){const row=document.getElementById('customer-'+id);if(!row)return;const open=row.classList.toggle('open');button.setAttribute('aria-expanded',String(open))}
function historyForVehicle(c,v){const ap=customerAppointments(c).filter(a=>hasVehicleMatch(a,v)).map(a=>({type:'Appointment',when:a.appointment_date,title:a.service||'Service appointment',detail:a.appointment_time||'',id:a.id}));const ins=customerInspections(c).filter(i=>hasVehicleMatch(i,v)).map(i=>({type:'Inspection',when:i.created_at,title:'Vehicle Inspection',detail:i.technician?`Technician: ${i.technician}`:'',id:i.id}));return[...ap,...ins].sort((a,b)=>String(b.when).localeCompare(String(a.when)))}
async function openDetail(id){const c=customers.find(x=>x.id===id);if(!c)return;detailContent.innerHTML='<h2>Loading profile…</h2>';detailModal.classList.add('open');const vehicles=await getVehicles(c),ap=customerAppointments(c),ins=customerInspections(c),links=actionLinks(c);const vehicleSections=vehicles.length?vehicles.map(v=>{const hist=historyForVehicle(c,v);return `<div class="vehicle-card"><div class="vehicle-card-head"><div><div class="vehicle-title">${esc(vehicleLabel(v))}</div><div class="vehicle-meta">${[v.plate&&'Plate '+v.plate,v.vin&&'VIN '+v.vin,v.mileage&&v.mileage+' mi'].filter(Boolean).map(esc).join(' • ')||'Saved vehicle'}</div></div></div><div class="history">${hist.length?hist.map(h=>`<div class="history-row"><div class="history-date">${esc(h.type==='Appointment'?date(h.when):inspectionDate(h.when))}</div><div class="history-copy"><strong>${esc(h.title)}</strong>${h.detail?'<br>'+esc(h.detail):''}</div>${h.type==='Inspection'?`<a class="history-link" href="/inspection?id=${esc(h.id)}" target="_blank">Report</a>`:''}</div>`).join(''):'<div class="no-vehicle">No history for this vehicle yet.</div>'}</div></div>`}).join(''):'<div class="note-box">No vehicle history saved yet.</div>';detailContent.innerHTML=`<h2>${esc(c.name||'Customer')}</h2><div class="modal-sub">${vehicles.length} vehicle${vehicles.length===1?'':'s'} • ${ap.length} appointment${ap.length===1?'':'s'} • ${ins.length} inspection${ins.length===1?'':'s'}</div><div class="contact-grid"><div class="info"><label>Phone</label><div>${esc(c.phone||'Not provided')}</div></div><div class="info"><label>Email</label><div>${esc(c.email||'Not provided')}</div></div></div><div class="section"><div class="section-head"><h3>Vehicles & Service History</h3></div>${vehicleSections}</div><div class="section"><h3>Internal Customer Notes</h3><div class="note-box">${esc(c.notes||'No customer notes added.')}</div></div><div class="modal-actions">${c.phone?`<a class="btn green" href="${esc(links.messages)}">Text Customer</a>`:'<span></span>'}<button class="light" onclick="closeDetail();editCustomer('${c.id}')">Edit Customer</button></div>`}
function closeDetail(){detailModal.classList.remove('open')}
function openAdd(){editTitle.textContent='Add Customer';fId.value='';fName.value='';fPhone.value='';fEmail.value='';fNotes.value='';editModal.classList.add('open')}
function editCustomer(id){const c=customers.find(x=>x.id===id);if(!c)return;editTitle.textContent='Edit Customer';fId.value=c.id;fName.value=c.name||'';fPhone.value=c.phone||'';fEmail.value=c.email||'';fNotes.value=c.notes||'';editModal.classList.add('open')}
function closeEdit(){editModal.classList.remove('open')}
async function saveCustomer(){const body={action:'customer',id:fId.value,name:fName.value.trim(),phone:fPhone.value.trim(),email:fEmail.value.trim(),notes:fNotes.value.trim()};if(!body.name||!body.phone)return alert('Name and phone are required.');const method=body.id?'PATCH':'POST';const r=await fetch('/api/admin-data?action=customer',{method,headers:{'Content-Type':'application/json'},body:JSON.stringify(body)}),j=await r.json();if(!r.ok)return alert(j.error||'Could not save customer');closeEdit();vehicleCache.clear();await load()}
async function load(){grid.className='';grid.innerHTML='<div class="empty">Loading customers...</div>';resultMeta.textContent='Loading customers…';try{const [cr,ar,ir]=await Promise.all([fetch('/api/admin-data?action=customers',{cache:'no-store'}),fetch('/api/admin-data?action=appointments',{cache:'no-store'}),fetch('/api/admin-data?action=inspections',{cache:'no-store'})]);if(cr.status===401||ar.status===401||ir.status===401){location.href='/admin';return}const [cj,aj,ij]=await Promise.all([cr.json(),ar.json(),ir.json()]);if(!cr.ok)throw new Error(cj.error||'Unable to load customers');customers=cj.customers||[];appointments=aj.appointments||[];inspections=ij.inspections||[];vehicleCache.clear();await Promise.all(customers.map(c=>getVehicles(c)));render()}catch(e){resultMeta.textContent='Unable to load customers';grid.innerHTML=`<div class="empty">${esc(e.message||'Could not load customer profiles.')}</div>`}}
load();
</script>
</body>
</html>
