<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<title>Requested Inspections</title>
<style>
:root{--navy:#172033;--blue:#2563eb;--green:#168052;--amber:#c46f09;--red:#bc2f37;--muted:#68768a;--line:#e1e7ef;--bg:#f5f7fb}*{box-sizing:border-box}html,body{margin:0;min-height:100%;font-family:Inter,Arial,sans-serif;background:var(--bg);color:var(--navy)}button,select{font:inherit}.page{max-width:1380px;margin:0 auto;padding:28px 28px 60px}.page-head{display:flex;align-items:flex-end;justify-content:space-between;gap:18px;margin-bottom:18px}.page-head h1{font-size:30px;letter-spacing:-.035em;margin:0}.page-head p{font-size:14px;color:var(--muted);margin:7px 0 0}.scope-toggle{display:flex;gap:4px;padding:4px;background:#e9eef6;border-radius:12px}.scope-toggle button{border:0;border-radius:9px;background:transparent;color:#55657a;padding:8px 13px;font-size:12px;font-weight:850;cursor:pointer}.scope-toggle button.active{background:#fff;color:var(--navy);box-shadow:0 2px 8px rgba(15,23,42,.09)}.request-list{display:flex;flex-direction:column;gap:10px}.request{display:grid;grid-template-columns:minmax(220px,1.1fr) minmax(190px,.9fr) minmax(230px,1fr) minmax(130px,.55fr) auto;align-items:center;gap:18px;background:#fff;border:1px solid var(--line);border-radius:15px;padding:16px 17px;box-shadow:0 5px 18px rgba(15,23,42,.045)}.request.focus{border-color:#8bb2f6;box-shadow:0 0 0 3px rgba(37,99,235,.09),0 8px 24px rgba(15,23,42,.06)}.customer strong,.vehicle strong{display:block;font-size:14px}.customer span,.vehicle span,.meta{display:block;color:var(--muted);font-size:12px;margin-top:4px}.assignment label{display:block;color:#6c7a8e;font-size:10px;font-weight:900;text-transform:uppercase;letter-spacing:.06em;margin-bottom:5px}.assignment select{width:100%;min-height:40px;border:1px solid #d6deea;border-radius:10px;background:#fff;color:var(--navy);padding:8px 10px;font-size:13px;font-weight:750}.assignment select:disabled{background:#f4f6f9;color:#657286}.status{display:inline-flex;align-items:center;gap:7px;border-radius:999px;padding:7px 10px;font-size:11px;font-weight:900;width:max-content}.status:before{content:'';width:8px;height:8px;border-radius:50%;background:currentColor}.status.incomplete{background:#fff5df;color:#a56408}.status.complete{background:#e7f7ef;color:#137347}.btn{border:0;border-radius:10px;padding:10px 13px;background:var(--blue);color:#fff;text-decoration:none;font-size:12px;font-weight:850;display:inline-flex;align-items:center;justify-content:center;white-space:nowrap}.btn:hover{filter:brightness(.96)}.waiting{color:var(--muted);font-size:12px;font-weight:750}.empty{background:#fff;border:1px dashed #cfd8e5;border-radius:16px;padding:42px 20px;text-align:center;color:var(--muted)}.empty strong{display:block;color:var(--navy);font-size:17px;margin-bottom:6px}.loading{padding:60px;text-align:center;color:var(--muted)}
@media(max-width:1050px){.request{grid-template-columns:1fr 1fr}.assignment{grid-column:1/-1}.request-action{justify-self:end}}
@media(max-width:640px){.page{padding:74px 12px 40px}.page-head{align-items:flex-start;flex-direction:column}.scope-toggle{width:100%}.scope-toggle button{flex:1}.request{grid-template-columns:1fr;gap:12px}.assignment{grid-column:auto}.request-action{justify-self:stretch}.request-action .btn{width:100%}.status{justify-self:start}}
</style>
</head>
<body>
<script src="/config.js"></script>
<main class="page">
  <div class="page-head"><div><h1>Requested Inspections</h1><p>Online appointments appear here automatically. Assign a technician or leave an inspection available to claim.</p></div><div class="scope-toggle" aria-label="Inspection date filter"><button id="showAll" class="active" type="button">All</button><button id="showToday" type="button">Today</button></div></div>
  <div id="requestList" class="loading">Loading requested inspections…</div>
</main>
<script>
let requests=[],technicians=[],appointments=[],scope='all';
const list=document.getElementById('requestList'),focusAppointment=new URLSearchParams(location.search).get('appointment')||'';
function todayKey(){const now=new Date();return`${now.getFullYear()}-${String(now.getMonth()+1).padStart(2,'0')}-${String(now.getDate()).padStart(2,'0')}`}
function esc(value){return String(value??'').replace(/[&<>"']/g,char=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[char]))}
function formatDate(value){if(!value)return'Not set';const date=new Date(value);if(Number.isNaN(date.getTime()))return value;return date.toLocaleDateString(undefined,{month:'short',day:'numeric',year:'numeric',hour:'numeric',minute:'2-digit'})}
function technicianOptions(item){const active=technicians.filter(tech=>tech.active),hasCurrent=item.technician_id&&active.some(tech=>tech.id===item.technician_id),unassigned=item.status==='completed'?'':'<option value="">Unassigned — available to claim</option>';return unassigned+active.map(tech=>`<option value="${esc(tech.id)}" ${tech.id===item.technician_id?'selected':''}>${esc(tech.name)}</option>`).join('')+(!hasCurrent&&item.technician_id?`<option value="${esc(item.technician_id)}" selected>${esc(item.technician_name||'Inactive technician')}</option>`:'')}
function render(){const todayIds=new Set(appointments.filter(item=>item.appointment_date===todayKey()&&item.status!=='cancelled').map(item=>item.id)),allRows=requests.filter(item=>item.status!=='cancelled'),rows=(scope==='today'?allRows.filter(item=>todayIds.has(item.appointment_id)):allRows).sort((a,b)=>{if(a.appointment_id===focusAppointment)return-1;if(b.appointment_id===focusAppointment)return 1;if((a.status==='completed')!==(b.status==='completed'))return a.status==='completed'?1:-1;return String(b.created_at).localeCompare(String(a.created_at))});showAll.classList.toggle('active',scope==='all');showToday.classList.toggle('active',scope==='today');showAll.textContent=`All (${allRows.length})`;showToday.textContent=`Today (${allRows.filter(item=>todayIds.has(item.appointment_id)).length})`;list.className='request-list';if(!rows.length){list.innerHTML=`<div class="empty"><strong>${scope==='today'?'No inspections scheduled for today':'No requested inspections'}</strong>${scope==='today'?'Switch to All to see earlier requests.':'New online appointments will appear here automatically.'}</div>`;return}list.innerHTML=rows.map(item=>{const complete=item.status==='completed';return`<article class="request ${item.appointment_id===focusAppointment?'focus':''}"><div class="customer"><strong>${esc(item.customer_name)}</strong><span>${esc(item.phone||item.email||'No contact information')}</span></div><div class="vehicle"><strong>${esc(item.vehicle)}</strong><span>${item.mileage?esc(item.mileage)+' miles':'Mileage not entered'}</span></div><div class="assignment"><label>Assigned technician</label><select data-assign="${esc(item.id)}">${technicianOptions(item)}</select></div><div><span class="status ${complete?'complete':'incomplete'}">${complete?'Completed':'Incomplete'}</span><span class="meta">Requested ${esc(formatDate(item.created_at))}</span></div><div class="request-action">${complete&&item.inspection_id?`<a class="btn" target="_blank" href="/inspection?id=${encodeURIComponent(item.inspection_id)}">View Report</a>`:'<span class="waiting">Waiting for inspection</span>'}</div></article>`}).join('');list.querySelectorAll('[data-assign]').forEach(select=>select.onchange=()=>assignTechnician(select.dataset.assign,select.value,select))}
showAll.onclick=()=>{scope='all';render()};showToday.onclick=()=>{scope='today';render()};
async function assignTechnician(id,technicianId,select){const original=requests.find(item=>item.id===id)?.technician_id||'';select.disabled=true;try{const response=await fetch('/api/admin-data?action=inspection-request',{method:'PATCH',headers:{'Content-Type':'application/json'},body:JSON.stringify({id,technician_id:technicianId})}),json=await response.json();if(response.status===401){location.href='/admin';return}if(!response.ok)throw new Error(json.error||'Could not update technician');const index=requests.findIndex(item=>item.id===id),tech=technicians.find(item=>item.id===technicianId);if(index>=0)requests[index]={...requests[index],...json.request,technician_name:tech?.name||'Unassigned'};render()}catch(error){select.value=original;select.disabled=false;alert(error.message)}}
async function load(){try{const [requestResponse,settingsResponse,appointmentResponse]=await Promise.all([fetch('/api/admin-data?action=inspection-requests',{cache:'no-store'}),fetch('/api/admin-data?action=shop-settings',{cache:'no-store'}),fetch('/api/admin-data?action=appointments',{cache:'no-store'})]);if(requestResponse.status===401||settingsResponse.status===401||appointmentResponse.status===401){location.href='/admin';return}const [requestJson,settingsJson,appointmentJson]=await Promise.all([requestResponse.json(),settingsResponse.json(),appointmentResponse.json()]);if(!requestResponse.ok)throw new Error(requestJson.error||'Could not load requested inspections');if(!settingsResponse.ok)throw new Error(settingsJson.error||'Could not load technicians');if(!appointmentResponse.ok)throw new Error(appointmentJson.error||'Could not load appointments');requests=requestJson.requests||[];technicians=(settingsJson.shop?.technicians||[]).filter(item=>item.id);appointments=appointmentJson.appointments||[];render()}catch(error){list.className='empty';list.innerHTML=`<strong>Could not load requested inspections</strong>${esc(error.message)}`}}
load();
</script>
</body>
</html>
