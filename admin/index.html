<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="robots" content="noindex,nofollow"><title>Shop Admin</title><style>
*{box-sizing:border-box}body{margin:0;font-family:Arial,sans-serif;background:#f4f7fb;color:#163051}button,.btn{border:0;border-radius:12px;padding:12px 18px;background:#af2727;color:#fff;font-weight:800;cursor:pointer;font-size:15px;text-decoration:none;display:inline-flex;align-items:center;justify-content:center;gap:8px}button:hover,.btn:hover{background:#911f1f}input,select,textarea{width:100%;padding:12px;border:1px solid #d8dee9;border-radius:12px;font:15px Arial,sans-serif}textarea{min-height:90px;resize:vertical}label{display:block;font-size:13px;font-weight:800;margin:10px 0 6px}.hidden{display:none!important}
.login-screen{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px;background:linear-gradient(135deg,#163051,#0c1b30)}.login-card{width:100%;max-width:420px;background:#fff;padding:32px;border-radius:20px;box-shadow:0 20px 50px rgba(0,0,0,.25);text-align:center}.brand-box{background:#fff;color:#163051;border-radius:14px;padding:16px 22px;font-size:25px;font-weight:900;letter-spacing:-.04em;box-shadow:0 8px 22px rgba(0,0,0,.12)}.login-card .brand-box{margin:0 auto 20px}.error{color:#af2727;font-size:14px;margin-top:10px}
.admin{display:none;min-height:100vh}.admin-hero{background:#163051;padding:26px}.admin-action-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:18px;max-width:1500px;margin:auto}.admin-action-card{min-height:124px;border-radius:18px;background:#fff;color:#163051;display:flex;align-items:center;gap:18px;padding:22px 24px;text-align:left;box-shadow:0 12px 28px rgba(0,0,0,.16);text-decoration:none}.admin-action-card:hover{background:#fff;transform:translateY(-1px)}.logo-card{justify-content:center}.logo-card .brand-box{width:100%;text-align:center;box-shadow:none}.action-icon{width:58px;height:58px;flex:0 0 58px;border-radius:18px;background:#eaf8f0;color:#1d9958;display:flex;align-items:center;justify-content:center;font-size:30px;font-weight:900}.action-title{font-size:24px;font-weight:800;line-height:1.1}.action-subtitle{margin-top:8px;font-size:18px;color:#3f4c5f;line-height:1.25}.logout-card{justify-content:center;background:linear-gradient(135deg,#af2727,#cf2f2f)!important;color:#fff!important}.logout-card .action-title{color:#fff;font-size:27px}
.dashboard{padding:24px;display:grid;grid-template-columns:minmax(0,1.2fr) minmax(320px,.8fr);gap:22px;max-width:1500px;margin:auto}.card{background:#fff;border-radius:18px;padding:20px;box-shadow:0 8px 24px rgba(22,48,81,.08);border:1px solid #e6ebf2}.calendar-header{display:grid;grid-template-columns:auto 1fr auto;align-items:center;gap:12px;margin-bottom:12px}.calendar-title-wrap{text-align:center}.calendar-title-wrap h2{margin:0 0 8px;font-size:30px}.secondary-btn{background:#163051}.light-btn{background:#eef3fa;color:#163051}.green-btn{background:#1d7f4f}.calendar-grid{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:8px}.day-name{text-align:center;font-weight:800;font-size:13px;color:#61708a;padding:4px 0}.day{min-height:92px;border:1px solid #e4e9f2;border-radius:12px;padding:8px;background:#fbfcff;overflow:hidden}.day.today{border:2px solid #af2727;background:#fff7f7}.day-number{font-weight:800;margin-bottom:6px}.appointment-dot{background:#163051;color:#fff;border-radius:8px;padding:5px 7px;margin-top:4px;font-size:11px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;cursor:pointer}.status-new,.status-pending{background:#2563eb!important}.status-confirmed{background:#16a34a!important}.status-checked-in{background:#f97316!important}.status-in-progress{background:#7c3aed!important}.status-waiting-approval{background:#d97706!important}.status-completed{background:#6b7280!important}.status-cancelled{background:#dc2626!important}.side{display:flex;flex-direction:column;gap:22px}.appointment{border-left:4px solid #af2727;background:#f8fafd;padding:12px;border-radius:12px;margin-bottom:10px;cursor:pointer}.appointment:hover{background:#eef4ff}.appointment strong{display:block;margin-bottom:4px}.appointment small{color:#60708a;display:block;margin-top:3px}.status-pill{display:inline-block;margin-top:7px;padding:4px 8px;border-radius:999px;background:#eaf0f7;font-size:11px;font-weight:800}.section-title{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:12px}.section-title h2{margin:0}.empty{color:#7b8797;font-size:14px}
.footer-actions{max-width:1500px;margin:0 auto 100px;padding:0 24px;display:grid;grid-template-columns:1fr 1fr;gap:12px}.footer-actions button{min-height:54px;border-radius:16px}.notifications-on{background:#1d9958!important}
.modal-overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,.55);z-index:999;align-items:center;justify-content:center;padding:18px}.modal-overlay.open{display:flex}.modal{width:100%;max-width:650px;max-height:92vh;overflow:auto;background:#fff;border-radius:20px;padding:24px;box-shadow:0 20px 60px rgba(0,0,0,.3);position:relative}.modal h2{margin:0 0 8px}.modal-x{position:absolute;top:14px;right:16px;width:38px;height:38px;padding:0;background:#fff;color:#333;border:2px solid #af2727;font-size:26px}.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px 12px}.full{grid-column:1/-1}.modal-actions{display:flex;gap:8px;margin-top:18px;flex-wrap:wrap}.modal-actions>*{flex:1 1 140px}.meta{color:#60708a;font-size:14px;line-height:1.6}.danger-btn{background:#dc2626}
#openTextPanelBtn{position:fixed;bottom:20px;right:20px;z-index:900;background:#af2727;box-shadow:0 8px 25px rgba(0,0,0,.25);border-radius:999px;padding:15px 20px}#textPanel .modal{max-width:1000px;height:min(720px,90vh);display:grid;grid-template-columns:280px 1fr;padding:0;overflow:hidden}.sms-side{border-right:1px solid #dce4ef;background:#f7f9fc;padding:16px;overflow:auto}.sms-main{display:grid;grid-template-rows:auto 1fr auto;min-height:0}.sms-head{padding:16px;border-bottom:1px solid #dce4ef;background:#fff}.sms-thread{padding:18px;overflow:auto;background:#eef3fa}.bubble{max-width:78%;padding:10px 13px;border-radius:16px;margin:7px 0;line-height:1.35;font-size:14px}.bubble.out{margin-left:auto;background:#163051;color:#fff;border-bottom-right-radius:4px}.bubble.in{background:#fff;border:1px solid #dce4ef;border-bottom-left-radius:4px}.sms-compose{display:flex;gap:8px;padding:12px;background:#fff;border-top:1px solid #dce4ef}.sms-compose textarea{min-height:44px;height:44px}.conv{padding:10px;border-radius:12px;cursor:pointer;margin-bottom:8px}.conv:hover,.conv.active{background:#e7eef8}.conv strong{display:block}.conv small{color:#60708a}
@media(max-width:900px){.admin-hero{padding:22px 12px}.admin-action-grid{gap:10px}.admin-action-card{min-height:78px;padding:12px;gap:10px}.action-icon{width:42px;height:42px;flex-basis:42px;font-size:22px}.action-title{font-size:15px}.action-subtitle{font-size:12px;margin-top:4px}.logout-card .action-title{font-size:18px}.dashboard{grid-template-columns:1fr;padding:14px}.calendar-grid{gap:4px}.day{min-height:70px;padding:5px}.appointment-dot{font-size:9px}.footer-actions{padding:0 14px;margin-bottom:90px}.form-grid{grid-template-columns:1fr}.full{grid-column:auto}#textPanel .modal{grid-template-columns:1fr;height:95vh}.sms-side{display:none}.sms-main{grid-column:1}.brand-box{font-size:20px}}
</style></head><body><script src="/config.js"></script><section class="login-screen" id="loginScreen"><div class="login-card"><div class="brand-box" id="loginBrand">AUTO SHOP</div><h2>Admin Login</h2><p>Private appointment dashboard</p><input type="password" id="passwordInput" placeholder="Enter password"><button onclick="login()">Login</button><div class="error" id="loginError"></div></div></section>
<section class="admin" id="adminDashboard"><header class="admin-hero"><div class="admin-action-grid"><div class="admin-action-card logo-card"><div class="brand-box shopBrand">AUTO SHOP</div></div><button class="admin-action-card" onclick="openCreateModal()"><span class="action-icon">＋</span><span><span class="action-title">New Appointment</span><span class="action-subtitle">Schedule a new<br>service appointment</span></span></button><a class="admin-action-card" href="/admin/inspection"><span class="action-icon">✓</span><span><span class="action-title">Inspection Form</span><span class="action-subtitle">Create a new<br>inspection form</span></span></a><a class="admin-action-card" href="/admin/inspection-history"><span class="action-icon">↺</span><span><span class="action-title">Inspection History</span><span class="action-subtitle">View past<br>inspections</span></span></a><a class="admin-action-card" href="/admin/customers"><span class="action-icon">👥</span><span><span class="action-title">Customer Profiles</span><span class="action-subtitle">Manage customer<br>information</span></span></a><button class="admin-action-card logout-card" onclick="logout()"><span class="action-title">Log Out</span></button></div></header>
<div class="dashboard"><div class="card"><div class="calendar-header"><button onclick="moveMonth(-1)">‹</button><div class="calendar-title-wrap"><h2 id="monthTitle"></h2><button class="light-btn" onclick="goToday()">Today</button></div><button onclick="moveMonth(1)">›</button></div><div class="calendar-grid" id="calendar"></div></div><div class="side"><div class="card"><div class="section-title"><h2>Today's Appointments</h2><button class="light-btn" onclick="loadAll()">Refresh</button></div><div id="todayList"></div></div><div class="card"><div class="section-title"><h2>Upcoming</h2></div><div id="upcomingList"></div></div></div></div><div class="footer-actions"><button id="notifyBtn" onclick="enableNotifications()">Notifications Off</button><button onclick="logout()">Log Out</button></div></section>
<button id="openTextPanelBtn" class="hidden" onclick="openTextPanel()">Text Customer</button>
<div class="modal-overlay" id="apptModal"><div class="modal"><button class="modal-x" onclick="closeModal('apptModal')">×</button><div id="apptModalBody"></div></div></div>
<div class="modal-overlay" id="createModal"><div class="modal"><button class="modal-x" onclick="closeModal('createModal')">×</button><h2>New Appointment</h2><div class="form-grid"><div><label>Name</label><input id="cName"></div><div><label>Phone</label><input id="cPhone"></div><div><label>Email</label><input id="cEmail"></div><div><label>Service</label><input id="cService" placeholder="Oil Change"></div><div><label>Year</label><input id="cYear"></div><div><label>Make</label><input id="cMake"></div><div><label>Model</label><input id="cModel"></div><div><label>Date</label><input id="cDate" type="date"></div><div><label>Time</label><select id="cTime"></select></div><div><label>Status</label><select id="cStatus"></select></div><div class="full"><label>Customer Message</label><textarea id="cMessage"></textarea></div><div class="full"><label>Internal Notes</label><textarea id="cNotes"></textarea></div></div><div class="modal-actions"><button class="green-btn" onclick="createAppointment()">Create Appointment</button><button class="light-btn" onclick="closeModal('createModal')">Cancel</button></div><div id="createNotice" class="meta"></div></div></div>
<div class="modal-overlay" id="textPanel"><div class="modal"><div class="sms-side"><h2>Messages</h2><button style="width:100%;margin-bottom:12px" onclick="newText()">New Message</button><div id="conversationList"></div></div><div class="sms-main"><div class="sms-head"><div style="display:flex;justify-content:space-between;gap:12px;align-items:center"><div><strong id="smsName">New Message</strong><div class="meta" id="smsPhoneLabel"></div></div><button class="light-btn" onclick="closeModal('textPanel')">Close</button></div><div id="manualTextFields" style="display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:10px"><input id="smsManualName" placeholder="Customer name"><input id="smsManualPhone" placeholder="Phone number"></div></div><div class="sms-thread" id="smsThread"></div><div class="sms-compose"><textarea id="smsMessage" placeholder="Type a message..."></textarea><button onclick="sendSms()">Send</button></div></div></div></div>
<script>
const cfg=window.SHOP_CONFIG||{};document.getElementById('loginBrand').textContent=cfg.name||'AUTO SHOP';document.querySelectorAll('.shopBrand').forEach(x=>x.textContent=cfg.name||'AUTO SHOP');
let appointments=[],currentMonth=new Date(),activeAppt=null,messages=[],activePhone='';const statuses=['pending','new','confirmed','checked-in','in-progress','waiting-approval','completed','cancelled'];const slots=cfg.appointment?.slots||['9:00 AM','9:30 AM','10:00 AM','10:30 AM','11:00 AM','11:30 AM','12:00 PM','12:30 PM','1:00 PM','1:30 PM','2:00 PM','2:30 PM','3:00 PM'];
function esc(v){return String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}function prettyStatus(v){return String(v||'pending').split('-').map(x=>x[0]?.toUpperCase()+x.slice(1)).join(' ')}function iso(d){return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`}
async function login(){const r=await fetch('/api/admin-login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({password:passwordInput.value})});if(!r.ok){loginError.textContent='Incorrect password.';return}showAdmin();loadAll()}async function logout(){await fetch('/api/admin-logout',{method:'POST'});location.reload()}function showAdmin(){loginScreen.style.display='none';adminDashboard.style.display='block';openTextPanelBtn.classList.remove('hidden')}
async function loadAll(){const r=await fetch('/api/admin-data?action=appointments');if(r.status===401){location.reload();return}const j=await r.json();appointments=j.appointments||[];renderCalendar();renderSide()}
function renderCalendar(){const y=currentMonth.getFullYear(),m=currentMonth.getMonth();monthTitle.textContent=currentMonth.toLocaleDateString('en-US',{month:'long',year:'numeric'});const first=new Date(y,m,1),days=new Date(y,m+1,0).getDate();let html=['Sun','Mon','Tue','Wed','Thu','Fri','Sat'].map(x=>`<div class="day-name">${x}</div>`).join('');for(let i=0;i<first.getDay();i++)html+='<div></div>';for(let d=1;d<=days;d++){const date=new Date(y,m,d),key=iso(date),items=appointments.filter(a=>a.appointment_date===key);html+=`<div class="day ${key===iso(new Date())?'today':''}"><div class="day-number">${d}</div>${items.map(a=>`<div class="appointment-dot status-${esc(a.status)}" onclick="openAppointment('${a.id}')">${esc(a.appointment_time)} ${esc(a.name)}</div>`).join('')}</div>`}calendar.innerHTML=html}
function renderSide(){const today=iso(new Date());const future=appointments.filter(a=>a.appointment_date>=today&&a.status!=='cancelled');const render=(arr,el,limit)=>{const rows=arr.slice(0,limit);el.innerHTML=rows.length?rows.map(a=>`<div class="appointment" onclick="openAppointment('${a.id}')"><strong>${esc(a.appointment_time)} — ${esc(a.name)}</strong><small>${esc(a.year+' '+a.make+' '+a.model)} • ${esc(a.service)}</small><span class="status-pill status-${esc(a.status)}">${esc(prettyStatus(a.status))}</span></div>`).join(''):'<div class="empty">No appointments.</div>'};render(future.filter(a=>a.appointment_date===today),todayList,20);render(future.filter(a=>a.appointment_date>today).sort((a,b)=>(a.appointment_date+a.appointment_time_key).localeCompare(b.appointment_date+b.appointment_time_key)),upcomingList,12)}
function moveMonth(n){currentMonth=new Date(currentMonth.getFullYear(),currentMonth.getMonth()+n,1);renderCalendar()}function goToday(){currentMonth=new Date();renderCalendar()}
function openAppointment(id){const a=appointments.find(x=>x.id===id);if(!a)return;activeAppt=a;const statusOptions=statuses.map(s=>`<option value="${s}" ${a.status===s?'selected':''}>${prettyStatus(s)}</option>`).join('');apptModalBody.innerHTML=`<h2>${esc(a.name)}</h2><div class="meta"><strong>${esc(a.appointment_date)} at ${esc(a.appointment_time)}</strong><br>${esc(a.year+' '+a.make+' '+a.model)}<br>${esc(a.service)}<br>${esc(a.phone)} ${a.email?'• '+esc(a.email):''}</div><div class="form-grid" style="margin-top:12px"><div><label>Status</label><select id="mStatus">${statusOptions}</select></div><div><label>Date</label><input id="mDate" type="date" value="${esc(a.appointment_date)}"></div><div><label>Time</label><select id="mTime">${slots.map(t=>`<option ${a.appointment_time===t?'selected':''}>${t}</option>`).join('')}</select></div><div><label>Service</label><input id="mService" value="${esc(a.service)}"></div><div class="full"><label>Customer Message</label><textarea id="mMessage">${esc(a.message||'')}</textarea></div><div class="full"><label>Internal Notes</label><textarea id="mNotes">${esc(a.internal_notes||'')}</textarea></div></div><div class="modal-actions"><button class="green-btn" onclick="saveAppointment()">Save Changes</button><button class="secondary-btn" onclick="textAppointment()">Text Customer</button><a class="btn light-btn" href="tel:${esc(a.phone)}">Call</a><button class="danger-btn" onclick="deleteAppointment()">Delete</button></div>`;apptModal.classList.add('open');if(!a.seen)patchAppointment({id:a.id,seen:true},false)}
async function patchAppointment(payload,reload=true){const r=await fetch('/api/admin-data?action=appointment',{method:'PATCH',headers:{'Content-Type':'application/json'},body:JSON.stringify(payload)});if(!r.ok){const j=await r.json();alert(j.error||'Could not update appointment');return false}if(reload){closeModal('apptModal');await loadAll()}return true}
async function saveAppointment(){if(!activeAppt)return;await patchAppointment({id:activeAppt.id,status:mStatus.value,appointment_date:mDate.value,preferred_date_label:mDate.value,appointment_time:mTime.value,service:mService.value,message:mMessage.value,internal_notes:mNotes.value})}async function deleteAppointment(){if(!activeAppt||!confirm('Delete this appointment?'))return;const r=await fetch('/api/admin-data?action=appointment&id='+encodeURIComponent(activeAppt.id),{method:'DELETE'});if(r.ok){closeModal('apptModal');loadAll()}}
function openCreateModal(){cTime.innerHTML=slots.map(t=>`<option>${t}</option>`).join('');cStatus.innerHTML=statuses.map(s=>`<option value="${s}" ${s==='confirmed'?'selected':''}>${prettyStatus(s)}</option>`).join('');cDate.value=iso(new Date(Date.now()+86400000));createNotice.textContent='';createModal.classList.add('open')}
async function createAppointment(){const payload={action:'appointment',name:cName.value,phone:cPhone.value,email:cEmail.value,service:cService.value,year:cYear.value,make:cMake.value,model:cModel.value,appointment_date:cDate.value,appointment_time:cTime.value,status:cStatus.value,message:cMessage.value,internal_notes:cNotes.value};const r=await fetch('/api/admin-data?action=appointment',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(payload)});const j=await r.json();if(!r.ok){createNotice.textContent=j.error||'Could not create appointment';return}closeModal('createModal');await loadAll()}
function closeModal(id){document.getElementById(id).classList.remove('open')}function textAppointment(){if(!activeAppt)return;closeModal('apptModal');openTextPanel();selectConversation(activeAppt.phone,activeAppt.name)}
async function loadMessages(){const r=await fetch('/api/admin-data?action=messages');const j=await r.json();messages=j.messages||[];renderConversations();if(activePhone)renderThread()}
function openTextPanel(){textPanel.classList.add('open');loadMessages()}function newText(){activePhone='';smsName.textContent='New Message';smsPhoneLabel.textContent='';manualTextFields.style.display='grid';smsThread.innerHTML='<div class="empty">Enter a customer name and phone number to start a message.</div>'}
function renderConversations(){const by={};messages.forEach(m=>{const p=String(m.phone||'');if(!by[p])by[p]=[];by[p].push(m)});conversationList.innerHTML=Object.entries(by).sort((a,b)=>String(b[1].at(-1)?.created_at).localeCompare(String(a[1].at(-1)?.created_at))).map(([p,arr])=>{const last=arr.at(-1);return `<div class="conv ${p===activePhone?'active':''}" onclick="selectConversation('${esc(p)}','${esc(last.customer_name||'Customer')}')"><strong>${esc(last.customer_name||p)}</strong><small>${esc(p)}<br>${esc(last.message.slice(0,45))}</small></div>`}).join('')||'<div class="empty">No messages yet.</div>'}
function selectConversation(phone,name){activePhone=String(phone||'').replace(/\D/g,'');smsName.textContent=name||'Customer';smsPhoneLabel.textContent=phone;manualTextFields.style.display='none';renderConversations();renderThread()}function renderThread(){const rows=messages.filter(m=>String(m.phone||'').replace(/\D/g,'')===String(activePhone).replace(/\D/g,''));smsThread.innerHTML=rows.length?rows.map(m=>`<div class="bubble ${m.direction==='outgoing'?'out':'in'}">${esc(m.message)}<div style="font-size:10px;opacity:.7;margin-top:4px">${new Date(m.created_at).toLocaleString()}</div></div>`).join(''):'<div class="empty">No messages yet.</div>';smsThread.scrollTop=smsThread.scrollHeight}
async function sendSms(){const phone=activePhone||smsManualPhone.value,name=activePhone?smsName.textContent:smsManualName.value,msg=smsMessage.value.trim();if(!phone||!msg)return alert('Phone and message are required.');const r=await fetch('/api/send-sms',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({to:phone,name,message:msg})});const j=await r.json();if(!r.ok){alert(j.error||'Could not send text');return}smsMessage.value='';activePhone=String(phone).replace(/\D/g,'');smsName.textContent=name||phone;manualTextFields.style.display='none';await loadMessages()}
function urlBase64ToUint8Array(base64String){const padding='='.repeat((4-base64String.length%4)%4),base64=(base64String+padding).replace(/-/g,'+').replace(/_/g,'/'),raw=atob(base64);return Uint8Array.from([...raw].map(c=>c.charCodeAt(0)))}async function enableNotifications(){try{if(!('serviceWorker'in navigator)||!('PushManager'in window))throw new Error('Push notifications are not supported here');const keyRes=await fetch('/api/push-subscribe'),keyData=await keyRes.json();if(!keyData.publicKey)throw new Error('Push notifications are not configured yet');const reg=await navigator.serviceWorker.register('/sw.js');const perm=await Notification.requestPermission();if(perm!=='granted')throw new Error('Notifications were not allowed');let sub=await reg.pushManager.getSubscription();if(!sub)sub=await reg.pushManager.subscribe({userVisibleOnly:true,applicationServerKey:urlBase64ToUint8Array(keyData.publicKey)});await fetch('/api/push-subscribe',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({subscription:sub})});notifyBtn.textContent='Notifications On';notifyBtn.classList.add('notifications-on')}catch(e){alert(e.message)}}
(async()=>{const r=await fetch('/api/admin-data?action=appointments');if(r.status===401)return;if(r.ok){showAdmin();const j=await r.json();appointments=j.appointments||[];renderCalendar();renderSide()}})();
</script></body></html>
