<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<title>Inspections</title>
<style>
:root{--navy:#172033;--blue:#2563eb;--green:#168052;--amber:#c46f09;--red:#bc2f37;--muted:#68768a;--line:#e1e7ef;--bg:#f5f7fb}*{box-sizing:border-box}html,body{margin:0;min-height:100%;font-family:Inter,Arial,sans-serif;background:var(--bg);color:var(--navy)}button,select{font:inherit}.page{max-width:1380px;margin:0 auto;padding:28px 28px 60px}.page-head{display:flex;align-items:flex-end;justify-content:space-between;gap:18px;margin-bottom:18px}.page-head h1{font-size:30px;letter-spacing:-.035em;margin:0}.page-head p{font-size:14px;color:var(--muted);margin:7px 0 0}.scope-toggle{display:flex;gap:4px;padding:4px;background:#e9eef6;border-radius:12px}.scope-toggle button{border:0;border-radius:9px;background:transparent;color:#55657a;padding:8px 13px;font-size:12px;font-weight:850;cursor:pointer}.scope-toggle button.active{background:#fff;color:var(--navy);box-shadow:0 2px 8px rgba(15,23,42,.09)}.request-list{display:flex;flex-direction:column;gap:10px}.request{display:grid;grid-template-columns:minmax(220px,1.1fr) minmax(190px,.9fr) minmax(230px,1fr) minmax(130px,.55fr) auto;align-items:center;gap:18px;background:#fff;border:1px solid var(--line);border-radius:15px;padding:16px 17px;box-shadow:0 5px 18px rgba(15,23,42,.045)}.request.focus{border-color:#8bb2f6;box-shadow:0 0 0 3px rgba(37,99,235,.09),0 8px 24px rgba(15,23,42,.06)}.customer strong,.vehicle strong{display:block;font-size:14px}.customer span,.vehicle span,.meta{display:block;color:var(--muted);font-size:12px;margin-top:4px}.assignment label{display:block;color:#6c7a8e;font-size:10px;font-weight:900;text-transform:uppercase;letter-spacing:.06em;margin-bottom:5px}.assignment select{width:100%;min-height:40px;border:1px solid #d6deea;border-radius:10px;background:#fff;color:var(--navy);padding:8px 10px;font-size:13px;font-weight:750}.assignment select:disabled{background:#f4f6f9;color:#657286}.status{display:inline-flex;align-items:center;gap:7px;border-radius:999px;padding:7px 10px;font-size:11px;font-weight:900;width:max-content}.status:before{content:'';width:8px;height:8px;border-radius:50%;background:currentColor}.status.incomplete{background:#fff5df;color:#a56408}.status.complete{background:#e7f7ef;color:#137347}.btn{border:0;border-radius:10px;padding:10px 13px;background:var(--blue);color:#fff;text-decoration:none;font-size:12px;font-weight:850;display:inline-flex;align-items:center;justify-content:center;white-space:nowrap}.btn:hover{filter:brightness(.96)}.waiting{color:var(--muted);font-size:12px;font-weight:750}.empty{background:#fff;border:1px dashed #cfd8e5;border-radius:16px;padding:42px 20px;text-align:center;color:var(--muted)}.empty strong{display:block;color:var(--navy);font-size:17px;margin-bottom:6px}.loading{padding:60px;text-align:center;color:var(--muted)}
.request-action{display:flex;align-items:center;justify-content:flex-end}.cancel-btn{border:1px solid #efc5c8;border-radius:10px;background:#fff4f4;color:#b72d34;padding:10px 12px;font-size:12px;font-weight:850;cursor:pointer;white-space:nowrap}.cancel-btn:hover{background:#ffe9ea}.history-section{margin-top:42px;padding-top:30px;border-top:1px solid #dbe3ee}.history-head{margin-bottom:15px}.history-head h2{font-size:25px;letter-spacing:-.03em;margin:0}.history-head p{font-size:14px;color:var(--muted);margin:6px 0 0}.history-filters{display:grid;grid-template-columns:minmax(240px,1.5fr) repeat(3,minmax(145px,.65fr));gap:9px;background:#fff;border:1px solid var(--line);border-radius:15px;padding:12px;margin-bottom:11px}.history-filters input,.history-filters select{width:100%;min-height:42px;border:1px solid #d6deea;border-radius:10px;background:#fff;color:var(--navy);padding:9px 11px;font:13px Inter,Arial,sans-serif}.history-list{display:flex;flex-direction:column;gap:9px}.history-row{display:grid;grid-template-columns:minmax(130px,.55fr) minmax(190px,.9fr) minmax(200px,.9fr) minmax(230px,1fr) auto;align-items:center;gap:16px;background:#fff;border:1px solid var(--line);border-radius:15px;padding:15px 17px;box-shadow:0 5px 18px rgba(15,23,42,.04)}.history-row strong{display:block;font-size:14px}.history-row small{display:block;color:var(--muted);font-size:12px;margin-top:4px}.history-flags{display:flex;gap:6px;flex-wrap:wrap}.history-chip{font-size:10px;font-weight:850;border-radius:999px;padding:6px 8px;background:#edf2f8;color:#536176}.history-chip.attention{background:#fff0f1;color:#b72d34}.history-chip.monitor{background:#fff5df;color:#9f6207}.history-actions{display:flex;gap:6px}.history-actions .btn,.history-actions button{min-height:38px}.history-actions .send{background:var(--green)}.history-actions .send:disabled{background:#dce4ea;color:#7b8795;cursor:not-allowed;filter:none}.history-actions .light{background:#edf2f8;color:var(--navy)}.history-actions .delete{border:1px solid #efc5c8;background:#fff4f4;color:#b72d34}.history-empty{background:#fff;border:1px dashed #cfd8e5;border-radius:15px;padding:30px;text-align:center;color:var(--muted)}
@media(max-width:1050px){.request{grid-template-columns:1fr 1fr}.assignment{grid-column:1/-1}.request-action{justify-self:end}.history-row{grid-template-columns:1fr 1fr}.history-actions{grid-column:1/-1}}
@media(max-width:640px){.page{padding:74px 12px 40px}.page-head{align-items:flex-start;flex-direction:column}.scope-toggle{width:100%}.scope-toggle button{flex:1}.request{grid-template-columns:1fr;gap:12px}.assignment{grid-column:auto}.request-action{justify-self:stretch}.request-action .cancel-btn{width:100%}.status{justify-self:start}.history-filters,.history-row{grid-template-columns:1fr}.history-actions{grid-column:auto;display:grid;grid-template-columns:1fr 1fr}.history-actions .send{grid-column:1/-1}.history-actions .delete{grid-column:1/-1}}
</style>
</head>
<body>
<script src="/config.js"></script>
<main class="page">
  <div class="page-head"><div><h1>Inspections</h1><p>Manage active requests and completed inspection reports in one place.</p></div><div class="scope-toggle" aria-label="Inspection date filter"><button id="showAll" class="active" type="button">All</button><button id="showToday" type="button">Today</button></div></div>
  <div id="requestList" class="loading">Loading requested inspections…</div>
  <section class="history-section" id="history">
    <div class="history-head"><h2>Inspection History</h2><p>Completed reports are listed from newest to oldest.</p></div>
    <div class="history-filters"><input id="historySearch" placeholder="Search customer, phone, vehicle, or notes…"><select id="historyTech"><option value="">All Technicians</option></select><select id="historyStatus"><option value="">All Inspections</option><option value="attention">Needs Attention</option><option value="monitor">Has Monitor Items</option></select><input id="historyMonth" type="month" title="Filter by month"></div>
    <div id="historyList" class="history-list"></div>
  </section>
</main>
<script>
let requests=[],technicians=[],appointments=[],inspections=[],scope='all';
const list=document.getElementById('requestList'),focusAppointment=new URLSearchParams(location.search).get('appointment')||'';
function todayKey(){const now=new Date();return`${now.getFullYear()}-${String(now.getMonth()+1).padStart(2,'0')}-${String(now.getDate()).padStart(2,'0')}`}
function esc(value){return String(value??'').replace(/[&<>"']/g,char=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[char]))}
function formatDate(value){if(!value)return'Not set';const date=new Date(value);if(Number.isNaN(date.getTime()))return value;return date.toLocaleDateString(undefined,{month:'short',day:'numeric',year:'numeric',hour:'numeric',minute:'2-digit'})}
function technicianOptions(item){const active=technicians.filter(tech=>tech.active),hasCurrent=item.technician_id&&active.some(tech=>tech.id===item.technician_id),unassigned=item.status==='completed'?'':'<option value="">Unassigned — available to claim</option>';return unassigned+active.map(tech=>`<option value="${esc(tech.id)}" ${tech.id===item.technician_id?'selected':''}>${esc(tech.name)}</option>`).join('')+(!hasCurrent&&item.technician_id?`<option value="${esc(item.technician_id)}" selected>${esc(item.technician_name||'Inactive technician')}</option>`:'')}
function render(){const todayIds=new Set(appointments.filter(item=>item.appointment_date===todayKey()&&item.status!=='cancelled').map(item=>item.id)),allRows=requests.filter(item=>item.status==='requested'||item.status==='in_progress'),rows=(scope==='today'?allRows.filter(item=>todayIds.has(item.appointment_id)):allRows).sort((a,b)=>{if(a.appointment_id===focusAppointment)return-1;if(b.appointment_id===focusAppointment)return 1;return String(b.created_at).localeCompare(String(a.created_at))});showAll.classList.toggle('active',scope==='all');showToday.classList.toggle('active',scope==='today');showAll.textContent=`All (${allRows.length})`;showToday.textContent=`Today (${allRows.filter(item=>todayIds.has(item.appointment_id)).length})`;list.className='request-list';if(!rows.length){list.innerHTML=`<div class="empty"><strong>${scope==='today'?'No inspections scheduled for today':'No active inspection requests'}</strong>${scope==='today'?'Switch to All to see other active requests.':'New online appointments will appear here automatically.'}</div>`;return}list.innerHTML=rows.map(item=>`<article class="request ${item.appointment_id===focusAppointment?'focus':''}"><div class="customer"><strong>${esc(item.customer_name)}</strong><span>${esc(item.phone||item.email||'No contact information')}</span></div><div class="vehicle"><strong>${esc(item.vehicle)}</strong><span>${item.mileage?esc(item.mileage)+' miles':'Mileage not entered'}</span></div><div class="assignment"><label>Assigned technician</label><select data-assign="${esc(item.id)}">${technicianOptions(item)}</select></div><div><span class="status incomplete">${item.status==='in_progress'?'In Progress':'Requested'}</span><span class="meta">Requested ${esc(formatDate(item.created_at))}</span></div><div class="request-action"><button class="cancel-btn" data-cancel="${esc(item.id)}">Cancel Request</button></div></article>`).join('');list.querySelectorAll('[data-assign]').forEach(select=>select.onchange=()=>assignTechnician(select.dataset.assign,select.value,select));list.querySelectorAll('[data-cancel]').forEach(button=>button.onclick=()=>cancelRequest(button.dataset.cancel))}
showAll.onclick=()=>{scope='all';render()};showToday.onclick=()=>{scope='today';render()};
async function assignTechnician(id,technicianId,select){const original=requests.find(item=>item.id===id)?.technician_id||'';select.disabled=true;try{const response=await fetch('/api/admin-data?action=inspection-request',{method:'PATCH',headers:{'Content-Type':'application/json'},body:JSON.stringify({id,technician_id:technicianId})}),json=await response.json();if(response.status===401){location.href='/admin';return}if(!response.ok)throw new Error(json.error||'Could not update technician');const index=requests.findIndex(item=>item.id===id),tech=technicians.find(item=>item.id===technicianId);if(index>=0)requests[index]={...requests[index],...json.request,technician_name:tech?.name||'Unassigned'};render()}catch(error){select.value=original;select.disabled=false;alert(error.message)}}
async function cancelRequest(id){const request=requests.find(item=>item.id===id);if(!request||!confirm(`Cancel the inspection request for ${request.customer_name||'this customer'}?`))return;try{const response=await fetch('/api/admin-data?action=inspection-request',{method:'PATCH',headers:{'Content-Type':'application/json'},body:JSON.stringify({id,status:'cancelled'})}),json=await response.json();if(response.status===401){location.href='/admin';return}if(!response.ok)throw new Error(json.error||'Could not cancel request');requests=requests.map(item=>item.id===id?{...item,...json.request}:item);render()}catch(error){alert(error.message)}}
function lower(value){return String(value||'').toLowerCase()}
function reportItems(item){let value=item?.inspection_items;if(typeof value==='string'){try{value=JSON.parse(value)}catch{value=[]}}if(Array.isArray(value)&&value.length)return value;const labels={brakes:'Brakes',tires:'Tires',suspension:'Suspension',fluids:'Fluids',battery:'Battery',lights:'Lights',wipers:'Wipers',filters:'Filters',leaks:'Leaks'};return Object.entries(labels).map(([key,title])=>({title,status:item?.[key+'_status']||'',notes:item?.[key+'_notes']||''})).filter(entry=>entry.status||entry.notes)}
function reportStatus(value){const status=lower(value);if(status.includes('attention')||status.includes('fail')||status.includes('bad'))return'attention';if(status.includes('monitor')||status.includes('watch'))return'monitor';return'good'}
function reportCounts(item){const entries=reportItems(item);return{total:entries.length,attention:entries.filter(entry=>reportStatus(entry.status)==='attention').length,monitor:entries.filter(entry=>reportStatus(entry.status)==='monitor').length}}
function fillHistoryTechnicians(){const current=historyTech.value,names=[...new Set(inspections.map(item=>String(item.technician||'').trim()).filter(Boolean))].sort((a,b)=>a.localeCompare(b));historyTech.innerHTML='<option value="">All Technicians</option>'+names.map(name=>`<option>${esc(name)}</option>`).join('');historyTech.value=current}
function renderHistory(){const query=lower(historySearch.value.trim()),technician=historyTech.value,status=historyStatus.value,month=historyMonth.value,rows=[...inspections].filter(item=>{const counts=reportCounts(item),searchText=[item.customer_name,item.phone,item.email,item.vehicle,item.mileage,item.technician,item.recommendations,...reportItems(item).flatMap(entry=>[entry.title,entry.status,entry.notes])].join(' ').toLowerCase();if(query&&!searchText.includes(query))return false;if(technician&&item.technician!==technician)return false;if(status==='attention'&&!counts.attention)return false;if(status==='monitor'&&!counts.monitor)return false;if(month&&!String(item.created_at||'').startsWith(month))return false;return true}).sort((a,b)=>String(b.created_at).localeCompare(String(a.created_at)));if(!rows.length){historyList.innerHTML='<div class="history-empty">No completed inspections match these filters.</div>';return}historyList.innerHTML=rows.map(item=>{const counts=reportCounts(item),date=new Date(item.created_at),dateText=Number.isNaN(date.getTime())?item.created_at:date.toLocaleDateString(undefined,{month:'short',day:'numeric',year:'numeric'}),timeText=Number.isNaN(date.getTime())?'':date.toLocaleTimeString(undefined,{hour:'numeric',minute:'2-digit'}),canSend=String(item.phone||'').replace(/\D/g,'').length>=7;return`<article class="history-row"><div><strong>${esc(dateText)}</strong><small>${esc(timeText)}</small></div><div><strong>${esc(item.customer_name||'Customer')}</strong><small>${esc(item.phone||'No phone')}</small></div><div><strong>${esc(item.vehicle||'Vehicle not provided')}</strong><small>${esc(item.technician||'Technician not entered')}</small></div><div class="history-flags"><span class="history-chip">${counts.total} item${counts.total===1?'':'s'}</span>${counts.attention?`<span class="history-chip attention">${counts.attention} needs attention</span>`:''}${counts.monitor?`<span class="history-chip monitor">${counts.monitor} monitor</span>`:''}</div><div class="history-actions"><button class="btn send" data-send="${esc(item.id)}" ${canSend?'':'disabled title="Add a customer phone number before sending"'}>Send to Customer</button><a class="btn light" target="_blank" href="/inspection?id=${encodeURIComponent(item.id)}">View</a><a class="btn" href="/admin/inspection?edit=${encodeURIComponent(item.id)}">Edit</a><button class="btn delete" data-delete="${esc(item.id)}">Delete</button></div></article>`}).join('');historyList.querySelectorAll('[data-send]').forEach(button=>button.onclick=()=>sendToCustomer(button.dataset.send));historyList.querySelectorAll('[data-delete]').forEach(button=>button.onclick=()=>deleteInspection(button.dataset.delete))}
[historySearch,historyTech,historyStatus,historyMonth].forEach(control=>control.addEventListener(control.tagName==='INPUT'?'input':'change',renderHistory));
function sendToCustomer(id){const inspection=inspections.find(item=>item.id===id);if(!inspection?.phone)return;const reportUrl=`${location.origin}/inspection?id=${encodeURIComponent(inspection.id)}`,message=`Hi ${inspection.customer_name||'there'}, your inspection report for ${inspection.vehicle||'your vehicle'} is ready: ${reportUrl}`,params=new URLSearchParams({messages:'1',customerName:inspection.customer_name||'',customerPhone:inspection.phone,message});location.href='/admin?'+params.toString()}
async function deleteInspection(id){const inspection=inspections.find(item=>item.id===id);if(!inspection||!confirm(`Delete the inspection for ${inspection.customer_name||'this customer'}? This cannot be undone.`))return;try{const response=await fetch('/api/admin-data?action=inspection&id='+encodeURIComponent(id),{method:'DELETE'}),json=await response.json();if(response.status===401){location.href='/admin';return}if(!response.ok)throw new Error(json.error||'Could not delete inspection');await load()}catch(error){alert(error.message)}}
async function load(){try{const [requestResponse,settingsResponse,appointmentResponse,inspectionResponse]=await Promise.all([fetch('/api/admin-data?action=inspection-requests',{cache:'no-store'}),fetch('/api/admin-data?action=shop-settings',{cache:'no-store'}),fetch('/api/admin-data?action=appointments',{cache:'no-store'}),fetch('/api/admin-data?action=inspections',{cache:'no-store'})]);if([requestResponse,settingsResponse,appointmentResponse,inspectionResponse].some(response=>response.status===401)){location.href='/admin';return}const [requestJson,settingsJson,appointmentJson,inspectionJson]=await Promise.all([requestResponse.json(),settingsResponse.json(),appointmentResponse.json(),inspectionResponse.json()]);if(!requestResponse.ok)throw new Error(requestJson.error||'Could not load requested inspections');if(!settingsResponse.ok)throw new Error(settingsJson.error||'Could not load technicians');if(!appointmentResponse.ok)throw new Error(appointmentJson.error||'Could not load appointments');if(!inspectionResponse.ok)throw new Error(inspectionJson.error||'Could not load inspection history');requests=requestJson.requests||[];technicians=(settingsJson.shop?.technicians||[]).filter(item=>item.id);appointments=appointmentJson.appointments||[];inspections=inspectionJson.inspections||[];fillHistoryTechnicians();render();renderHistory()}catch(error){list.className='empty';list.innerHTML=`<strong>Could not load inspections</strong>${esc(error.message)}`;historyList.innerHTML='<div class="history-empty">Could not load inspection history.</div>'}}
load();
</script>
</body>
</html>
