<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<title>Inspection History</title>
<style>
:root{--navy:#163051;--red:#af2727;--green:#1d7f4f;--bg:#f4f7fb;--line:#dfe6ef;--muted:#60708a;--amber:#b96d09}
*{box-sizing:border-box}
body{margin:0;font-family:Arial,sans-serif;background:var(--bg);color:var(--navy)}
button,.btn{border:0;border-radius:11px;padding:11px 15px;background:var(--navy);color:#fff;font:700 14px Arial,sans-serif;cursor:pointer;text-decoration:none;display:inline-flex;align-items:center;justify-content:center;gap:7px}
button:hover,.btn:hover{filter:brightness(.95)}
.green{background:var(--green)}.red{background:var(--red)}.light{background:#eef3fa;color:var(--navy)}
.page{max-width:1500px;margin:0 auto;padding:18px 24px 50px}
.page-head{display:flex;justify-content:space-between;align-items:flex-end;gap:16px;margin-bottom:16px}
.page-head h1{font-size:30px;margin:0 0 4px;letter-spacing:-.025em}.page-head p{margin:0;color:var(--muted);font-size:14px}
.filters{background:#fff;border:1px solid #e3e9f1;border-radius:16px;padding:14px;box-shadow:0 5px 18px rgba(22,48,81,.06);display:grid;grid-template-columns:minmax(240px,1.6fr) repeat(4,minmax(140px,.7fr));gap:10px;margin-bottom:14px}
.filters input,.filters select{width:100%;height:43px;border:1px solid #dce4ee;border-radius:10px;padding:9px 11px;font:14px Arial,sans-serif;color:var(--navy);background:#fff}
.groups{display:flex;flex-direction:column;gap:14px}.group{background:#fff;border:1px solid #e3e9f1;border-radius:17px;box-shadow:0 6px 20px rgba(22,48,81,.06);overflow:hidden}.group-head{padding:15px 17px;border-bottom:1px solid #edf1f6;background:#fbfcfe;display:flex;justify-content:space-between;align-items:center;gap:14px}.group-title{min-width:0}.group-title h2{font-size:18px;margin:0 0 3px}.group-title div{font-size:13px;color:var(--muted)}.count{font-size:12px;font-weight:800;background:#edf3fa;padding:6px 9px;border-radius:999px;white-space:nowrap}
.rows{display:flex;flex-direction:column}.inspection-row{display:grid;grid-template-columns:minmax(170px,.8fr) minmax(170px,.75fr) 1fr auto;gap:15px;align-items:center;padding:15px 17px;border-top:1px solid #eef2f7}.inspection-row:first-child{border-top:0}.inspection-row:hover{background:#fbfdff}.date strong{display:block;font-size:14px}.date span,.vehicle-meta{display:block;font-size:12px;color:var(--muted);margin-top:3px}.vehicle-name{font-size:14px;font-weight:800}.block-summary{min-width:0}.mini-stats{display:flex;gap:7px;flex-wrap:wrap;margin-bottom:6px}.chip{font-size:11px;font-weight:800;border-radius:999px;padding:4px 7px;background:#eef3fa;color:#4f6078}.chip.attention{background:#fff0f0;color:#b72828}.chip.monitor{background:#fff7e9;color:#9b650f}.attention-preview{font-size:12px;color:#45566e;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.attention-preview strong{color:#b72828}.row-actions{display:flex;gap:7px}.empty{background:#fff;border:1px solid #e3e9f1;border-radius:16px;padding:30px;text-align:center;color:var(--muted)}
.modal-overlay{display:none;position:fixed;inset:0;background:rgba(5,15,30,.58);z-index:9999;align-items:center;justify-content:center;padding:16px}.modal-overlay.open{display:flex}.modal{width:min(760px,100%);max-height:92vh;overflow:auto;background:#fff;border-radius:20px;padding:22px;position:relative}.close{position:absolute;right:15px;top:15px;width:38px;height:38px;padding:0;border:1px solid #d8e0eb;background:#fff;color:var(--navy);font-size:22px}.modal h2{margin:0 50px 4px 0;font-size:25px}.modal-sub{color:var(--muted);font-size:13px;margin-bottom:16px}.info-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:9px;margin-bottom:16px}.info{border:1px solid #e4eaf2;border-radius:11px;background:#f9fbfd;padding:11px}.info label{display:block;font-size:10px;text-transform:uppercase;font-weight:900;color:#7a899e;margin-bottom:4px}.info div{font-size:13px;font-weight:700;color:#34465e}.detail-section{margin-top:17px}.detail-section h3{font-size:14px;margin:0 0 9px}.detail-block{border:1px solid #e3e9f1;border-left:4px solid var(--green);border-radius:11px;padding:11px 12px;margin-bottom:8px}.detail-block.monitor{border-left-color:#d58a1b}.detail-block.attention{border-left-color:var(--red)}.detail-block-head{display:flex;justify-content:space-between;gap:10px;align-items:center}.detail-block-title{font-size:14px;font-weight:900}.detail-status{font-size:11px;font-weight:900;color:#60708a}.detail-notes{font-size:13px;color:#4d5e74;line-height:1.45;margin-top:6px;white-space:pre-wrap}.recommendations{background:#f8fafc;border:1px solid #e3e9f1;border-radius:11px;padding:12px;font-size:13px;line-height:1.5;white-space:pre-wrap}.modal-actions{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;margin-top:18px;padding-top:15px;border-top:1px solid #e7ecf3}
@media(max-width:950px){.filters{grid-template-columns:1fr 1fr}.filters .search{grid-column:1/-1}.inspection-row{grid-template-columns:1fr 1fr}.block-summary{grid-column:1/-1}.row-actions{justify-content:flex-start}}
@media(max-width:600px){.page{padding:14px 10px 40px}.page-head{align-items:flex-start;flex-direction:column}.page-head .btn{width:100%}.filters{grid-template-columns:1fr}.filters .search{grid-column:auto}.inspection-row{grid-template-columns:1fr;padding:14px}.block-summary{grid-column:auto}.row-actions>*{flex:1}.group-head{align-items:flex-start}.info-grid{grid-template-columns:1fr}.modal-overlay{padding:8px;align-items:flex-end}.modal{border-radius:20px 20px 0 0;max-height:94vh}.modal-actions{grid-template-columns:1fr}}
</style>
</head>
<body>
<script src="/config.js"></script>
<main class="page">
  <div class="page-head">
    <div><h1>Inspection History</h1><p>Find inspections by customer, vehicle, technician, date, or items needing attention.</p></div>
    <a class="btn green" href="/admin/inspection">+ Create Inspection</a>
  </div>

  <section class="filters">
    <input class="search" id="search" placeholder="Search customer, phone, vehicle, notes..." oninput="render()">
    <select id="vehicleFilter" onchange="render()"><option value="">All Vehicles</option></select>
    <select id="techFilter" onchange="render()"><option value="">All Technicians</option></select>
    <select id="attentionFilter" onchange="render()"><option value="">All Inspections</option><option value="attention">Needs Attention</option><option value="monitor">Has Monitor Items</option></select>
    <input id="dateFilter" type="month" onchange="render()" title="Filter by month">
  </section>

  <div id="groups" class="groups"></div>
</main>

<div id="detailModal" class="modal-overlay" onclick="if(event.target===this)closeDetail()">
  <div class="modal">
    <button class="close" onclick="closeDetail()">×</button>
    <div id="detailContent"></div>
  </div>
</div>

<script>
let inspections=[];
function esc(v){return String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot',"'":'&#39;'}[c]))}
function lower(v){return String(v||'').toLowerCase()}
function formatDate(v){if(!v)return'Unknown date';const d=new Date(v);return Number.isNaN(d.getTime())?v:d.toLocaleDateString(undefined,{month:'short',day:'numeric',year:'numeric'})}
function formatTime(v){if(!v)return'';const d=new Date(v);return Number.isNaN(d.getTime())?'':d.toLocaleTimeString(undefined,{hour:'numeric',minute:'2-digit'})}
function normalizeStatus(v){const s=lower(v);if(s.includes('attention')||s.includes('fail')||s.includes('bad'))return'attention';if(s.includes('monitor')||s.includes('watch'))return'monitor';return'good'}
function legacyItems(i){const labels={brakes:'Brakes',tires:'Tires',suspension:'Suspension',fluids:'Fluids',battery:'Battery',lights:'Lights',wipers:'Wipers',filters:'Filters',leaks:'Leaks'};return Object.entries(labels).map(([k,title])=>({title,status:i[k+'_status']||'',notes:i[k+'_notes']||''})).filter(x=>x.status||x.notes)}
function items(i){let arr=i.inspection_items;if(typeof arr==='string'){try{arr=JSON.parse(arr)}catch{arr=[]}}return Array.isArray(arr)&&arr.length?arr:legacyItems(i)}
function counts(i){const list=items(i);return{total:list.length,attention:list.filter(x=>normalizeStatus(x.status)==='attention').length,monitor:list.filter(x=>normalizeStatus(x.status)==='monitor').length}}
function uniqueValues(key){return[...new Set(inspections.map(i=>String(i[key]||'').trim()).filter(Boolean))].sort((a,b)=>a.localeCompare(b))}
function fillFilters(){
  const vehicleCurrent=vehicleFilter.value,techCurrent=techFilter.value;
  vehicleFilter.innerHTML='<option value="">All Vehicles</option>'+uniqueValues('vehicle').map(v=>`<option>${esc(v)}</option>`).join('');
  techFilter.innerHTML='<option value="">All Technicians</option>'+uniqueValues('technician').map(v=>`<option>${esc(v)}</option>`).join('');
  vehicleFilter.value=vehicleCurrent;techFilter.value=techCurrent;
}
function filtered(){
  const q=lower(search.value.trim()),vf=vehicleFilter.value,tf=techFilter.value,af=attentionFilter.value,mf=dateFilter.value;
  return inspections.filter(i=>{
    const ci=counts(i),allText=[i.customer_name,i.phone,i.email,i.vehicle,i.mileage,i.technician,i.recommendations,...items(i).flatMap(x=>[x.title,x.status,x.notes])].join(' ').toLowerCase();
    if(q&&!allText.includes(q))return false;
    if(vf&&i.vehicle!==vf)return false;
    if(tf&&i.technician!==tf)return false;
    if(af==='attention'&&!ci.attention)return false;
    if(af==='monitor'&&!ci.monitor)return false;
    if(mf&&!String(i.created_at||'').startsWith(mf))return false;
    return true;
  });
}
function groupKey(i){return `${i.customer_id||lower(i.customer_name)}|${i.vehicle_id||lower(i.vehicle)}`}
function render(){
  const rows=filtered();
  const grouped=new Map();
  rows.forEach(i=>{const key=groupKey(i);if(!grouped.has(key))grouped.set(key,[]);grouped.get(key).push(i)});
  groups.innerHTML=grouped.size?[...grouped.values()].map(renderGroup).join(''):'<div class="empty">No inspections match these filters.</div>';
}
function renderGroup(rows){
  rows.sort((a,b)=>String(b.created_at).localeCompare(String(a.created_at)));
  const first=rows[0];
  return `<section class="group"><div class="group-head"><div class="group-title"><h2>${esc(first.customer_name||'Customer')}</h2><div>${esc(first.vehicle||'Vehicle not provided')}</div></div><span class="count">${rows.length} inspection${rows.length===1?'':'s'}</span></div><div class="rows">${rows.map(renderRow).join('')}</div></section>`;
}
function renderRow(i){
  const c=counts(i),attention=items(i).filter(x=>normalizeStatus(x.status)==='attention').map(x=>x.title).filter(Boolean);
  const monitor=items(i).filter(x=>normalizeStatus(x.status)==='monitor').map(x=>x.title).filter(Boolean);
  const preview=attention.length?`<strong>Needs attention:</strong> ${esc(attention.slice(0,3).join(', '))}${attention.length>3?' +'+(attention.length-3)+' more':''}`:monitor.length?`Monitor: ${esc(monitor.slice(0,3).join(', '))}`:'No flagged items';
  return `<div class="inspection-row"><div class="date"><strong>${esc(formatDate(i.created_at))}</strong><span>${esc(formatTime(i.created_at))}</span></div><div><div class="vehicle-name">${esc(i.mileage?i.mileage+' mi':'Mileage not entered')}</div><span class="vehicle-meta">${esc(i.technician||'Technician not entered')}</span></div><div class="block-summary"><div class="mini-stats"><span class="chip">${c.total} item${c.total===1?'':'s'}</span>${c.attention?`<span class="chip attention">${c.attention} needs attention</span>`:''}${c.monitor?`<span class="chip monitor">${c.monitor} monitor</span>`:''}</div><div class="attention-preview">${preview}</div></div><div class="row-actions"><button onclick="openDetail('${i.id}')">View Inspection</button></div></div>`;
}
function openDetail(id){
  const i=inspections.find(x=>x.id===id);if(!i)return;const list=items(i);
  detailContent.innerHTML=`<h2>${esc(i.customer_name||'Customer')}</h2><div class="modal-sub">${esc(i.vehicle||'Vehicle not provided')} • ${esc(formatDate(i.created_at))}</div><div class="info-grid"><div class="info"><label>Phone</label><div>${esc(i.phone||'Not provided')}</div></div><div class="info"><label>Email</label><div>${esc(i.email||'Not provided')}</div></div><div class="info"><label>Mileage</label><div>${esc(i.mileage?i.mileage+' mi':'Not provided')}</div></div><div class="info"><label>Technician</label><div>${esc(i.technician||'Not provided')}</div></div></div><div class="detail-section"><h3>Inspection Items</h3>${list.length?list.map(x=>{const cls=normalizeStatus(x.status);return`<div class="detail-block ${cls}"><div class="detail-block-head"><div class="detail-block-title">${esc(x.title||'Inspection Item')}</div><div class="detail-status">${esc(x.status||'')}</div></div><div class="detail-notes">${esc(x.notes||'No notes added.')}</div></div>`}).join(''):'<div class="recommendations">No inspection items saved.</div>'}</div><div class="detail-section"><h3>Recommendations</h3><div class="recommendations">${esc(i.recommendations||'No recommendations added.')}</div></div><div class="modal-actions"><a class="btn" target="_blank" href="/inspection?id=${esc(i.id)}">Open Customer Report</a>${i.phone?`<a class="btn green" href="sms:${esc(i.phone)}">Text Customer</a>`:'<span></span>'}<button class="light" onclick="copyLink('${esc(i.id)}')">Copy Report Link</button></div>`;
  detailModal.classList.add('open');
}
function closeDetail(){detailModal.classList.remove('open')}
async function copyLink(id){const u=location.origin+'/inspection?id='+id;try{await navigator.clipboard.writeText(u)}catch{prompt('Copy this link:',u)}}
async function load(){
  try{
    const r=await fetch('/api/admin-data?action=inspections',{cache:'no-store'});if(r.status===401){location.href='/admin';return}const j=await r.json();if(!r.ok)throw new Error(j.error||'Unable to load inspections');inspections=j.inspections||[];fillFilters();render();
  }catch(e){groups.innerHTML='<div class="empty">Could not load inspection history.</div>'}
}
load();
</script>
</body>
</html>
