<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="robots" content="noindex,nofollow"><title>Customer Profiles</title><style>
:root{--navy:#163051;--red:#af2727;--green:#1d7f4f;--bg:#f3f6fb;--line:#dfe7f2;--muted:#637189}*{box-sizing:border-box}body{margin:0;font-family:Arial,sans-serif;background:radial-gradient(circle at top left,rgba(175,39,39,.1),transparent 34rem),linear-gradient(180deg,#f7f9fd,var(--bg));color:var(--navy)}button,.btn{border:0;border-radius:14px;padding:12px 18px;background:var(--red);color:#fff;font-weight:800;cursor:pointer;font-size:15px;text-decoration:none;display:inline-flex;align-items:center;justify-content:center}.green{background:var(--green)}.blue{background:var(--navy)}.light{background:#edf3fb;color:var(--navy)}.danger{background:#dc2626}.page{width:min(1380px,calc(100% - 32px));margin:auto;padding:22px 0 34px}.hero{border-radius:26px;background:linear-gradient(135deg,var(--navy),#102640 58%,#7f1e24);color:#fff;padding:22px;margin-bottom:18px;box-shadow:0 18px 55px rgba(22,48,81,.12)}.hero-top{display:flex;justify-content:space-between;align-items:center;gap:16px;flex-wrap:wrap}.brand{display:flex;align-items:center;gap:14px}.brand-box{background:#fff;color:var(--navy);padding:14px 18px;border-radius:16px;font-size:20px;font-weight:900}.eyebrow{text-transform:uppercase;font-size:13px;font-weight:800;color:rgba(255,255,255,.76)}h1{margin:4px 0 0;font-size:clamp(30px,4vw,48px)}.hero-actions{display:flex;gap:10px;flex-wrap:wrap}.toolbar{background:#fff;border:1px solid var(--line);border-radius:24px;padding:18px;margin-bottom:16px;box-shadow:0 8px 24px rgba(22,48,81,.08)}.toolbar-top{display:grid;grid-template-columns:1fr auto;gap:14px}.toolbar input,input,textarea{width:100%;padding:14px;border:1px solid var(--line);border-radius:16px;font:16px Arial,sans-serif}textarea{min-height:96px}.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-top:14px}.stat{border:1px solid var(--line);border-radius:18px;padding:14px}.stat strong{display:block;font-size:24px}.stat span{color:var(--muted);font-size:13px}.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(330px,1fr));gap:16px}.customer{background:#fff;border-radius:22px;padding:18px;border:1px solid var(--line);box-shadow:0 8px 24px rgba(22,48,81,.08);position:relative;overflow:hidden}.customer:before{content:"";position:absolute;left:0;right:0;top:0;height:5px;background:linear-gradient(90deg,var(--red),var(--navy))}.head{display:flex;justify-content:space-between;gap:12px}.avatar{width:42px;height:42px;border-radius:15px;background:#eef4fb;display:flex;align-items:center;justify-content:center;font-weight:900}.title{display:flex;gap:11px}.title h3{margin:0 0 4px}.pill{padding:6px 9px;border-radius:999px;background:#eaf0f7;font-size:12px;font-weight:800;height:max-content}.details{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:14px}.detail{background:#f8fbff;border:1px solid #e7eef8;border-radius:16px;padding:11px}.detail.full{grid-column:1/-1}.detail label{display:block;color:var(--muted);font-size:11px;text-transform:uppercase;font-weight:900;margin-bottom:4px}.actions{display:flex;flex-wrap:wrap;gap:8px;margin-top:14px}.actions>*{flex:1 1 auto}.empty{background:#fff;border:1px solid var(--line);border-radius:22px;padding:28px;text-align:center;color:var(--muted);grid-column:1/-1}.modal-overlay{display:none;position:fixed;inset:0;background:rgba(5,15,30,.58);z-index:9999;align-items:center;justify-content:center;padding:18px}.modal-overlay.open{display:flex}.modal{width:min(720px,100%);max-height:92vh;overflow:auto;background:#fff;border-radius:24px;padding:22px}.form{display:grid;grid-template-columns:1fr 1fr;gap:10px 12px}.full{grid-column:1/-1}.modal-actions{display:flex;gap:10px;margin-top:18px}.modal-actions>*{flex:1}@media(max-width:700px){.page{width:calc(100% - 20px);padding-top:10px}.hero{border-radius:22px}.brand,.hero-actions{width:100%;justify-content:center;text-align:center}.brand{flex-direction:column}.hero-actions{flex-direction:column}.hero-actions>*{width:100%}.toolbar-top,.form{grid-template-columns:1fr}.stats{grid-template-columns:1fr 1fr}.grid{grid-template-columns:1fr}.details{grid-template-columns:1fr}.detail.full,.full{grid-column:auto}}
</style></head><body><script src="/config.js"></script><main class="page"><section class="hero"><div class="hero-top"><div class="brand"><div class="brand-box" id="brandName">AUTO SHOP</div><div><div class="eyebrow">Customer Center</div><h1>Customer Profiles</h1></div></div><div class="hero-actions"><button class="green" onclick="openAdd()">+ Add Customer</button><a href="/admin" class="btn light">Back to Admin</a><button onclick="load()">Refresh</button></div></div><p>Search customer history, vehicles, appointments, notes, and inspection links in one place.</p></section><section class="toolbar"><div class="toolbar-top"><input id="search" oninput="render()" placeholder="Search by name, phone, email, vehicle, service, or notes..."><button class="blue" onclick="search.value='';render()">Clear Search</button></div><div class="stats"><div class="stat"><strong id="total">0</strong><span>Total Customers</span></div><div class="stat"><strong id="shown">0</strong><span>Showing Now</span></div><div class="stat"><strong id="appts">0</strong><span>Total Appointments</span></div><div class="stat"><strong id="inspections">0</strong><span>With Inspections</span></div></div></section><div id="grid" class="grid"><div class="empty">Loading customers...</div></div></main>
<div class="modal-overlay" id="modal"><div class="modal"><h2 id="modalTitle">Add Customer</h2><input type="hidden" id="fId"><div class="form"><div><label>Name *</label><input id="fName"></div><div><label>Phone *</label><input id="fPhone"></div><div><label>Email</label><input id="fEmail"></div><div><label>Vehicle</label><input id="fVehicle"></div><div><label>VIN</label><input id="fVin"></div><div><label>Plate</label><input id="fPlate"></div><div><label>Mileage</label><input id="fMileage"></div><div><label>Last Service</label><input id="fService"></div><div class="full"><label>Notes</label><textarea id="fNotes"></textarea></div></div><div class="modal-actions"><button class="green" onclick="save()">Save Customer</button><button class="light" onclick="closeModal()">Cancel</button></div></div></div>
<script>const cfg=window.SHOP_CONFIG||{};brandName.textContent=cfg.name||'AUTO SHOP';let customers=[];function esc(v){return String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}async function load(){const r=await fetch('/api/admin-data?action=customers');if(r.status===401){location.href='/admin';return}const j=await r.json();customers=j.customers||[];render()}function render(){const q=search.value.toLowerCase().trim(),filtered=customers.filter(c=>[c.name,c.phone,c.email,c.vehicle,c.last_service,c.notes,c.lastAppointmentDate].join(' ').toLowerCase().includes(q));total.textContent=customers.length;shown.textContent=filtered.length;appts.textContent=customers.reduce((n,c)=>n+Number(c.totalAppointments||0),0);inspections.textContent=customers.filter(c=>c.lastInspectionId).length;grid.innerHTML=filtered.length?filtered.map(card).join(''):'<div class="empty">No customers found.</div>'}function initials(n){return String(n||'C').split(/\s+/).slice(0,2).map(x=>x[0]).join('').toUpperCase()}function card(c){return `<article class="customer"><div class="head"><div class="title"><div class="avatar">${esc(initials(c.name))}</div><div><h3>${esc(c.name)}</h3><div>${esc(c.vehicle||'Vehicle not provided')}</div></div></div><span class="pill">${Number(c.totalAppointments||0)} appts</span></div><div class="details"><div class="detail"><label>Phone</label>${esc(c.phone||'Not provided')}</div><div class="detail"><label>Email</label>${esc(c.email||'Not provided')}</div><div class="detail"><label>Last Service</label>${esc(c.last_service||'None')}</div><div class="detail"><label>Last Appointment</label>${esc((c.lastAppointmentDate||'None')+' '+(c.lastAppointmentTime||''))}</div><div class="detail"><label>Last Inspection</label>${esc(c.lastInspectionId||'None')}</div><div class="detail full"><label>Notes</label>${esc(c.notes||'None')}</div></div><div class="actions"><button class="blue" onclick="edit('${c.id}')">Edit</button><button class="danger" onclick="removeCustomer('${c.id}')">Delete</button>${c.phone?`<a class="btn green" href="tel:${esc(c.phone)}">Call</a><a class="btn blue" href="sms:${esc(c.phone)}">Text</a>`:''}${c.email?`<a class="btn light" href="mailto:${esc(c.email)}">Email</a>`:''}${c.lastInspectionId?`<a class="btn" target="_blank" href="/inspection?id=${c.lastInspectionId}">Open Inspection</a>`:''}</div></article>`}function openAdd(){modalTitle.textContent='Add Customer';['fId','fName','fPhone','fEmail','fVehicle','fVin','fPlate','fMileage','fService','fNotes'].forEach(id=>document.getElementById(id).value='');modal.classList.add('open')}function edit(id){const c=customers.find(x=>x.id===id);if(!c)return;modalTitle.textContent='Edit Customer';fId.value=c.id;fName.value=c.name||'';fPhone.value=c.phone||'';fEmail.value=c.email||'';fVehicle.value=c.vehicle||'';fVin.value=c.vin||'';fPlate.value=c.plate||'';fMileage.value=c.mileage||'';fService.value=c.last_service||'';fNotes.value=c.notes||'';modal.classList.add('open')}function closeModal(){modal.classList.remove('open')}async function save(){const body={action:'customer',id:fId.value,name:fName.value,phone:fPhone.value,email:fEmail.value,vehicle:fVehicle.value,vin:fVin.value,plate:fPlate.value,mileage:fMileage.value,last_service:fService.value,notes:fNotes.value};if(!body.name||!body.phone)return alert('Name and phone are required.');const method=body.id?'PATCH':'POST';const r=await fetch('/api/admin-data?action=customer',{method,headers:{'Content-Type':'application/json'},body:JSON.stringify(body)});if(!r.ok){const j=await r.json();return alert(j.error||'Could not save customer')}closeModal();load()}async function removeCustomer(id){if(!confirm('Delete this customer profile?'))return;const r=await fetch('/api/admin-data?action=customer&id='+encodeURIComponent(id),{method:'DELETE'});if(r.ok)load()}load();</script></body></html>
