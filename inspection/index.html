<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Vehicle Inspection Report</title><style>*{box-sizing:border-box}body{margin:0;background:#f4f7fb;font-family:Arial,sans-serif;color:#163051;padding:24px}.report{max-width:900px;margin:auto;background:#fff;border-radius:20px;padding:32px;box-shadow:0 10px 30px rgba(0,0,0,.08)}.topbar{display:flex;justify-content:space-between;align-items:center;gap:16px;margin-bottom:30px;flex-wrap:wrap}.brand{background:#fff;border:1px solid #e3eaf4;padding:14px 18px;border-radius:14px;font-size:21px;font-weight:900}.print-btn{background:#163051;color:#fff;border:0;border-radius:12px;padding:14px 20px;font-weight:800;cursor:pointer}h1{margin:0 0 8px;font-size:34px}.subtitle{color:#60708a;margin-bottom:24px}.section{margin-bottom:28px}.section h2{border-bottom:2px solid #e5ebf3;padding-bottom:10px;margin-bottom:18px;font-size:22px}.info-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:14px}.info-card{background:#f7faff;border:1px solid #e3eaf4;border-radius:14px;padding:14px}.info-card strong{display:block;margin-bottom:6px}.inspection-item{border:1px solid #e2e7ef;border-radius:14px;padding:18px;margin-bottom:14px}.inspection-header{display:flex;justify-content:space-between;align-items:center;gap:14px;flex-wrap:wrap;margin-bottom:10px}.inspection-title{font-size:18px;font-weight:800}.status{border:2px solid #163051;padding:6px 10px;border-radius:999px;font-size:12px;font-weight:800}.recommendations{white-space:pre-wrap;line-height:1.6;background:#f7faff;border:1px solid #e3eaf4;padding:16px;border-radius:14px}.loading,.error{text-align:center;font-size:18px;padding:60px 20px}.error{color:#af2727}@media(max-width:700px){body{padding:14px}.report{padding:22px}h1{font-size:28px}.topbar{flex-direction:column;align-items:flex-start}.print-btn{width:100%}}@media print{@page{size:letter;margin:.35in}body{background:#fff;padding:0;font-size:10px;color:#000}.report,.info-card,.inspection-item,.recommendations{background:#fff;box-shadow:none}.report{border-radius:0;max-width:100%;padding:0}.print-btn{display:none}.topbar{margin-bottom:8px}.brand{font-size:14px;padding:6px;border:1px solid #000}h1{font-size:20px}.subtitle{margin-bottom:8px;font-size:10px}.section{margin-bottom:8px;break-inside:avoid}.section h2{font-size:14px;margin-bottom:6px;padding-bottom:3px;border-bottom:1px solid #000}.info-grid{grid-template-columns:repeat(3,1fr);gap:5px}.info-card{padding:5px;border:1px solid #000;font-size:9px;border-radius:0}.inspection-item{padding:6px;margin-bottom:4px;border:1px solid #000;border-radius:0;break-inside:avoid}.inspection-title{font-size:11px}.status{font-size:8px;padding:2px 5px;border:1px solid #000;border-radius:0}.recommendations{padding:6px;border:1px solid #000;font-size:9px;line-height:1.2}}</style></head><body><script src="/config.js"></script><div class="report" id="report"><div class="loading">Loading inspection report...</div></div><script>
const id=new URLSearchParams(location.search).get('id'),cfg=window.SHOP_CONFIG||{};function esc(v){return String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}function fmt(s){if(!s)return'-';const v=s.toLowerCase();if(v.includes('good'))return'✓ GOOD';if(v.includes('monitor'))return'! MONITOR';if(v.includes('attention'))return'X NEEDS ATTENTION';return String(s).toUpperCase()}function item(title,status,notes){return `<div class="inspection-item"><div class="inspection-header"><div class="inspection-title">${esc(title)}</div><div class="status">${esc(fmt(status))}</div></div><div>${esc(notes||'No notes added.')}</div></div>`}function legacyItems(i){return [['Brakes',i.brakesStatus,i.brakesNotes],['Tires',i.tiresStatus,i.tiresNotes],['Suspension',i.suspensionStatus,i.suspensionNotes],['Fluids',i.fluidsStatus,i.fluidsNotes],['Battery',i.batteryStatus,i.batteryNotes],['Lights',i.lightsStatus,i.lightsNotes],['Wipers',i.wipersStatus,i.wipersNotes],['Filters',i.filtersStatus,i.filtersNotes],['Leaks',i.leaksStatus,i.leaksNotes]].filter(x=>x[1]||x[2])}
async function load(){if(!id){report.innerHTML='<div class="error">Missing inspection ID.</div>';return}const r=await fetch('/api/public-inspection?id='+encodeURIComponent(id)),j=await r.json();if(!r.ok||j.status!=='success'){report.innerHTML='<div class="error">Inspection not found.</div>';return}const i=j.inspection;const dynamic=Array.isArray(i.inspection_items)&&i.inspection_items.length?i.inspection_items.map(x=>[x.title,x.status,x.notes]):legacyItems(i);report.innerHTML=`<div class="topbar"><div class="brand">${esc(cfg.name||j.shop?.name||'AUTO SHOP')}</div><button class="print-btn" onclick="print()">Print Report</button></div><h1>Vehicle Inspection Report</h1><div class="subtitle">Inspection ID: ${esc(i.inspectionId)}</div><div class="section"><h2>Customer & Vehicle Information</h2><div class="info-grid"><div class="info-card"><strong>Customer</strong>${esc(i.customerName||'-')}</div><div class="info-card"><strong>Phone</strong>${esc(i.phone||'-')}</div><div class="info-card"><strong>Vehicle</strong>${esc(i.vehicle||'-')}</div><div class="info-card"><strong>Mileage</strong>${esc(i.mileage||'-')}</div><div class="info-card"><strong>Technician</strong>${esc(i.technician||'-')}</div><div class="info-card"><strong>Overall Status</strong><span class="status">${esc(fmt(i.overallStatus))}</span></div></div></div><div class="section"><h2>Inspection Results</h2>${dynamic.length?dynamic.map(x=>item(x[0],x[1],x[2])).join(''):'<div>No inspection items were added.</div>'}</div><div class="section"><h2>Recommendations</h2><div class="recommendations">${esc(i.recommendations||'No recommendations added.')}</div></div>`}load();
</script></body></html>
