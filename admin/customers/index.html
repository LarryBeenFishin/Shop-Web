<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<title>Customer Profiles</title>
<style>
:root{--navy:#163051;--red:#af2727;--green:#1d7f4f;--bg:#f4f7fb;--line:#dfe6ef;--muted:#60708a;--amber:#b96d09}
*{box-sizing:border-box}body{margin:0;font-family:Arial,sans-serif;background:var(--bg);color:var(--navy)}
button,.btn{border:0;border-radius:11px;padding:11px 15px;background:var(--navy);color:#fff;font:700 14px Arial,sans-serif;cursor:pointer;text-decoration:none;display:inline-flex;align-items:center;justify-content:center;gap:7px}.green{background:var(--green)}.red{background:var(--red)}.light{background:#eef3fa;color:var(--navy)}
.page{max-width:1500px;margin:0 auto;padding:18px 24px 50px}.page-head{display:flex;justify-content:space-between;align-items:flex-end;gap:16px;margin-bottom:16px}.page-head h1{font-size:30px;margin:0 0 4px;letter-spacing:-.025em}.page-head p{margin:0;color:var(--muted);font-size:14px}
.filters{background:#fff;border:1px solid #e3e9f1;border-radius:16px;padding:14px;box-shadow:0 5px 18px rgba(22,48,81,.06);display:grid;grid-template-columns:minmax(260px,1.5fr) minmax(150px,.55fr) auto;gap:10px;margin-bottom:14px}.filters input,.filters select{width:100%;height:43px;border:1px solid #dce4ee;border-radius:10px;padding:9px 11px;font:14px Arial,sans-serif;color:var(--navy);background:#fff}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(340px,1fr));gap:14px}.customer{background:#fff;border:1px solid #e3e9f1;border-radius:17px;box-shadow:0 6px 20px rgba(22,48,81,.06);overflow:hidden}.customer-head{display:flex;justify-content:space-between;gap:12px;padding:16px 17px 13px;border-bottom:1px solid #edf1f6}.identity{display:flex;gap:11px;min-width:0}.avatar{width:42px;height:42px;flex:0 0 42px;border-radius:13px;background:#edf9f2;color:var(--green);font-size:14px;font-weight:900;display:flex;align-items:center;justify-content:center}.identity h2{font-size:18px;margin:1px 0 4px}.contact{color:var(--muted);font-size:12px;line-height:1.45;overflow-wrap:anywhere}.vehicle-count{height:max-content;background:#edf3fa;border-radius:999px;padding:6px 9px;font-size:11px;font-weight:900;white-space:nowrap}.customer-body{padding:13px 17px}.vehicle-preview{display:flex;flex-direction:column;gap:7px}.vehicle-line{border:1px solid #e5ebf3;border-radius:11px;background:#fafcff;padding:10px 11px}.vehicle-line strong{display:block;font-size:13px}.vehicle-line span{display:block;color:var(--muted);font-size:11px;margin-top:3px}.no-vehicle{font-size:12px;color:var(--muted);padding:6px 0}.notes-preview{font-size:12px;line-height:1.45;color:#45566e;border-top:1px solid #edf1f6;margin-top:11px;padding-top:10px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.card-actions{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:12px}.empty{background:#fff;border:1px solid #e3e9f1;border-radius:16px;padding:30px;text-align:center;color:var(--muted);grid-column:1/-1}
.modal-overlay{display:none;position:fixed;inset:0;background:rgba(5,15,30,.58);z-index:9999;align-items:center;justify-content:center;padding:16px}.modal-overlay.open{display:flex}.modal{width:min(820px,100%);max-height:92vh;overflow:auto;background:#fff;border-radius:20px;padding:22px;position:relative}.close{position:absolute;right:15px;top:15px;width:38px;height:38px;padding:0;border:1px solid #d8e0eb;background:#fff;color:var(--navy);font-size:22px}.modal h2{margin:0 50px 4px 0;font-size:25px}.modal-sub{color:var(--muted);font-size:13px;margin-bottom:16px}.contact-grid{display:grid;grid-template-columns:1fr 1fr;gap:9px;margin-bottom:16px}.info{border:1px solid #e4eaf2;border-radius:11px;background:#f9fbfd;padding:11px}.info label{display:block;font-size:10px;text-transform:uppercase;font-weight:900;color:#7a899e;margin-bottom:4px}.info div{font-size:13px;font-weight:700;color:#34465e;overflow-wrap:anywhere}.section{margin-top:18px}.section-head{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:9px}.section h3{font-size:14px;margin:0}.vehicle-card{border:1px solid #e3e9f1;border-radius:13px;padding:12px;margin-bottom:9px}.vehicle-card-head{display:flex;justify-content:space-between;gap:10px}.vehicle-title{font-size:14px;font-weight:900}.vehicle-meta{font-size:11px;color:var(--muted);margin-top:4px}.history{margin-top:10px;border-top:1px solid #edf1f6;padding-top:9px}.history-row{display:grid;grid-template-columns:88px 1fr auto;gap:9px;align-items:center;padding:7px 0;border-top:1px solid #f0f3f7;font-size:12px}.history-row:first-child{border-top:0}.history-date{font-weight:800}.history-copy{min-width:0;color:#45566e}.history-copy strong{color:var(--navy)}.history-link{font-size:11px;font-weight:800;color:var(--navy);text-decoration:none}.note-box{background:#f8fafc;border:1px solid #e3e9f1;border-radius:11px;padding:12px;font-size:13px;line-height:1.5;white-space:pre-wrap;color:#45566e}.modal-actions{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:18px;padding-top:15px;border-top:1px solid #e7ecf3}
.edit-modal{width:min(650px,100%)}.form{display:grid;grid-template-columns:1fr 1fr;gap:10px 12px}.form label{display:block;font-size:12px;font-weight:800;margin:0 0 5px}.form input,.form textarea{width:100%;padding:12px;border:1px solid #dce4ee;border-radius:10px;font:14px Arial,sans-serif}.form textarea{min-height:105px;resize:vertical}.full{grid-column:1/-1}.edit-actions{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:16px}
@media(max-width:700px){.page{padding:14px 10px 40px}.page-head{align-items:flex-start;flex-direction:column}.page-head .btn{width:100%}.filters{grid-template-columns:1fr}.grid{grid-template-columns:1fr}.contact-grid,.form{grid-template-columns:1fr}.full{grid-column:auto}.modal-overlay{padding:8px;align-items:flex-end}.modal{border-radius:20px 20px 0 0;max-height:94vh}.modal-actions{grid-template-columns:1fr}.history-row{grid-template-columns:82px 1fr}.history-link{grid-column:2}.edit-actions{grid-template-columns:1fr 1fr}}
</style>
</head>
<body>
<script src="/config.js"></script>
<main class="page">
  <div class="page-head"><div><h1>Customer Profiles</h1><p>Customers, vehicles, appointments, inspections, and shop notes in one place.</p></div><button class="green" onclick="openAdd()">+ Add Customer</button></div>
  <section class="filters"><input id="search" placeholder="Search name, phone, email, vehicle, service, notes..." oninput="render()"><select id="vehicleFilter" onchange="render()"><option value="">All Customers</option><option value="multi">Multiple Vehicles</option><option value="inspection">Has Inspections</option><option value="appointment">Has Appointments</option></select><button class="light" onclick="search.value='';vehicleFilter.value='';render()">Clear</button></section>
  <div id="grid" class="grid"><div class="empty">Loading customers...</div></div>
</main>
<div id="detailModal" class="modal-overlay" onclick="if(event.target===this)closeDetail()"><div class="modal"><button class="close" onclick="closeDetail()">×</button><div id="detailContent"></div></div></div>
<div id="editModal" class="modal-overlay" onclick="if(event.target===this)closeEdit()"><div class="modal edit-modal"><button class="close" onclick="closeEdit()">×</button><h2 id="editTitle">Edit Customer</h2><div class="modal-sub">Customer contact information and shop notes.</div><input type="hidden" id="fId"><div class="form"><div><label>Name *</label><input id="fName"></div><div><label>Phone *</label><input id="fPhone"></div><div class="full"><label>Email</label><input id="fEmail"></div><div class="full"><label>Internal Customer Notes</label><textarea id="fNotes" placeholder="Shop-only notes about this customer..."></textarea></div></div><div class="edit-actions"><button class="green" onclick="saveCustomer()">Save Customer</button><button class="light" onclick="closeEdit()">Cancel</button></div></div></div>
<script>
let customers=[],appointments=[],inspections=[],vehicleCache=new Map();
function esc(v){return String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}function norm(v){let d=String(v||'').replace(/\D/g,'');if(d.length===11&&d[0]==='1')d=d.slice(1);return d}function lower(v){return String(v||'').toLowerCase()}function initials(n){return String(n||'C').trim().split(/\s+/).slice(0,2).map(x=>x[0]).join('').toUpperCase()}function date(v){if(!v)return'';const d=new Date(v+'T12:00:00');return Number.isNaN(d.getTime())?v:d.toLocaleDateString(undefined,{month:'short',day:'numeric',year:'numeric'})}function inspectionDate(v){const d=new Date(v);return Number.isNaN(d.getTime())?'':d.toLocaleDateString(undefined,{month:'short',day:'numeric',year:'numeric'})}
function customerAppointments(c){const p=norm(c.phone);return appointments.filter(a=>(a.customer_id&&a.customer_id===c.id)||norm(a.phone)===p)}function customerInspections(c){const p=norm(c.phone);return inspections.filter(i=>(i.customer_id&&i.customer_id===c.id)||norm(i.phone)===p)}
function inferredVehicles(c){const map=new Map();const add=(vehicle)=>{const label=vehicleLabel(vehicle),key=lower(label);if(!key)return;const existing=map.get(key);if(!existing)map.set(key,vehicle);else if(!existing.id&&vehicle.id)map.set(key,{...existing,...vehicle})};for(const a of customerAppointments(c)){const label=[a.year,a.make,a.model].filter(Boolean).join(' ').trim();if(!label||label.includes('N/A'))continue;add({id:a.vehicle_id||null,year:a.year,make:a.make,model:a.model,label})}for(const i of customerInspections(c)){const label=String(i.vehicle||'').trim();if(!label)continue;add({id:i.vehicle_id||null,label})}return[...map.values()]}
async function getVehicles(c){if(vehicleCache.has(c.id))return vehicleCache.get(c.id);try{const r=await fetch('/api/customer-lookup?phone='+encodeURIComponent(norm(c.phone)),{cache:'no-store'}),j=await r.json();const v=r.ok&&j.found?(j.vehicles||[]):[];const all=v.length?v:inferredVehicles(c);vehicleCache.set(c.id,all);return all}catch{const all=inferredVehicles(c);vehicleCache.set(c.id,all);return all}}
function vehicleLabel(v){return v.label||[v.year,v.make,v.model].filter(Boolean).join(' ')||'Vehicle'}
function displayVehicles(c){return vehicleCache.get(c.id)||inferredVehicles(c)}
function hasVehicleMatch(record,v){if(v.id&&record.vehicle_id)return record.vehicle_id===v.id;const label=lower(vehicleLabel(v));const recLabel=lower(record.vehicle||[record.year,record.make,record.model].filter(Boolean).join(' '));return label&&recLabel===label}
function customerSearchText(c){const ap=customerAppointments(c),ins=customerInspections(c),vehicles=displayVehicles(c);return[c.name,c.phone,c.email,c.notes,c.last_service,c.vehicle,...vehicles.map(vehicleLabel),...ap.flatMap(a=>[a.service,a.year,a.make,a.model,a.message,a.internal_notes]),...ins.flatMap(i=>[i.vehicle,i.technician,i.recommendations])].join(' ').toLowerCase()}
function render(){const q=lower(search.value.trim()),filter=vehicleFilter.value;const rows=customers.filter(c=>{const ap=customerAppointments(c),ins=customerInspections(c),vs=displayVehicles(c);if(q&&!customerSearchText(c).includes(q))return false;if(filter==='multi'&&vs.length<2)return false;if(filter==='inspection'&&!ins.length)return false;if(filter==='appointment'&&!ap.length)return false;return true});grid.innerHTML=rows.length?rows.map(card).join(''):'<div class="empty">No customers match these filters.</div>'}
function card(c){const ap=customerAppointments(c).sort((a,b)=>String(b.appointment_date).localeCompare(String(a.appointment_date))),ins=customerInspections(c).sort((a,b)=>String(b.created_at).localeCompare(String(a.created_at))),vs=displayVehicles(c),recent=vs.slice(0,2);return `<article class="customer"><div class="customer-head"><div class="identity"><div class="avatar">${esc(initials(c.name))}</div><div><h2>${esc(c.name||'Customer')}</h2><div class="contact">${esc(c.phone||'No phone')}${c.email?'<br>'+esc(c.email):''}</div></div></div><span class="vehicle-count">${vs.length} vehicle${vs.length===1?'':'s'}</span></div><div class="customer-body"><div class="vehicle-preview">${recent.length?recent.map(v=>`<div class="vehicle-line"><strong>${esc(vehicleLabel(v))}</strong><span>${ap.filter(a=>hasVehicleMatch(a,v)).length} appointment(s) • ${ins.filter(i=>hasVehicleMatch(i,v)).length} inspection(s)</span></div>`).join(''):'<div class="no-vehicle">No saved vehicle history yet.</div>'}${vs.length>2?`<div class="no-vehicle">+ ${vs.length-2} more vehicle${vs.length-2===1?'':'s'}</div>`:''}</div>${c.notes?`<div class="notes-preview">${esc(c.notes)}</div>`:''}<div class="card-actions"><button onclick="openDetail('${c.id}')">View Profile</button><button class="light" onclick="editCustomer('${c.id}')">Edit Customer</button></div></div></article>`}
function historyForVehicle(c,v){const ap=customerAppointments(c).filter(a=>hasVehicleMatch(a,v)).map(a=>({type:'Appointment',when:a.appointment_date,title:a.service||'Service appointment',detail:a.appointment_time||'',id:a.id}));const ins=customerInspections(c).filter(i=>hasVehicleMatch(i,v)).map(i=>({type:'Inspection',when:i.created_at,title:'Vehicle Inspection',detail:i.technician?`Technician: ${i.technician}`:'',id:i.id}));return[...ap,...ins].sort((a,b)=>String(b.when).localeCompare(String(a.when)))}
async function openDetail(id){const c=customers.find(x=>x.id===id);if(!c)return;detailContent.innerHTML='<h2>Loading profile…</h2>';detailModal.classList.add('open');const vehicles=await getVehicles(c),ap=customerAppointments(c),ins=customerInspections(c);const vehicleSections=vehicles.length?vehicles.map(v=>{const hist=historyForVehicle(c,v);return `<div class="vehicle-card"><div class="vehicle-card-head"><div><div class="vehicle-title">${esc(vehicleLabel(v))}</div><div class="vehicle-meta">${[v.plate&&'Plate '+v.plate,v.vin&&'VIN '+v.vin,v.mileage&&v.mileage+' mi'].filter(Boolean).map(esc).join(' • ')||'Saved vehicle'}</div></div></div><div class="history">${hist.length?hist.map(h=>`<div class="history-row"><div class="history-date">${esc(h.type==='Appointment'?date(h.when):inspectionDate(h.when))}</div><div class="history-copy"><strong>${esc(h.title)}</strong>${h.detail?'<br>'+esc(h.detail):''}</div>${h.type==='Inspection'?`<a class="history-link" href="/inspection?id=${esc(h.id)}" target="_blank">Report</a>`:''}</div>`).join(''):'<div class="no-vehicle">No history for this vehicle yet.</div>'}</div></div>`}).join(''):'<div class="note-box">No vehicle history saved yet.</div>';detailContent.innerHTML=`<h2>${esc(c.name||'Customer')}</h2><div class="modal-sub">${vehicles.length} vehicle${vehicles.length===1?'':'s'} • ${ap.length} appointment${ap.length===1?'':'s'} • ${ins.length} inspection${ins.length===1?'':'s'}</div><div class="contact-grid"><div class="info"><label>Phone</label><div>${esc(c.phone||'Not provided')}</div></div><div class="info"><label>Email</label><div>${esc(c.email||'Not provided')}</div></div></div><div class="section"><div class="section-head"><h3>Vehicles & Service History</h3></div>${vehicleSections}</div><div class="section"><h3>Internal Customer Notes</h3><div class="note-box">${esc(c.notes||'No customer notes added.')}</div></div><div class="modal-actions">${c.phone?`<a class="btn green" href="sms:${esc(c.phone)}">Text Customer</a>`:'<span></span>'}${c.phone?`<a class="btn" href="tel:${esc(c.phone)}">Call Customer</a>`:'<span></span>'}<button class="light" onclick="closeDetail();editCustomer('${c.id}')">Edit Customer</button></div>`}
function closeDetail(){detailModal.classList.remove('open')}
function openAdd(){editTitle.textContent='Add Customer';fId.value='';fName.value='';fPhone.value='';fEmail.value='';fNotes.value='';editModal.classList.add('open')}
function editCustomer(id){const c=customers.find(x=>x.id===id);if(!c)return;editTitle.textContent='Edit Customer';fId.value=c.id;fName.value=c.name||'';fPhone.value=c.phone||'';fEmail.value=c.email||'';fNotes.value=c.notes||'';editModal.classList.add('open')}
function closeEdit(){editModal.classList.remove('open')}
async function saveCustomer(){const body={action:'customer',id:fId.value,name:fName.value.trim(),phone:fPhone.value.trim(),email:fEmail.value.trim(),notes:fNotes.value.trim()};if(!body.name||!body.phone)return alert('Name and phone are required.');const method=body.id?'PATCH':'POST';const r=await fetch('/api/admin-data?action=customer',{method,headers:{'Content-Type':'application/json'},body:JSON.stringify(body)}),j=await r.json();if(!r.ok)return alert(j.error||'Could not save customer');closeEdit();vehicleCache.clear();await load()}
async function load(){grid.innerHTML='<div class="empty">Loading customers...</div>';try{const [cr,ar,ir]=await Promise.all([fetch('/api/admin-data?action=customers',{cache:'no-store'}),fetch('/api/admin-data?action=appointments',{cache:'no-store'}),fetch('/api/admin-data?action=inspections',{cache:'no-store'})]);if(cr.status===401||ar.status===401||ir.status===401){location.href='/admin';return}const [cj,aj,ij]=await Promise.all([cr.json(),ar.json(),ir.json()]);if(!cr.ok)throw new Error(cj.error||'Unable to load customers');customers=cj.customers||[];appointments=aj.appointments||[];inspections=ij.inspections||[];vehicleCache.clear();await Promise.all(customers.map(c=>getVehicles(c)));render()}catch(e){grid.innerHTML=`<div class="empty">${esc(e.message||'Could not load customer profiles.')}</div>`}}
load();
</script>
</body>
</html>
