<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<title>Inspection Requests</title>
<style>
:root{--navy:#172033;--blue:#2563eb;--green:#168052;--amber:#c46f09;--red:#bc2f37;--muted:#68768a;--line:#e1e7ef;--bg:#f5f7fb}*{box-sizing:border-box}html,body{margin:0;min-height:100%;font-family:Inter,Arial,sans-serif;background:var(--bg);color:var(--navy)}button,input,select,textarea{font:inherit}.page{max-width:1380px;margin:0 auto;padding:28px 28px 60px}.page-head{display:flex;justify-content:space-between;align-items:flex-end;gap:18px;margin-bottom:18px}.page-head h1{font-size:30px;letter-spacing:-.035em;margin:0}.page-head p{font-size:14px;color:var(--muted);margin:7px 0 0}.btn{border:0;border-radius:11px;padding:11px 15px;background:var(--blue);color:#fff;text-decoration:none;font-weight:850;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:7px}.btn:hover{filter:brightness(.96)}.btn.light{background:#edf2f8;color:#29415f}.btn.danger{background:#fff0f1;color:#ad2830;border:1px solid #f0cdd0}.filters{display:flex;gap:8px;margin-bottom:13px;flex-wrap:wrap}.filter{border:1px solid var(--line);background:#fff;color:#526177;border-radius:999px;padding:8px 12px;font-size:12px;font-weight:850;cursor:pointer}.filter.active{background:var(--navy);color:#fff;border-color:var(--navy)}.request-list{display:flex;flex-direction:column;gap:10px}.request{display:grid;grid-template-columns:minmax(220px,1.2fr) minmax(190px,1fr) minmax(150px,.7fr) minmax(130px,.55fr) auto;align-items:center;gap:18px;background:#fff;border:1px solid var(--line);border-radius:15px;padding:16px 17px;box-shadow:0 5px 18px rgba(15,23,42,.045)}.customer strong,.vehicle strong{display:block;font-size:14px}.customer span,.vehicle span,.meta{display:block;color:var(--muted);font-size:12px;margin-top:4px}.tech{font-size:13px;font-weight:800}.status{display:inline-flex;align-items:center;gap:7px;border-radius:999px;padding:7px 10px;font-size:11px;font-weight:900;width:max-content}.status:before{content:'';width:8px;height:8px;border-radius:50%;background:currentColor}.status.requested{background:#eaf1ff;color:#2459aa}.status.in_progress{background:#fff5df;color:#a56408}.status.completed{background:#e7f7ef;color:#137347}.status.cancelled{background:#f1f3f6;color:#677386}.row-actions{display:flex;gap:7px}.row-actions .btn{font-size:12px;padding:9px 11px}.empty{background:#fff;border:1px dashed #cfd8e5;border-radius:16px;padding:42px 20px;text-align:center;color:var(--muted)}.empty strong{display:block;color:var(--navy);font-size:17px;margin-bottom:6px}.modal-wrap{display:none;position:fixed;inset:0;background:rgba(7,16,30,.62);z-index:10000;align-items:center;justify-content:center;padding:18px}.modal-wrap.open{display:flex}.modal{width:min(620px,100%);max-height:94vh;overflow:auto;background:#fff;border-radius:20px;padding:23px;box-shadow:0 30px 80px rgba(0,0,0,.24)}.modal-head{display:flex;justify-content:space-between;align-items:flex-start;gap:14px;margin-bottom:18px}.modal h2{margin:0;font-size:24px}.modal-head p{color:var(--muted);font-size:13px;margin:5px 0 0}.close{border:0;background:#eef2f7;color:var(--navy);border-radius:10px;width:38px;height:38px;font-size:22px;cursor:pointer}.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:13px}.field{display:block;color:#6c7a8e;font-size:11px;font-weight:900;text-transform:uppercase;letter-spacing:.05em}.field.full{grid-column:1/-1}.field input,.field select,.field textarea{display:block;width:100%;margin-top:6px;border:1px solid #d6deea;border-radius:11px;background:#fff;color:var(--navy);padding:11px 12px;min-height:44px}.field textarea{min-height:92px;resize:vertical}.form-actions{display:flex;justify-content:flex-end;gap:9px;margin-top:18px}.notice{min-height:19px;margin-top:11px;color:var(--red);font-size:13px;font-weight:750;text-align:right}.loading{padding:60px;text-align:center;color:var(--muted)}
@media(max-width:980px){.request{grid-template-columns:1fr 1fr}.row-actions{grid-column:1/-1}.request .status{justify-self:end}}
@media(max-width:640px){.page{padding:74px 12px 40px}.page-head{align-items:stretch;flex-direction:column}.page-head .btn{width:100%}.request{grid-template-columns:1fr;gap:11px}.request .status{justify-self:start}.row-actions{grid-column:auto}.row-actions .btn{flex:1}.form-grid{grid-template-columns:1fr}.field.full{grid-column:auto}.modal-wrap{padding:7px;align-items:flex-end}.modal{border-radius:20px 20px 0 0}.form-actions{display:grid;grid-template-columns:1fr 1fr}}
</style>
</head>
<body>
<script src="/config.js"></script>
<main class="page">
  <div class="page-head"><div><h1>Inspection Requests</h1><p>Assign a customer vehicle to a technician and follow the report through completion.</p></div><button class="btn" id="newRequest">+ Request Inspection</button></div>
  <div class="filters" id="filters"></div>
  <div id="requestList" class="loading">Loading inspection requests…</div>
</main>
<div class="modal-wrap" id="requestModal" onclick="if(event.target===this)closeModal()">
  <form class="modal" id="requestForm">
    <div class="modal-head"><div><h2>Request an inspection</h2><p>The assigned technician will see it after signing in.</p></div><button class="close" type="button" onclick="closeModal()" aria-label="Close">×</button></div>
    <div class="form-grid">
      <label class="field full">Customer<select id="customerId" required></select></label>
      <label class="field full">Vehicle<select id="vehicleId" required></select></label>
      <label class="field">Technician<select id="technicianId" required></select></label>
      <label class="field">Due date (optional)<input id="dueDate" type="date"></label>
      <label class="field full">Instructions for the technician<textarea id="requestNotes" maxlength="3000" placeholder="Customer concern, items to inspect, or other notes…"></textarea></label>
    </div>
    <div class="notice" id="formNotice"></div>
    <div class="form-actions"><button class="btn light" type="button" onclick="closeModal()">Cancel</button><button class="btn" id="submitRequest" type="submit">Send Request</button></div>
  </form>
</div>
<script>
let requests=[],customers=[],technicians=[],activeFilter='open',saving=false;
const list=document.getElementById('requestList'),modal=document.getElementById('requestModal');
function esc(value){return String(value??'').replace(/[&<>"']/g,char=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[char]))}
function formatDate(value,withTime=false){if(!value)return'Not set';const date=new Date(withTime?value:value+'T12:00:00');if(Number.isNaN(date.getTime()))return value;return date.toLocaleDateString(undefined,{month:'short',day:'numeric',year:'numeric',...(withTime?{hour:'numeric',minute:'2-digit'}:{})})}
function statusLabel(value){return({requested:'Requested',in_progress:'In progress',completed:'Completed',cancelled:'Cancelled'})[value]||value}
function filtered(){if(activeFilter==='all')return requests;if(activeFilter==='open')return requests.filter(item=>item.status==='requested'||item.status==='in_progress');return requests.filter(item=>item.status===activeFilter)}
function renderFilters(){const counts={open:requests.filter(item=>['requested','in_progress'].includes(item.status)).length,completed:requests.filter(item=>item.status==='completed').length,cancelled:requests.filter(item=>item.status==='cancelled').length,all:requests.length};filters.innerHTML=[['open','Open'],['completed','Completed'],['cancelled','Cancelled'],['all','All']].map(([key,label])=>`<button class="filter ${activeFilter===key?'active':''}" data-filter="${key}">${label} · ${counts[key]}</button>`).join('');filters.querySelectorAll('[data-filter]').forEach(button=>button.onclick=()=>{activeFilter=button.dataset.filter;render()})}
function render(){renderFilters();const rows=filtered();list.className='request-list';if(!rows.length){list.innerHTML=`<div class="empty"><strong>${activeFilter==='open'?'No open requests':'Nothing here yet'}</strong>${activeFilter==='open'?'Create a request when a vehicle is ready for inspection.':'Try another status.'}</div>`;return}list.innerHTML=rows.map(item=>`<article class="request"><div class="customer"><strong>${esc(item.customer_name)}</strong><span>${esc(item.phone||item.email||'No contact information')}</span></div><div class="vehicle"><strong>${esc(item.vehicle)}</strong><span>${item.mileage?esc(item.mileage)+' miles':'Mileage not entered'}</span></div><div><div class="tech">${esc(item.technician_name)}</div><span class="meta">Assigned technician</span></div><div><span class="status ${esc(item.status)}">${esc(statusLabel(item.status))}</span><span class="meta">${item.due_date?'Due '+esc(formatDate(item.due_date)):'Requested '+esc(formatDate(item.created_at,true))}</span></div><div class="row-actions">${item.status==='completed'&&item.inspection_id?`<a class="btn" target="_blank" href="/inspection?id=${encodeURIComponent(item.inspection_id)}">View Report</a>`:''}${!['completed','cancelled'].includes(item.status)?`<button class="btn danger" data-cancel="${esc(item.id)}">Cancel</button>`:''}</div></article>`).join('');list.querySelectorAll('[data-cancel]').forEach(button=>button.onclick=()=>cancelRequest(button.dataset.cancel))}
function customerOptions(){customerId.innerHTML='<option value="">Select customer</option>'+customers.map(customer=>`<option value="${esc(customer.id)}">${esc(customer.name)} · ${esc(customer.phone||customer.email||'No contact')}</option>`).join('');updateVehicles()}
function updateVehicles(){const customer=customers.find(item=>item.id===customerId.value),vehicles=customer?.vehicles||[];vehicleId.innerHTML='<option value="">'+(customer?'Select vehicle':'Choose a customer first')+'</option>'+vehicles.map(vehicle=>`<option value="${esc(vehicle.id)}">${esc([vehicle.year,vehicle.make,vehicle.model].filter(Boolean).join(' ')||vehicle.nickname||'Vehicle')}${vehicle.plate?' · '+esc(vehicle.plate):''}</option>`).join('');vehicleId.disabled=!customer||!vehicles.length;if(customer&&!vehicles.length)vehicleId.innerHTML='<option value="">No saved vehicles for this customer</option>'}
function openModal(){const active=technicians.filter(item=>item.active),selectedCustomer=new URLSearchParams(location.search).get('customer');formNotice.textContent='';customerOptions();if(selectedCustomer&&customers.some(item=>item.id===selectedCustomer)){customerId.value=selectedCustomer;updateVehicles()}technicianId.innerHTML='<option value="">Select technician</option>'+active.map(item=>`<option value="${esc(item.id)}">${esc(item.name)} · @${esc(item.username)}</option>`).join('');submitRequest.disabled=!customers.some(item=>(item.vehicles||[]).length)||!active.length;if(!active.length)formNotice.textContent='Create an active technician account in Shop Settings first.';else if(!customers.some(item=>(item.vehicles||[]).length))formNotice.textContent='Add a vehicle to a customer profile first.';modal.classList.add('open');document.body.style.overflow='hidden'}
function closeModal(){modal.classList.remove('open');document.body.style.overflow=''}
async function load(){try{const [requestResponse,customerResponse,settingsResponse]=await Promise.all([fetch('/api/admin-data?action=inspection-requests',{cache:'no-store'}),fetch('/api/admin-data?action=customers',{cache:'no-store'}),fetch('/api/admin-data?action=shop-settings',{cache:'no-store'})]);if([requestResponse,customerResponse,settingsResponse].some(response=>response.status===401)){location.href='/admin';return}const [requestJson,customerJson,settingsJson]=await Promise.all([requestResponse.json(),customerResponse.json(),settingsResponse.json()]);if(!requestResponse.ok)throw new Error(requestJson.error||'Could not load inspection requests');if(!customerResponse.ok)throw new Error(customerJson.error||'Could not load customers');if(!settingsResponse.ok)throw new Error(settingsJson.error||'Could not load technicians');requests=requestJson.requests||[];customers=customerJson.customers||[];technicians=(settingsJson.shop?.technicians||[]).filter(item=>item.id);render();if(new URLSearchParams(location.search).get('new')==='1')openModal()}catch(error){list.className='empty';list.innerHTML=`<strong>Could not load inspection requests</strong>${esc(error.message)}`}}
async function cancelRequest(id){if(!confirm('Cancel this inspection request?'))return;try{const response=await fetch('/api/admin-data?action=inspection-request',{method:'PATCH',headers:{'Content-Type':'application/json'},body:JSON.stringify({id,status:'cancelled'})}),json=await response.json();if(!response.ok)throw new Error(json.error||'Could not cancel request');const index=requests.findIndex(item=>item.id===id);if(index>=0)requests[index]={...requests[index],...json.request};render()}catch(error){alert(error.message)}}
customerId.onchange=updateVehicles;newRequest.onclick=openModal;
requestForm.onsubmit=async event=>{event.preventDefault();if(saving)return;saving=true;submitRequest.disabled=true;formNotice.textContent='Sending request…';try{const response=await fetch('/api/admin-data?action=inspection-request',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({customer_id:customerId.value,vehicle_id:vehicleId.value,technician_id:technicianId.value,due_date:dueDate.value,request_notes:requestNotes.value.trim()})}),json=await response.json();if(response.status===401){location.href='/admin';return}if(!response.ok)throw new Error(json.error||'Could not create request');requests.unshift(json.request);requestForm.reset();closeModal();activeFilter='open';render()}catch(error){formNotice.textContent=error.message}finally{saving=false;submitRequest.disabled=false}};
load();
</script>
</body>
</html>
