<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<title>Shop Settings</title>
<style>
:root{--navy:#172033;--blue:#2563eb;--green:#168052;--red:#c52f35;--muted:#68768a;--line:#e2e8f0;--bg:#f5f7fb}*{box-sizing:border-box}html,body{margin:0;min-height:100%;font-family:Inter,Arial,sans-serif;background:var(--bg);color:var(--navy)}button,input,select{font:inherit}.wrap{max-width:1100px;margin:0 auto;padding:34px 28px 60px}.page-intro{display:flex;justify-content:space-between;align-items:flex-start;gap:20px;margin-bottom:22px}.page-intro h1{margin:0;font-size:30px;letter-spacing:-.035em}.page-intro p{margin:8px 0 0;color:var(--muted);font-size:14px;line-height:1.55;max-width:680px}.timezone{white-space:nowrap;background:#eaf1ff;color:#245092;border:1px solid #d7e4fb;border-radius:999px;padding:8px 12px;font-size:12px;font-weight:800}.card{background:#fff;border:1px solid var(--line);border-radius:18px;box-shadow:0 10px 28px rgba(15,23,42,.06);padding:22px;margin-bottom:18px}.card-head{display:flex;justify-content:space-between;align-items:flex-start;gap:16px;margin-bottom:18px}.card-head h2{margin:0;font-size:19px;letter-spacing:-.02em}.card-head p{margin:5px 0 0;color:var(--muted);font-size:13px;line-height:1.45}.profile-grid{display:grid;grid-template-columns:minmax(240px,.7fr) minmax(420px,1.3fr);gap:18px}.settings-panel{border:1px solid #e5eaf1;background:#f8fafc;border-radius:14px;padding:16px}.settings-panel h3{font-size:14px;margin:0 0 5px}.settings-panel>p{font-size:12px;color:var(--muted);margin:0 0 13px;line-height:1.45}.technician-add{display:grid;grid-template-columns:1fr 1fr;gap:9px;align-items:end}.technician-add .btn{grid-column:2}.technician-list{display:flex;flex-direction:column;gap:7px;margin-top:12px}.technician-row{display:flex;align-items:center;gap:10px;border:1px solid #e1e7ef;border-radius:11px;background:#fff;padding:9px 10px}.technician-row.inactive{opacity:.62}.tech-avatar{width:30px;height:30px;flex:0 0 30px;border-radius:9px;background:#e9f1ff;color:#2859a5;display:grid;place-items:center;font-size:10px;font-weight:900}.technician-name{font-size:13px;font-weight:800;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis}.technician-name small{display:block;font-size:11px;font-weight:650;color:#718097;margin-top:2px}.technician-row .btn{padding:7px 9px;font-size:11px}.schedule-head,.day-row{display:grid;grid-template-columns:minmax(150px,1fr) minmax(140px,.8fr) minmax(140px,.8fr);gap:14px;align-items:center}.schedule-head{padding:0 14px 8px;color:#8490a2;font-size:10px;font-weight:900;letter-spacing:.08em;text-transform:uppercase}.day-row{border-top:1px solid #edf1f6;padding:13px 14px}.day-toggle{display:flex;align-items:center;gap:11px;font-size:14px;font-weight:850}.day-toggle input{width:18px;height:18px;accent-color:var(--blue)}label.field{display:block;color:#728096;font-size:10px;font-weight:900;text-transform:uppercase;letter-spacing:.06em}input[type=time],input[type=date],input[type=text],input[type=password],select{width:100%;margin-top:5px;border:1px solid #d7dee9;border-radius:10px;background:#fff;color:var(--navy);padding:10px 11px;min-height:42px}input:disabled{background:#f4f6f9;color:#a0a9b7}.actions{display:flex;align-items:center;justify-content:flex-end;gap:10px;margin-top:18px}.btn,button.btn{border:0;border-radius:10px;padding:11px 15px;font-weight:850;cursor:pointer;background:var(--blue);color:#fff}.btn:hover{filter:brightness(.96)}.btn.light{background:#eef3fa;color:#29415f}.btn.danger{background:#fff0f1;color:#b3262c;border:1px solid #f2ced1}.btn:disabled{opacity:.58;cursor:not-allowed}.btn-link{display:inline-block;margin-top:10px;color:#2457a6;font-size:12px;font-weight:800;text-decoration:none}.notice{min-height:20px;margin-top:10px;text-align:right;color:var(--green);font-size:13px;font-weight:750}.closure-form{display:grid;grid-template-columns:1fr 1fr minmax(190px,1.4fr) auto;gap:12px;align-items:end;padding:16px;border:1px solid #e6ebf2;background:#f8fafc;border-radius:14px}.closure-list{margin-top:14px;display:flex;flex-direction:column;gap:9px}.closure{display:grid;grid-template-columns:minmax(190px,.8fr) 1fr auto;gap:14px;align-items:center;border:1px solid #e5eaf1;border-radius:13px;padding:13px 14px}.closure-dates{font-size:13px;font-weight:850}.closure-reason{font-size:13px;color:#526177}.empty{border:1px dashed #d5dde8;border-radius:13px;padding:22px;text-align:center;color:#77859a;font-size:13px}.loading{padding:60px;text-align:center;color:var(--muted)}.summary{display:flex;align-items:center;gap:9px;color:#526177;font-size:12px}.summary-dot{width:9px;height:9px;border-radius:50%;background:var(--green)}@media(max-width:760px){.wrap{padding:72px 14px 34px}.page-intro{display:block}.timezone{display:inline-block;margin-top:12px}.profile-grid{grid-template-columns:1fr}.technician-add{grid-template-columns:1fr}.technician-add .btn{grid-column:auto}.schedule-head{display:none}.day-row{grid-template-columns:1fr 1fr;padding:14px 4px}.day-toggle{grid-column:1/-1}.closure-form{grid-template-columns:1fr 1fr}.closure-form .reason{grid-column:1/-1}.closure-form .btn{grid-column:1/-1}.closure{grid-template-columns:1fr auto}.closure-reason{grid-column:1/2}.card{padding:17px}.card-head{display:block}.summary{margin-top:10px}.actions{justify-content:stretch}.actions .btn{width:100%}}
.inspection-template-list{display:flex;flex-direction:column;gap:9px}.inspection-template-row{display:grid;grid-template-columns:36px minmax(0,1fr) auto auto auto;gap:8px;align-items:center;border:1px solid #e1e7ef;border-radius:12px;background:#f8fafc;padding:9px}.inspection-template-number{width:30px;height:30px;border-radius:9px;background:#e9f1ff;color:#2859a5;display:grid;place-items:center;font-size:11px;font-weight:900}.inspection-template-row input{margin:0}.inspection-template-row .btn{padding:9px 11px;font-size:12px}.template-actions{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;margin-top:14px}.template-actions>div{display:flex;gap:9px;flex-wrap:wrap}.password-form{display:grid;grid-template-columns:repeat(3,minmax(0,1fr)) auto;gap:10px;align-items:end}.password-dialog{width:min(92vw,480px);border:0;border-radius:18px;padding:0;box-shadow:0 24px 80px rgba(15,23,42,.3)}.password-dialog::backdrop{background:rgba(8,15,28,.58)}.password-dialog-card{padding:22px}.password-dialog-card h2{margin:0 0 6px;font-size:20px}.password-dialog-card>p{margin:0 0 18px;color:var(--muted);font-size:13px;line-height:1.45}.password-dialog-actions{display:flex;justify-content:flex-end;gap:9px;margin-top:17px}@media(max-width:760px){.inspection-template-row{grid-template-columns:32px minmax(0,1fr) repeat(3,40px)}.inspection-template-row .btn{padding:9px 6px}.inspection-template-row .move-label{display:none}.template-actions,.template-actions>div{align-items:stretch;flex-direction:column}.template-actions .btn{width:100%}.password-form{grid-template-columns:1fr}.password-form .btn{width:100%}.technician-row{align-items:flex-start;flex-wrap:wrap}.technician-name{flex-basis:calc(100% - 40px)}.technician-row .btn{flex:1}.password-dialog-actions{flex-direction:column-reverse}.password-dialog-actions .btn{width:100%}}
</style>
</head>
<body>
<script src="/config.js"></script>
<main class="wrap">
  <div class="page-intro">
    <div><h1>Shop Settings</h1><p>Manage your business name, technicians, appointment hours, and closed dates in one place.</p></div>
    <div class="timezone" id="timezone">Loading timezone…</div>
  </div>
  <div id="content" class="loading">Loading appointment settings…</div>
</main>
<dialog class="password-dialog" id="techResetDialog"><form class="password-dialog-card" id="techResetForm"><h2>Reset technician password</h2><p id="techResetDescription">Set a temporary password the technician can use to sign in.</p><label class="field">New temporary password<input id="techResetPassword" type="password" minlength="8" autocomplete="new-password" required></label><label class="field" style="margin-top:12px">Confirm password<input id="techResetConfirm" type="password" minlength="8" autocomplete="new-password" required></label><div class="notice" id="techResetNotice"></div><div class="password-dialog-actions"><button class="btn light" id="cancelTechReset" type="button">Cancel</button><button class="btn" id="saveTechReset" type="submit">Reset password</button></div></form></dialog>
<script>
const DAYS=[['sunday','Sunday'],['monday','Monday'],['tuesday','Tuesday'],['wednesday','Wednesday'],['thursday','Thursday'],['friday','Friday'],['saturday','Saturday']],DEFAULT_INSPECTION_BLOCKS=['DASHBOARD LIGHTS','BATTERY','LIGHTS','STEERING AND SUSPENSION','BRAKES','TIRES','FLUIDS','FILTERS / BELTS'];
let availability=null,shopSettings={name:'',technicians:[],inspectionBlocks:[...DEFAULT_INSPECTION_BLOCKS]},timezone='America/Chicago',saving=false,resetTechnicianId='';
const content=document.getElementById('content');
function esc(v){return String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function displayDate(value){if(!value)return'';return new Date(value+'T12:00:00').toLocaleDateString(undefined,{month:'short',day:'numeric',year:'numeric'})}
function initials(name){return String(name||'T').trim().split(/\s+/).slice(0,2).map(x=>x[0]).join('').toUpperCase()}
function technicianList(){if(!shopSettings.technicians.length)return'<div class="empty" style="padding:15px">No technician accounts yet.</div>';return shopSettings.technicians.map(tech=>`<div class="technician-row"><div class="tech-avatar">${esc(initials(tech.name))}</div><div class="technician-name">${esc(tech.name)}<small>${tech.username?'@'+esc(tech.username):'Needs an account'}</small></div>${tech.id?`<button class="btn light" type="button" data-reset-technician="${esc(tech.id)}" data-technician-name="${esc(tech.name)}">Reset password</button><button class="btn danger" type="button" data-delete-technician="${esc(tech.id)}">Delete</button>`:''}</div>`).join('')}
function inspectionTemplateList(){return shopSettings.inspectionBlocks.map((title,index)=>`<div class="inspection-template-row"><div class="inspection-template-number">${index+1}</div><input type="text" maxlength="120" value="${esc(title)}" aria-label="Inspection block ${index+1}" data-template-title="${index}"><button class="btn light" type="button" data-template-up="${index}" ${index===0?'disabled':''} title="Move up">↑ <span class="move-label">Up</span></button><button class="btn light" type="button" data-template-down="${index}" ${index===shopSettings.inspectionBlocks.length-1?'disabled':''} title="Move down">↓ <span class="move-label">Down</span></button><button class="btn danger" type="button" data-template-remove="${index}" title="Remove">×</button></div>`).join('')}
function render(){
  const openCount=DAYS.filter(([key])=>availability.weekly[key]?.enabled).length;
  content.className='';
  content.innerHTML=`<section class="card"><div class="card-head"><div><h2>Shop profile</h2><p>Update the business name customers see and create limited-access accounts for technicians.</p></div></div><div class="profile-grid"><div class="settings-panel"><h3>Business name</h3><p>This is the name customers will see.</p><label class="field">Shop name<input id="shopName" type="text" maxlength="120" value="${esc(shopSettings.name)}"></label><button class="btn" id="saveShopName" style="margin-top:12px;width:100%">Save business name</button></div><div class="settings-panel"><h3>Technician accounts</h3><p>Technicians can sign in to view assigned vehicles and complete inspection reports. They cannot access the admin.</p><div class="technician-add"><label class="field">Name<input id="newTechnician" type="text" maxlength="120" placeholder="Alex Rivera"></label><label class="field">Username<input id="newTechUsername" type="text" maxlength="40" autocomplete="off" placeholder="alex"></label><label class="field">Temporary password<input id="newTechPassword" type="password" minlength="8" autocomplete="new-password" placeholder="At least 8 characters"></label><button class="btn" id="addTechnician">Create account</button></div><a class="btn-link" href="/tech" target="_blank">Open technician sign-in ↗</a><div class="technician-list">${technicianList()}</div></div></div><div class="notice" id="settingsNotice"></div></section><section class="card"><div class="card-head"><div><h2>Owner password</h2><p>Change the password for the shop owner account currently signed in.</p></div></div><form class="password-form" id="ownerPasswordForm"><label class="field">Current password<input id="ownerCurrentPassword" type="password" autocomplete="current-password" required></label><label class="field">New password<input id="ownerNewPassword" type="password" minlength="8" autocomplete="new-password" required></label><label class="field">Confirm new password<input id="ownerConfirmPassword" type="password" minlength="8" autocomplete="new-password" required></label><button class="btn" type="submit">Change password</button></form><div class="notice" id="ownerPasswordNotice"></div></section><section class="card"><div class="card-head"><div><h2>Inspection blocks</h2><p>These blocks are automatically placed into every new inspection. Rename, reorder, add, or remove them to match this shop's process.</p></div><div class="summary"><span class="summary-dot"></span>${shopSettings.inspectionBlocks.length} default block${shopSettings.inspectionBlocks.length===1?'':'s'}</div></div><div class="inspection-template-list">${inspectionTemplateList()}</div><div class="template-actions"><div><button class="btn light" type="button" id="addInspectionBlock">+ Add block</button><button class="btn light" type="button" id="resetInspectionBlocks">Restore original defaults</button></div><button class="btn" type="button" id="saveInspectionBlocks">Save inspection blocks</button></div><div class="notice" id="inspectionTemplateNotice"></div></section><section class="card"><div class="card-head"><div><h2>Weekly appointment hours</h2><p>Set the first and last appointment customers can choose for each day.</p></div><div class="summary"><span class="summary-dot"></span>${openCount} day${openCount===1?'':'s'} accepting appointments</div></div><div class="schedule-head"><div>Day</div><div>First appointment</div><div>Last appointment</div></div><div id="weeklyRows">${DAYS.map(([key,label])=>dayRow(key,label)).join('')}</div><div class="actions"><label class="field" style="min-width:150px">Time between appointments<select id="slotMinutes"><option value="15" ${availability.slotMinutes===15?'selected':''}>15 minutes</option><option value="30" ${availability.slotMinutes===30?'selected':''}>30 minutes</option><option value="45" ${availability.slotMinutes===45?'selected':''}>45 minutes</option><option value="60" ${availability.slotMinutes===60?'selected':''}>60 minutes</option></select></label><button class="btn" id="saveSchedule">Save weekly hours</button></div><div class="notice" id="scheduleNotice"></div></section><section class="card"><div class="card-head"><div><h2>Vacation and closed dates</h2><p>Block one day or a date range. Customers cannot request new appointments during the closure; existing appointments remain on your calendar.</p></div></div><div class="closure-form"><label class="field">First closed day<input id="closureStart" type="date"></label><label class="field">Last closed day<input id="closureEnd" type="date"></label><label class="field reason">Reason shown to customers<input id="closureReason" type="text" maxlength="160" placeholder="Vacation, holiday, training…"></label><button class="btn" id="addClosure">Block dates</button></div><div class="notice" id="closureNotice"></div><div class="closure-list" id="closureList">${closureList()}</div></section>`;
  DAYS.forEach(([key])=>{const toggle=document.getElementById('enabled-'+key);toggle.onchange=()=>{document.getElementById('start-'+key).disabled=!toggle.checked;document.getElementById('end-'+key).disabled=!toggle.checked}});
  document.getElementById('saveShopName').onclick=()=>saveShopSettings('Business name saved.');
  document.getElementById('ownerPasswordForm').onsubmit=changeOwnerPassword;
  document.getElementById('addTechnician').onclick=addTechnician;
  document.getElementById('newTechPassword').onkeydown=e=>{if(e.key==='Enter'){e.preventDefault();addTechnician()}};
  document.querySelectorAll('[data-reset-technician]').forEach(btn=>btn.onclick=()=>openTechnicianReset(btn.dataset.resetTechnician,btn.dataset.technicianName));
  document.querySelectorAll('[data-delete-technician]').forEach(btn=>btn.onclick=()=>deleteTechnician(btn.dataset.deleteTechnician));
  document.getElementById('addInspectionBlock').onclick=addInspectionBlock;
  document.getElementById('resetInspectionBlocks').onclick=resetInspectionBlocks;
  document.getElementById('saveInspectionBlocks').onclick=saveInspectionBlocks;
  document.querySelectorAll('[data-template-up]').forEach(btn=>btn.onclick=()=>moveInspectionBlock(Number(btn.dataset.templateUp),-1));
  document.querySelectorAll('[data-template-down]').forEach(btn=>btn.onclick=()=>moveInspectionBlock(Number(btn.dataset.templateDown),1));
  document.querySelectorAll('[data-template-remove]').forEach(btn=>btn.onclick=()=>removeInspectionBlock(Number(btn.dataset.templateRemove)));
  document.getElementById('saveSchedule').onclick=saveSchedule;
  document.getElementById('addClosure').onclick=addClosure;
  document.querySelectorAll('[data-delete-closure]').forEach(btn=>btn.onclick=()=>deleteClosure(btn.dataset.deleteClosure));
}
function openTechnicianReset(id,name){resetTechnicianId=id;document.getElementById('techResetDescription').textContent=`Set a temporary password for ${name||'this technician'}. Their old password will stop working.`;document.getElementById('techResetForm').reset();document.getElementById('techResetNotice').textContent='';document.getElementById('techResetDialog').showModal();setTimeout(()=>document.getElementById('techResetPassword').focus(),50)}
async function resetTechnicianPassword(event){event.preventDefault();if(saving||!resetTechnicianId)return;const form=event.currentTarget,password=document.getElementById('techResetPassword').value,confirmPassword=document.getElementById('techResetConfirm').value,notice=document.getElementById('techResetNotice'),button=document.getElementById('saveTechReset');notice.style.color='#b3262c';if(password.length<8){notice.textContent='Password must be at least 8 characters.';return}if(password!==confirmPassword){notice.textContent='Passwords do not match.';return}saving=true;button.disabled=true;notice.textContent='Resetting password…';try{const r=await fetch('/api/admin-data?action=technician',{method:'PATCH',headers:{'Content-Type':'application/json'},body:JSON.stringify({id:resetTechnicianId,password})}),j=await r.json();if(r.status===401){location.href='/admin';return}if(!r.ok)throw new Error(j.error||'Could not reset technician password');form.reset();document.getElementById('techResetDialog').close();document.getElementById('settingsNotice').style.color='#168052';document.getElementById('settingsNotice').textContent='Technician password reset.'}catch(error){notice.textContent=error.message}finally{saving=false;button.disabled=false}}
async function changeOwnerPassword(event){event.preventDefault();if(saving)return;const form=event.currentTarget,currentPassword=document.getElementById('ownerCurrentPassword').value,newPassword=document.getElementById('ownerNewPassword').value,confirmPassword=document.getElementById('ownerConfirmPassword').value,notice=document.getElementById('ownerPasswordNotice');notice.style.color='#168052';if(newPassword.length<8){notice.textContent='New password must be at least 8 characters.';notice.style.color='#b3262c';return}if(newPassword!==confirmPassword){notice.textContent='New passwords do not match.';notice.style.color='#b3262c';return}saving=true;notice.textContent='Changing password…';try{const r=await fetch('/api/admin-data?action=owner-password',{method:'PUT',headers:{'Content-Type':'application/json'},body:JSON.stringify({currentPassword,newPassword})}),j=await r.json();if(r.status===401&&j.error==='Unauthorized'){location.href='/admin';return}if(!r.ok)throw new Error(j.error||'Could not change password');form.reset();notice.textContent='Password changed.'}catch(error){notice.textContent=error.message;notice.style.color='#b3262c'}finally{saving=false}}
async function saveShopSettings(message='Shop settings saved.'){if(saving)return;const notice=document.getElementById('settingsNotice'),name=document.getElementById('shopName').value.trim();if(!name){notice.textContent='Business name is required.';notice.style.color='#b3262c';return}saving=true;notice.textContent='Saving…';try{const r=await fetch('/api/admin-data?action=shop-settings',{method:'PUT',headers:{'Content-Type':'application/json'},body:JSON.stringify({name})}),j=await r.json();if(r.status===401){location.href='/admin';return}if(!r.ok)throw new Error(j.error||'Could not save shop settings');shopSettings={...shopSettings,...j.shop};window.SHOP_CONFIG.name=shopSettings.name;document.querySelector('.pa-brand strong')?.replaceChildren(shopSettings.name);render();document.getElementById('settingsNotice').textContent=message;window.dispatchEvent(new CustomEvent('shopidentitychange',{detail:j.shop}))}catch(error){notice.textContent=error.message;notice.style.color='#b3262c'}finally{saving=false}}
async function addTechnician(){if(saving)return;const name=document.getElementById('newTechnician').value.trim(),username=document.getElementById('newTechUsername').value.trim().toLowerCase(),password=document.getElementById('newTechPassword').value,notice=document.getElementById('settingsNotice');if(!name||!username||password.length<8){notice.textContent='Enter a name, username, and temporary password with at least 8 characters.';notice.style.color='#b3262c';return}saving=true;notice.textContent='Creating account…';try{const r=await fetch('/api/admin-data?action=technician',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({name,username,password})}),j=await r.json();if(r.status===401){location.href='/admin';return}if(!r.ok)throw new Error(j.error||'Could not create technician account');shopSettings.technicians.push(j.technician);render();document.getElementById('settingsNotice').textContent='Technician account created.'}catch(error){notice.textContent=error.message;notice.style.color='#b3262c'}finally{saving=false}}
async function deleteTechnician(id){if(saving||!confirm('Delete this technician account? They will no longer be able to sign in. Past inspections will remain in your records.'))return;const notice=document.getElementById('settingsNotice');saving=true;notice.textContent='Deleting…';try{const r=await fetch('/api/admin-data?action=technician&id='+encodeURIComponent(id),{method:'DELETE'}),j=await r.json();if(r.status===401){location.href='/admin';return}if(!r.ok)throw new Error(j.error||'Could not delete technician');shopSettings.technicians=shopSettings.technicians.filter(item=>item.id!==id);render();document.getElementById('settingsNotice').textContent='Technician removed.'}catch(error){notice.textContent=error.message;notice.style.color='#b3262c'}finally{saving=false}}
function collectInspectionBlocks(){return Array.from(document.querySelectorAll('[data-template-title]')).map(input=>input.value.trim()).filter(Boolean)}
function syncInspectionBlocks(){const values=collectInspectionBlocks();if(values.length)shopSettings.inspectionBlocks=values}
function moveInspectionBlock(index,direction){syncInspectionBlocks();const target=index+direction;if(target<0||target>=shopSettings.inspectionBlocks.length)return;[shopSettings.inspectionBlocks[index],shopSettings.inspectionBlocks[target]]=[shopSettings.inspectionBlocks[target],shopSettings.inspectionBlocks[index]];render()}
function removeInspectionBlock(index){syncInspectionBlocks();if(shopSettings.inspectionBlocks.length===1){const notice=document.getElementById('inspectionTemplateNotice');notice.textContent='Keep at least one inspection block.';notice.style.color='#b3262c';return}shopSettings.inspectionBlocks.splice(index,1);render()}
function addInspectionBlock(){syncInspectionBlocks();shopSettings.inspectionBlocks.push('NEW INSPECTION BLOCK');render();const inputs=document.querySelectorAll('[data-template-title]'),last=inputs[inputs.length-1];last?.focus();last?.select()}
function resetInspectionBlocks(){if(!confirm('Restore the original eight inspection blocks?'))return;shopSettings.inspectionBlocks=[...DEFAULT_INSPECTION_BLOCKS];render();document.getElementById('inspectionTemplateNotice').textContent='Original blocks restored. Click Save inspection blocks to keep them.'}
async function saveInspectionBlocks(){if(saving)return;const inspectionBlocks=collectInspectionBlocks(),notice=document.getElementById('inspectionTemplateNotice');if(!inspectionBlocks.length){notice.textContent='Keep at least one inspection block.';notice.style.color='#b3262c';return}saving=true;notice.textContent='Saving…';try{const r=await fetch('/api/admin-data?action=inspection-template',{method:'PUT',headers:{'Content-Type':'application/json'},body:JSON.stringify({inspectionBlocks})}),j=await r.json();if(r.status===401){location.href='/admin';return}if(!r.ok)throw new Error(j.error||'Could not save inspection blocks');shopSettings.inspectionBlocks=j.inspectionBlocks;render();document.getElementById('inspectionTemplateNotice').textContent='Inspection blocks saved. New inspections will use this order.'}catch(error){notice.textContent=error.message;notice.style.color='#b3262c'}finally{saving=false}}
function dayRow(key,label){const day=availability.weekly[key];return `<div class="day-row"><label class="day-toggle"><input id="enabled-${key}" type="checkbox" ${day.enabled?'checked':''}><span>${label}</span></label><label class="field">First appointment<input id="start-${key}" type="time" value="${esc(day.start)}" ${day.enabled?'':'disabled'}></label><label class="field">Last appointment<input id="end-${key}" type="time" value="${esc(day.end)}" ${day.enabled?'':'disabled'}></label></div>`}
function closureList(){if(!availability.closures.length)return'<div class="empty">No dates are currently blocked.</div>';return [...availability.closures].sort((a,b)=>a.startDate.localeCompare(b.startDate)).map(item=>`<div class="closure"><div class="closure-dates">${esc(displayDate(item.startDate))}${item.endDate!==item.startDate?' – '+esc(displayDate(item.endDate)):''}</div><div class="closure-reason">${esc(item.reason||'Shop closed')}</div><button class="btn danger" data-delete-closure="${esc(item.id)}">Remove</button></div>`).join('')}
function collectWeekly(){const weekly={};for(const [key] of DAYS){weekly[key]={enabled:document.getElementById('enabled-'+key).checked,start:document.getElementById('start-'+key).value,end:document.getElementById('end-'+key).value}}return weekly}
async function persist(noticeId,message){if(saving)return;const notice=document.getElementById(noticeId);saving=true;notice.textContent='Saving…';try{const r=await fetch('/api/admin-data?action=availability',{method:'PUT',headers:{'Content-Type':'application/json'},body:JSON.stringify({availability})});const j=await r.json();if(r.status===401){location.href='/admin';return}if(!r.ok)throw new Error(j.error||'Could not save availability');availability=j.availability;render();document.getElementById(noticeId).textContent=message}catch(error){notice.textContent=error.message;notice.style.color='#b3262c'}finally{saving=false}}
async function saveSchedule(){availability.weekly=collectWeekly();availability.slotMinutes=Number(document.getElementById('slotMinutes').value);await persist('scheduleNotice','Weekly appointment hours saved.')}
async function addClosure(){const start=document.getElementById('closureStart').value,end=document.getElementById('closureEnd').value||start,reason=document.getElementById('closureReason').value.trim()||'Shop closed';const notice=document.getElementById('closureNotice');if(!start){notice.textContent='Choose the first closed day.';notice.style.color='#b3262c';return}if(end<start){notice.textContent='The last day cannot be before the first day.';notice.style.color='#b3262c';return}availability.closures.push({id:(crypto.randomUUID?crypto.randomUUID():'closure-'+Date.now()),startDate:start,endDate:end,reason});await persist('closureNotice','Closed dates added.')}
async function deleteClosure(id){availability.closures=availability.closures.filter(item=>item.id!==id);await persist('closureNotice','Closed dates removed.')}
async function load(){try{const [availabilityResponse,settingsResponse]=await Promise.all([fetch('/api/admin-data?action=availability',{cache:'no-store'}),fetch('/api/admin-data?action=shop-settings',{cache:'no-store'})]);if(availabilityResponse.status===401||settingsResponse.status===401){location.href='/admin';return}const [availabilityJson,settingsJson]=await Promise.all([availabilityResponse.json(),settingsResponse.json()]);if(!availabilityResponse.ok)throw new Error(availabilityJson.error||'Could not load availability');if(!settingsResponse.ok)throw new Error(settingsJson.error||'Could not load shop settings');availability=availabilityJson.availability;shopSettings=settingsJson.shop;if(!Array.isArray(shopSettings.inspectionBlocks)||!shopSettings.inspectionBlocks.length)shopSettings.inspectionBlocks=[...DEFAULT_INSPECTION_BLOCKS];timezone=availabilityJson.timezone||timezone;document.getElementById('timezone').textContent='Timezone: '+timezone.replace('_',' ');render()}catch(error){content.className='empty';content.textContent=error.message}}
document.getElementById('techResetForm').onsubmit=resetTechnicianPassword;
document.getElementById('cancelTechReset').onclick=()=>document.getElementById('techResetDialog').close();
load();
</script>
