<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<meta name="theme-color" content="#163051">
<title>Shop Admin</title>
<style>
:root{--navy:#163051;--navy-dark:#0d1d33;--red:#af2727;--red-dark:#911f1f;--green:#1d9958;--bg:#f4f7fb;--line:#dfe6ef;--muted:#60708a}
*{box-sizing:border-box}html,body{margin:0;min-height:100%;font-family:Arial,sans-serif;background:var(--bg);color:var(--navy)}button,.btn{border:0;border-radius:12px;padding:12px 18px;background:var(--red);color:#fff;font-weight:800;cursor:pointer;font-size:15px;text-decoration:none;display:inline-flex;align-items:center;justify-content:center;gap:8px;font-family:Arial,sans-serif}button:hover,.btn:hover{background:var(--red-dark)}input,select,textarea{width:100%;padding:12px;border:1px solid #d8dee9;border-radius:12px;font:15px Arial,sans-serif;color:var(--navy);background:#fff}textarea{min-height:90px;resize:vertical}label{display:block;font-size:13px;font-weight:800;margin:10px 0 6px}.hidden{display:none!important}
.login-screen{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px;background:linear-gradient(135deg,var(--navy),#0c1b30)}.login-card{width:100%;max-width:420px;background:#fff;padding:32px;border-radius:20px;box-shadow:0 20px 50px rgba(0,0,0,.25);text-align:center}.brand-box{background:#fff;color:var(--navy);border-radius:14px;padding:16px 22px;font-size:25px;font-weight:900;letter-spacing:-.04em}.login-card .brand-box{margin:0 auto 20px;box-shadow:0 8px 22px rgba(0,0,0,.12)}.login-card h2{margin:0 0 8px}.login-card p{color:var(--muted)}.error{color:var(--red);font-size:14px;margin-top:10px}
.admin{display:none;min-height:100vh}.admin-hero{background:var(--navy);padding:26px}.admin-action-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:18px;max-width:1500px;margin:0 auto}.admin-action-card{min-height:124px;border-radius:18px;background:#fff;color:var(--navy);display:flex;align-items:center;justify-content:flex-start;gap:22px;padding:22px 26px;text-align:left;text-decoration:none;box-shadow:0 12px 28px rgba(0,0,0,.16);transition:transform .15s ease}.admin-action-card:hover{background:#fff;transform:translateY(-1px)}.logo-card{justify-content:center}.logo-card .brand-box{width:100%;text-align:center}.logout-card{justify-content:center;background:linear-gradient(135deg,var(--red),#cf2f2f)!important;color:#fff!important}.action-copy{min-width:0;display:flex;flex-direction:column;align-items:flex-start}.action-title{display:block;font-size:24px;font-weight:800;line-height:1.1;color:var(--navy)}.action-subtitle{display:block;margin-top:8px;font-size:18px;font-weight:400;color:#3f4c5f;line-height:1.25}.logout-card .action-title{color:#fff;font-size:27px}.card-icon-wrap{width:64px;height:64px;min-width:64px;display:flex;align-items:center;justify-content:center}.card-svg{width:64px;height:64px;fill:none;stroke:var(--green);stroke-width:5;stroke-linecap:round;stroke-linejoin:round;overflow:visible}.svg-fill{fill:var(--green);stroke:var(--green)}.svg-white{stroke:#fff}.logout-svg{stroke:#fff}
.dashboard{padding:24px;display:grid;grid-template-columns:minmax(0,1.2fr) minmax(320px,.8fr);gap:22px;max-width:1500px;margin:0 auto}.card{background:#fff;border:1px solid #e6ebf2;border-radius:18px;padding:20px;box-shadow:0 8px 24px rgba(22,48,81,.08);min-width:0}.calendar-header{display:grid;grid-template-columns:auto 1fr auto;align-items:center;gap:12px;margin-bottom:12px}.calendar-title-wrap{text-align:center}.calendar-title-wrap h2{margin:0 0 10px;font-size:30px}.calendar-nav{width:54px;height:54px;padding:0;border-radius:14px}.today-btn,.blue-btn{background:var(--navy)}.light-btn{background:#eef3fa;color:var(--navy)}.light-btn:hover{background:#dfe8f4}.green-btn{background:#1d7f4f}.danger-btn{background:#dc2626}.calendar-grid{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:8px}.day-name{text-align:center;font-weight:800;font-size:13px;color:#61708a;padding:4px 0}.day{min-height:92px;border:1px solid #e4e9f2;border-radius:12px;padding:8px;background:#fbfcff;font-size:13px;min-width:0;overflow:hidden}.day.today{border:2px solid var(--red);background:#fff7f7}.day-number{font-weight:800;margin-bottom:6px}.appointment-dot{color:#fff;border-radius:8px;padding:5px 7px;margin-top:4px;font-size:11px;overflow:hidden;white-space:nowrap;text-overflow:ellipsis;cursor:pointer;background:var(--navy)}.status-pending,.status-new{background:#2563eb!important}.status-confirmed{background:#16a34a!important}.status-checked-in{background:#f97316!important}.status-in-progress{background:#7c3aed!important}.status-waiting-approval{background:#d97706!important}.status-completed{background:#6b7280!important}.status-cancelled{background:#dc2626!important}.side{display:flex;flex-direction:column;gap:22px}.section-title{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:12px}.section-title h2{margin:0;font-size:23px}.appointment{border-left:4px solid var(--red);background:#f8fafd;padding:12px;border-radius:12px;margin-bottom:10px;cursor:pointer}.appointment:hover{background:#eef4ff}.appointment strong{display:block;margin-bottom:4px}.appointment small{color:var(--muted);display:block;margin-top:3px}.status-pill{display:inline-block;margin-top:7px;padding:4px 8px;border-radius:999px;color:#fff;font-size:11px;font-weight:800}.empty{color:#7b8797;font-size:14px}.footer-actions{max-width:1500px;margin:0 auto 100px;padding:0 24px;display:grid;grid-template-columns:1fr 1fr;gap:12px}.footer-actions button{min-height:54px;border-radius:16px}.notifications-on{background:linear-gradient(135deg,#168052,#1d9958)!important}.notifications-off{background:linear-gradient(135deg,var(--red),#cf3434)!important}
.modal-overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,.55);z-index:9999;align-items:center;justify-content:center;padding:18px}.modal-overlay.open{display:flex}.modal{width:100%;max-width:650px;max-height:92vh;overflow:auto;background:#fff;border-radius:20px;padding:24px;box-shadow:0 20px 60px rgba(0,0,0,.3);position:relative}.modal h2{margin:0 0 8px}.modal-x{position:absolute;top:14px;right:16px;width:38px;height:38px;padding:0;background:#fff;color:#333;border:2px solid var(--red);font-size:26px}.modal-x:hover{background:var(--red);color:#fff}.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px 12px}.full{grid-column:1/-1}.modal-actions{display:flex;gap:8px;margin-top:18px;flex-wrap:wrap}.modal-actions>*{flex:1 1 140px}.meta{color:var(--muted);font-size:14px;line-height:1.6}.detail-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:14px 0}.detail{background:#f7f9fc;border:1px solid #e5ebf3;border-radius:12px;padding:11px}.detail b{display:block;font-size:11px;text-transform:uppercase;letter-spacing:.03em;color:#77849a;margin-bottom:4px}.detail span{font-size:14px;color:#33445d;overflow-wrap:anywhere}
#openTextPanelBtn{position:fixed;bottom:20px;right:20px;z-index:900;background:linear-gradient(135deg,var(--red),#cf3434);box-shadow:0 8px 25px rgba(0,0,0,.25);border-radius:999px;padding:15px 20px}#textPanel .modal{max-width:1100px;height:min(720px,90vh);display:grid;grid-template-columns:300px 1fr;padding:0;overflow:hidden}.sms-side{border-right:1px solid #dce4ef;background:#f7f9fc;padding:16px;overflow:auto}.sms-side h2{margin:0 0 12px}.sms-main{display:grid;grid-template-rows:auto 1fr auto;min-height:0}.sms-head{padding:16px;border-bottom:1px solid #dce4ef;background:#fff}.sms-thread{padding:18px;overflow:auto;background:#eef3fa}.bubble{max-width:78%;padding:10px 13px;border-radius:16px;margin:7px 0;line-height:1.35;font-size:14px}.bubble.out{margin-left:auto;background:var(--navy);color:#fff;border-bottom-right-radius:4px}.bubble.in{background:#fff;border:1px solid #dce4ef;border-bottom-left-radius:4px}.sms-compose{display:flex;gap:8px;padding:12px;background:#fff;border-top:1px solid #dce4ef}.sms-compose textarea{min-height:44px;height:44px}.conv{padding:10px;border-radius:12px;cursor:pointer;margin-bottom:8px}.conv:hover,.conv.active{background:#e7eef8}.conv strong{display:block}.conv small{color:var(--muted)}
@media(max-width:900px){.admin-hero{padding:24px 14px 26px}.admin-action-grid{gap:12px}.admin-action-card{min-height:78px;border-radius:14px;padding:14px;gap:12px;box-shadow:0 8px 18px rgba(0,0,0,.14)}.card-icon-wrap,.card-svg{width:48px;height:48px;min-width:48px}.action-title{font-size:15px}.action-subtitle{font-size:13px;margin-top:5px}.logout-card .action-title{font-size:18px}.dashboard{grid-template-columns:1fr;padding:14px;gap:16px}.card{padding:14px;border-radius:16px}.calendar-header{grid-template-columns:44px 1fr 44px;gap:8px}.calendar-nav{width:44px;height:44px}.calendar-title-wrap h2{font-size:24px}.calendar-grid{gap:5px}.day-name{font-size:11px}.day{min-height:74px;padding:5px;font-size:12px}.appointment-dot{font-size:10px;padding:4px 5px}.footer-actions{padding:0 14px;margin-bottom:90px}.form-grid{grid-template-columns:1fr}.full{grid-column:auto}#textPanel .modal{grid-template-columns:1fr;height:95vh}.sms-side{display:none}.sms-main{grid-column:1}.brand-box{font-size:20px}}
@media(max-width:430px){.admin-hero{padding:22px 12px 24px}.admin-action-grid{gap:10px}.admin-action-card{padding:12px}.action-title{font-size:14px}.action-subtitle{font-size:12px}.dashboard{padding:10px}.calendar-grid{gap:4px}.day{min-height:62px;padding:4px}.appointment-dot{font-size:9px}.footer-actions{gap:8px;padding:0 12px}.detail-grid{grid-template-columns:1fr}}
</style>
</head>
<body>
<script src="/config.js"></script>
<section class="login-screen" id="loginScreen"><div class="login-card"><div class="brand-box" id="loginBrand">AUTO SHOP</div><h2>Admin Login</h2><p>Private appointment dashboard</p><input id="passwordInput" type="password" placeholder="Enter password"><button style="width:100%;margin-top:12px" onclick="login()">Login</button><div class="error" id="loginError"></div></div></section>
<section class="admin" id="adminDashboard"><header class="admin-hero"><div class="admin-action-grid"><div class="admin-action-card logo-card"><div class="brand-box shopBrand">AUTO SHOP</div></div><button class="admin-action-card" onclick="openCreateModal()"><span class="card-icon-wrap"><svg class="card-svg" viewBox="0 0 64 64"><rect x="10" y="14" width="38" height="36" rx="6"/><path d="M18 9v10M40 9v10M10 25h38M18 34h16M18 42h12"/><circle class="svg-fill" cx="47" cy="47" r="12"/><path class="svg-white" d="M47 40v14M40 47h14"/></svg></span><span class="action-copy"><span class="action-title">New Appointment</span><span class="action-subtitle">Schedule a new<br>service appointment</span></span></button><a class="admin-action-card" href="/admin/inspection"><span class="card-icon-wrap"><svg class="card-svg" viewBox="0 0 64 64"><rect x="15" y="13" width="34" height="42" rx="6"/><path d="M25 13c0-4 3-7 7-7s7 3 7 7M25 13h14M25 31h14M25 42h14"/></svg></span><span class="action-copy"><span class="action-title">Inspection Form</span><span class="action-subtitle">Create a new<br>inspection form</span></span></a><a class="admin-action-card" href="/admin/inspection-history"><span class="card-icon-wrap"><svg class="card-svg" viewBox="0 0 64 64"><path d="M16 22A20 20 0 1 1 13 37"/><path d="M16 22H6V12"/><path d="M32 21v14h13"/></svg></span><span class="action-copy"><span class="action-title">Inspection History</span><span class="action-subtitle">View past<br>inspections</span></span></a><a class="admin-action-card" href="/admin/customers"><span class="card-icon-wrap"><svg class="card-svg" viewBox="0 0 64 64"><circle class="svg-fill" cx="25" cy="24" r="10"/><path class="svg-fill" d="M8 52c2-12 10-18 17-18s15 6 17 18H8z"/><circle class="svg-fill" cx="43" cy="27" r="8"/><path class="svg-fill" d="M36 52c2-9 8-14 14-14s11 5 13 14H36z"/></svg></span><span class="action-copy"><span class="action-title">Customer Profiles</span><span class="action-subtitle">Manage customer<br>information</span></span></a><button class="admin-action-card logout-card" onclick="logout()"><span class="card-icon-wrap"><svg class="card-svg logout-svg" viewBox="0 0 64 64"><path d="M26 10H13v44h13M35 20l13 12-13 12M20 32h28"/></svg></span><span class="action-title">Log Out</span></button></div></header><div class="dashboard"><div class="card"><div class="calendar-header"><button class="calendar-nav" onclick="moveMonth(-1)">‹</button><div class="calendar-title-wrap"><h2 id="monthTitle"></h2><button class="today-btn" onclick="goToday()">Today</button></div><button class="calendar-nav" onclick="moveMonth(1)">›</button></div><div class="calendar-grid" id="calendar"></div></div><div class="side"><div class="card"><div class="section-title"><h2>Today's Appointments</h2><button class="light-btn" onclick="loadAll()">Refresh</button></div><div id="todayList"></div></div><div class="card"><div class="section-title"><h2>Upcoming</h2></div><div id="upcomingList"></div></div></div></div><div class="footer-actions"><button id="notifyBtn" class="notifications-off" onclick="enableNotifications()">Notifications Off</button><button onclick="logout()">Log Out</button></div></section>
<button id="openTextPanelBtn" class="hidden" onclick="openTextPanel()">Text Customer</button><div class="modal-overlay" id="apptModal"><div class="modal"><button class="modal-x" onclick="closeModal('apptModal')">×</button><div id="apptModalBody"></div></div></div><div class="modal-overlay" id="createModal"><div class="modal"><button class="modal-x" onclick="closeModal('createModal')">×</button><h2>New Appointment</h2><div class="form-grid"><div><label>Name</label><input id="cName"></div><div><label>Phone</label><input id="cPhone"></div><div><label>Email</label><input id="cEmail"></div><div><label>Service</label><input id="cService" placeholder="Oil Change"></div><div><label>Year</label><input id="cYear"></div><div><label>Make</label><input id="cMake"></div><div><label>Model</label><input id="cModel"></div><div><label>Date</label><input id="cDate" type="date"></div><div><label>Time</label><select id="cTime"></select></div><div><label>Status</label><select id="cStatus"></select></div><div class="full"><label>Customer Message</label><textarea id="cMessage"></textarea></div><div class="full"><label>Internal Notes</label><textarea id="cNotes"></textarea></div></div><div class="modal-actions"><button class="green-btn" onclick="createAppointment()">Create Appointment</button><button class="light-btn" onclick="closeModal('createModal')">Cancel</button></div><div id="createNotice" class="meta"></div></div></div><div class="modal-overlay" id="textPanel"><div class="modal"><div class="sms-side"><h2>Messages</h2><button style="width:100%;margin-bottom:12px" onclick="newText()">New Message</button><div id="conversationList"></div></div><div class="sms-main"><div class="sms-head"><div style="display:flex;justify-content:space-between;gap:12px;align-items:center"><div><strong id="smsName">New Message</strong><div class="meta" id="smsPhoneLabel"></div></div><button class="light-btn" onclick="closeModal('textPanel')">Close</button></div><div id="manualTextFields" style="display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:10px"><input id="smsManualName" placeholder="Customer name"><input id="smsManualPhone" placeholder="Phone number"></div></div><div class="sms-thread" id="smsThread"></div><div class="sms-compose"><textarea id="smsMessage" placeholder="Type a message..."></textarea><button onclick="sendSms()">Send</button></div></div></div></div>
<script>
const cfg=window.SHOP_CONFIG||{};const statuses=['pending','new','confirmed','checked-in','in-progress','waiting-approval','completed','cancelled'];const slots=cfg.appointment?.slots||['9:00 AM','9:30 AM','10:00 AM','10:30 AM','11:00 AM','11:30 AM','12:00 PM','12:30 PM','1:00 PM','1:30 PM','2:00 PM','2:30 PM','3:00 PM'];let appointments=[],currentMonth=new Date(),activeAppt=null,messages=[],activePhone='';const $=id=>document.getElementById(id);$('loginBrand').textContent=cfg.name||'AUTO SHOP';document.querySelectorAll('.shopBrand').forEach(x=>x.textContent=cfg.name||'AUTO SHOP');
function esc(v){return String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}function iso(d){return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`}function prettyStatus(v){return String(v||'pending').split('-').map(x=>(x[0]||'').toUpperCase()+x.slice(1)).join(' ')}function statusClass(v){return `status-${String(v||'pending').toLowerCase()}`}function normalizePhone(v){let n=String(v||'').replace(/\D/g,'');if(n.length===11&&n[0]==='1')n=n.slice(1);return n}
async function login(){const r=await fetch('/api/admin-login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({password:$('passwordInput').value})});if(!r.ok){$('loginError').textContent='Incorrect password.';return}showAdmin();loadAll()}async function logout(){await fetch('/api/admin-logout',{method:'POST'});location.reload()}function showAdmin(){$('loginScreen').style.display='none';$('adminDashboard').style.display='block';$('openTextPanelBtn').classList.remove('hidden')}
async function loadAll(){const from=new Date();from.setMonth(from.getMonth()-2);const to=new Date();to.setMonth(to.getMonth()+12);const r=await fetch(`/api/admin-data?action=appointments&from=${iso(from)}&to=${iso(to)}`,{cache:'no-store'});if(r.status===401){$('loginScreen').style.display='flex';$('adminDashboard').style.display='none';return}const j=await r.json();if(!r.ok)throw new Error(j.error||'Could not load appointments');appointments=j.appointments||[];showAdmin();renderCalendar();renderSide()}
function renderCalendar(){const y=currentMonth.getFullYear(),m=currentMonth.getMonth();$('monthTitle').textContent=currentMonth.toLocaleDateString(undefined,{month:'long',year:'numeric'});const grid=$('calendar');grid.innerHTML=['Sun','Mon','Tue','Wed','Thu','Fri','Sat'].map(x=>`<div class="day-name">${x}</div>`).join('');const first=new Date(y,m,1).getDay(),days=new Date(y,m+1,0).getDate(),today=iso(new Date());for(let i=0;i<first;i++)grid.insertAdjacentHTML('beforeend','<div></div>');for(let d=1;d<=days;d++){const key=iso(new Date(y,m,d)),list=appointments.filter(a=>a.appointment_date===key);grid.insertAdjacentHTML('beforeend',`<div class="day ${key===today?'today':''}"><div class="day-number">${d}</div>${list.map(a=>`<div class="appointment-dot ${statusClass(a.status)}" onclick="openAppointment('${a.id}')">${esc(a.appointment_time)} ${esc(a.name)}</div>`).join('')}</div>`)}}
function renderSide(){const today=iso(new Date()),future=appointments.filter(a=>a.appointment_date>=today&&a.status!=='cancelled');const t=future.filter(a=>a.appointment_date===today);$('todayList').innerHTML=t.length?t.map(apptCard).join(''):'<div class="empty">No appointments.</div>';const u=future.filter(a=>a.appointment_date>today).slice(0,8);$('upcomingList').innerHTML=u.length?u.map(apptCard).join(''):'<div class="empty">No upcoming appointments.</div>'}
function apptCard(a){return `<div class="appointment" onclick="openAppointment('${a.id}')"><strong>${esc(a.appointment_time)} — ${esc(a.name)}</strong><small>${esc(a.year)} ${esc(a.make)} ${esc(a.model)} • ${esc(a.service)}</small><span class="status-pill ${statusClass(a.status)}">${esc(prettyStatus(a.status))}</span></div>`}
function moveMonth(n){currentMonth=new Date(currentMonth.getFullYear(),currentMonth.getMonth()+n,1);renderCalendar()}function goToday(){currentMonth=new Date();renderCalendar()}
function openAppointment(id){activeAppt=appointments.find(a=>a.id===id);if(!activeAppt)return;const a=activeAppt;$('apptModalBody').innerHTML=`<h2>${esc(a.name)}</h2><div class="meta">${esc(a.preferred_date_label||a.appointment_date)} at ${esc(a.appointment_time)}</div><div class="detail-grid"><div class="detail"><b>Phone</b><span>${esc(a.phone||'')}</span></div><div class="detail"><b>Email</b><span>${esc(a.email||'Not provided')}</span></div><div class="detail"><b>Vehicle</b><span>${esc(`${a.year||''} ${a.make||''} ${a.model||''}`)}</span></div><div class="detail"><b>Service</b><span>${esc(a.service||'')}</span></div></div><div class="form-grid"><div><label>Date</label><input id="eDate" type="date" value="${esc(a.appointment_date)}"></div><div><label>Time</label><select id="eTime">${slots.map(s=>`<option ${s===a.appointment_time?'selected':''}>${esc(s)}</option>`).join('')}</select></div><div><label>Status</label><select id="eStatus">${statuses.map(s=>`<option value="${s}" ${s===a.status?'selected':''}>${esc(prettyStatus(s))}</option>`).join('')}</select></div><div><label>Service</label><input id="eService" value="${esc(a.service||'')}"></div><div class="full"><label>Customer Message</label><textarea id="eMessage">${esc(a.message||'')}</textarea></div><div class="full"><label>Internal Notes</label><textarea id="eNotes">${esc(a.internal_notes||'')}</textarea></div></div><div class="modal-actions"><button class="green-btn" onclick="saveAppointment()">Save Changes</button><button class="blue-btn" onclick="textAppointment()">Text Customer</button><a class="btn light-btn" href="tel:${esc(normalizePhone(a.phone))}">Call</a><button class="danger-btn" onclick="deleteAppointment()">Delete</button></div><div id="editNotice" class="meta"></div>`;$('apptModal').classList.add('open');if(!a.seen)patchAppointment({id:a.id,seen:true}).catch(()=>{})}
async function patchAppointment(body){const r=await fetch('/api/admin-data?action=appointment',{method:'PATCH',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)});const j=await r.json();if(!r.ok)throw new Error(j.error||'Could not update');return j}async function saveAppointment(){try{await patchAppointment({id:activeAppt.id,appointment_date:$('eDate').value,preferred_date_label:$('eDate').value,appointment_time:$('eTime').value,status:$('eStatus').value,service:$('eService').value,message:$('eMessage').value,internal_notes:$('eNotes').value});$('editNotice').textContent='Saved.';await loadAll();setTimeout(()=>closeModal('apptModal'),350)}catch(e){$('editNotice').textContent=e.message}}async function deleteAppointment(){if(!confirm('Delete this appointment?'))return;const r=await fetch(`/api/admin-data?action=appointment&id=${encodeURIComponent(activeAppt.id)}`,{method:'DELETE'});if(!r.ok){alert('Could not delete appointment.');return}closeModal('apptModal');loadAll()}
function openCreateModal(){$('cName').value='';$('cPhone').value='';$('cEmail').value='';$('cService').value='';$('cYear').value='';$('cMake').value='';$('cModel').value='';$('cDate').value='';$('cMessage').value='';$('cNotes').value='';$('cTime').innerHTML=slots.map(s=>`<option>${esc(s)}</option>`).join('');$('cStatus').innerHTML=statuses.map(s=>`<option value="${s}" ${s==='confirmed'?'selected':''}>${esc(prettyStatus(s))}</option>`).join('');$('createNotice').textContent='';$('createModal').classList.add('open')}async function createAppointment(){const body={action:'appointment',name:$('cName').value,phone:$('cPhone').value,email:$('cEmail').value,service:$('cService').value,year:$('cYear').value,make:$('cMake').value,model:$('cModel').value,appointment_date:$('cDate').value,appointment_time:$('cTime').value,status:$('cStatus').value,message:$('cMessage').value,internal_notes:$('cNotes').value};const r=await fetch('/api/admin-data?action=appointment',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)});const j=await r.json();if(!r.ok){$('createNotice').textContent=j.error||'Could not create appointment';return}$('createNotice').textContent='Appointment created.';await loadAll();setTimeout(()=>closeModal('createModal'),350)}function closeModal(id){$(id).classList.remove('open')}document.querySelectorAll('.modal-overlay').forEach(x=>x.addEventListener('click',e=>{if(e.target===x)x.classList.remove('open')}));
async function openTextPanel(){try{const r=await fetch('/api/admin-data?action=messages',{cache:'no-store'});const j=await r.json();messages=j.messages||[];renderConversations();newText();$('textPanel').classList.add('open')}catch{alert('Could not load messages.')}}function renderConversations(){const by={};messages.forEach(m=>{const p=normalizePhone(m.phone)||m.phone;if(!by[p])by[p]=[];by[p].push(m)});$('conversationList').innerHTML=Object.entries(by).sort((a,b)=>String(b[1].at(-1)?.created_at).localeCompare(String(a[1].at(-1)?.created_at))).map(([p,arr])=>{const last=arr.at(-1);return `<div class="conv ${p===activePhone?'active':''}" onclick="selectConversation('${esc(p)}')"><strong>${esc(last.customer_name||p)}</strong><small>${esc(last.message||'')}</small></div>`}).join('')||'<div class="empty">No messages yet.</div>'}function newText(){activePhone='';$('smsName').textContent='New Message';$('smsPhoneLabel').textContent='';$('manualTextFields').style.display='grid';$('smsManualName').value='';$('smsManualPhone').value='';$('smsThread').innerHTML='<div class="empty">Enter a customer name and phone number to start a message.</div>';renderConversations()}function selectConversation(phone){activePhone=phone;const arr=messages.filter(m=>(normalizePhone(m.phone)||m.phone)===phone);const last=arr.at(-1);$('smsName').textContent=last?.customer_name||phone;$('smsPhoneLabel').textContent=phone;$('manualTextFields').style.display='none';$('smsThread').innerHTML=arr.map(m=>`<div class="bubble ${m.direction==='outgoing'?'out':'in'}">${esc(m.message)}<div style="font-size:10px;opacity:.7;margin-top:4px">${esc(new Date(m.created_at).toLocaleString())}</div></div>`).join('');$('smsThread').scrollTop=$('smsThread').scrollHeight;renderConversations()}function textAppointment(){const a=activeAppt;closeModal('apptModal');openTextPanel().then(()=>{$('smsManualName').value=a.name||'';$('smsManualPhone').value=a.phone||''})}async function sendSms(){const to=activePhone||$('smsManualPhone').value.trim(),name=activePhone?$('smsName').textContent:$('smsManualName').value.trim(),message=$('smsMessage').value.trim();if(!to||!message)return;const r=await fetch('/api/send-sms',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({to,name,message})});const j=await r.json();if(!r.ok){alert(j.error||'Could not send text. Twilio may not be configured yet.');return}$('smsMessage').value='';const rr=await fetch('/api/admin-data?action=messages',{cache:'no-store'});messages=(await rr.json()).messages||[];activePhone=normalizePhone(to)||to;selectConversation(activePhone)}
function urlBase64ToUint8Array(base64String){const padding='='.repeat((4-base64String.length%4)%4),base64=(base64String+padding).replace(/-/g,'+').replace(/_/g,'/'),raw=atob(base64);return Uint8Array.from([...raw].map(c=>c.charCodeAt(0)))}async function enableNotifications(){try{if(!('serviceWorker'in navigator)||!('PushManager'in window))throw new Error('Push notifications are not supported on this browser');const cfgR=await fetch('/api/push-subscribe'),cfgJ=await cfgR.json();if(!cfgJ.publicKey)throw new Error('Push notifications still need VAPID keys in Vercel');const perm=await Notification.requestPermission();if(perm!=='granted')throw new Error('Notification permission was not granted');const reg=await navigator.serviceWorker.register('/sw.js');const sub=await reg.pushManager.subscribe({userVisibleOnly:true,applicationServerKey:urlBase64ToUint8Array(cfgJ.publicKey)});const r=await fetch('/api/push-subscribe',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({subscription:sub})});if(!r.ok)throw new Error('Could not save notification subscription');$('notifyBtn').textContent='Notifications On';$('notifyBtn').classList.remove('notifications-off');$('notifyBtn').classList.add('notifications-on')}catch(e){alert(e.message)}}$('passwordInput').addEventListener('keydown',e=>{if(e.key==='Enter')login()});loadAll().catch(()=>{});
</script>
</body></html>
