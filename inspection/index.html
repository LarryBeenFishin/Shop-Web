<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Vehicle Inspection Report</title>
<style>
:root{--navy:#102a4c;--bg:#eef3f8;--card:#fff;--line:#dfe7f0;--text:#1a2b42;--muted:#64748b;--good:#188653;--good-bg:#eaf8f0;--monitor:#d97706;--monitor-bg:#fff6e7;--attention:#bd2c2c;--attention-bg:#fff0f0;--neutral:#60708a;--neutral-bg:#f1f5f9}
*{box-sizing:border-box}body{margin:0;min-height:100vh;background:radial-gradient(circle at 10% 0,#f8fbff 0,transparent 38%),linear-gradient(180deg,#edf3f9 0,#f7f9fc 100%);font-family:Arial,sans-serif;color:var(--text)}
.page{width:min(1040px,calc(100% - 32px));margin:0 auto;padding:28px 0 48px}.report{overflow:hidden;border:1px solid rgba(194,207,223,.8);border-radius:26px;background:var(--card);box-shadow:0 18px 55px rgba(16,42,76,.12)}
.report-hero{position:relative;overflow:hidden;background:linear-gradient(135deg,#0d2341 0,#163b68 68%,#1c4d80 100%);color:#fff;padding:28px 32px 54px}.report-hero::after{content:'';position:absolute;width:260px;height:260px;border-radius:50%;right:-90px;top:-140px;background:rgba(255,255,255,.08)}
.brand-row{position:relative;z-index:1;margin-bottom:24px}.brand{display:flex;align-items:center;gap:11px;font-size:14px;font-weight:900;letter-spacing:.015em}.brand-mark{width:38px;height:38px;border-radius:11px;background:linear-gradient(135deg,#3b82f6,#2563eb);display:grid;place-items:center;font-size:16px;box-shadow:0 8px 20px rgba(0,0,0,.2)}
.hero-main{position:relative;z-index:1}h1{font-size:clamp(30px,5vw,46px);line-height:1.05;letter-spacing:-.035em;margin:0 0 10px}.hero-meta{font-size:12px;color:#c4d5e9}
.report-body{position:relative;margin:-28px 18px 18px;background:#fff;border:1px solid var(--line);border-radius:20px;padding:24px;box-shadow:0 10px 28px rgba(16,42,76,.08)}.section{margin-top:28px}.section:first-child{margin-top:0}.section-head{display:flex;justify-content:space-between;align-items:flex-end;gap:15px;margin-bottom:13px}.section-head h2{font-size:18px;margin:0;letter-spacing:-.015em}.section-head p{font-size:12px;color:var(--muted);margin:0}
.info-grid{display:grid;grid-template-columns:1.25fr 1.45fr .65fr .85fr .85fr;gap:9px}.info-card{min-width:0;background:#f8fafc;border:1px solid #e3e9f1;border-radius:13px;padding:13px}.info-label{display:block;margin-bottom:6px;color:#78879b;font-size:9px;font-weight:900;letter-spacing:.08em;text-transform:uppercase}.info-value{font-size:13px;font-weight:800;color:#263a54;overflow-wrap:anywhere}
.results{display:grid;gap:10px}.inspection-item{display:grid;grid-template-columns:42px minmax(0,1fr) auto;gap:13px;align-items:start;border:1px solid var(--line);border-left:5px solid var(--neutral);border-radius:15px;padding:15px 16px;background:#fff}.inspection-item.good{border-left-color:var(--good);background:linear-gradient(90deg,var(--good-bg),#fff 18%)}.inspection-item.monitor{border-left-color:var(--monitor);background:linear-gradient(90deg,var(--monitor-bg),#fff 18%)}.inspection-item.attention{border-left-color:var(--attention);background:linear-gradient(90deg,var(--attention-bg),#fff 18%)}.status-icon{width:38px;height:38px;border-radius:11px;display:grid;place-items:center;font-size:18px;font-weight:900;background:var(--neutral-bg);color:var(--neutral)}.good .status-icon{background:#d9f2e4;color:var(--good)}.monitor .status-icon{background:#ffebc7;color:var(--monitor)}.attention .status-icon{background:#f8d8d8;color:var(--attention)}.inspection-title{font-size:15px;font-weight:900;margin:2px 0 6px;color:#1e334e}.inspection-notes{font-size:13px;line-height:1.5;color:#53647a;white-space:pre-wrap}.inspection-notes.empty{color:#8793a4;font-style:italic}
.status{display:inline-flex;align-items:center;gap:6px;border-radius:999px;padding:7px 10px;font-size:10px;font-weight:900;letter-spacing:.035em;text-transform:uppercase;white-space:nowrap;background:var(--neutral-bg);color:var(--neutral);border:1px solid #dbe3ec}.status.good{background:var(--good-bg);color:var(--good);border-color:#bfe3cf}.status.monitor{background:var(--monitor-bg);color:var(--monitor);border-color:#efd39c}.status.attention{background:var(--attention-bg);color:var(--attention);border-color:#eabdbd}
.recommendations{position:relative;white-space:pre-wrap;line-height:1.65;background:#f6f9fd;border:1px solid #dce6f1;border-radius:15px;padding:17px 17px 17px 47px;font-size:13px;color:#40536c}.recommendations::before{content:'!';position:absolute;left:15px;top:16px;width:22px;height:22px;border-radius:7px;background:var(--navy);color:#fff;display:grid;place-items:center;font-size:12px;font-weight:900}.report-footer{display:flex;justify-content:space-between;gap:18px;border-top:1px solid var(--line);padding:17px 4px 0;margin-top:28px;color:#7c899a;font-size:10px;line-height:1.45}.loading,.error{text-align:center;font-size:16px;padding:80px 24px;color:var(--muted)}.error{color:var(--attention)}
@media(max-width:800px){.info-grid{grid-template-columns:repeat(2,minmax(0,1fr))}.report-hero{padding:24px 22px 52px}.report-body{padding:18px;margin:-28px 10px 10px}}
@media(max-width:560px){.page{width:100%;padding:0}.report{border:0;border-radius:0;box-shadow:none}.report-hero{padding:20px 16px 48px}.brand-row{margin-bottom:22px}.report-body{margin:-24px 8px 8px;padding:16px;border-radius:17px}.info-grid{grid-template-columns:1fr 1fr}.inspection-item{grid-template-columns:38px 1fr;padding:13px 12px;gap:10px}.inspection-item>.status{grid-column:2;justify-self:start}.section-head{align-items:flex-start;flex-direction:column;gap:4px}.report-footer{flex-direction:column;gap:5px}h1{font-size:31px}}
</style>
</head>
<body>
<script src="/config.js"></script>
<main class="page"><div class="report" id="report"><div class="loading">Loading inspection report…</div></div></main>
<script>
const id=new URLSearchParams(location.search).get('id'),cfg=window.SHOP_CONFIG||{};
function esc(v){return String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function statusKey(s){const v=String(s||'').toLowerCase();if(v.includes('attention')||v.includes('needs')||v.includes('fail'))return'attention';if(v.includes('monitor')||v.includes('watch'))return'monitor';if(v.includes('good')||v.includes('pass'))return'good';return'neutral'}
function statusLabel(s){const key=statusKey(s);if(key==='good')return'Good';if(key==='monitor')return'Monitor';if(key==='attention')return'Needs Attention';return s||'Not Rated'}
function statusIcon(s){const key=statusKey(s);return key==='good'?'✓':key==='monitor'?'!':key==='attention'?'×':'–'}
function statusBadge(s){const key=statusKey(s);return `<span class="status ${key}">${statusIcon(s)} ${esc(statusLabel(s))}</span>`}
function item(title,status,notes){const key=statusKey(status),copy=String(notes||'').trim();return `<article class="inspection-item ${key}"><div class="status-icon">${statusIcon(status)}</div><div><div class="inspection-title">${esc(title||'Inspection Item')}</div><div class="inspection-notes${copy?'':' empty'}">${esc(copy||'No notes added.')}</div></div>${statusBadge(status)}</article>`}
function legacyItems(i){return[['Brakes',i.brakesStatus,i.brakesNotes],['Tires',i.tiresStatus,i.tiresNotes],['Suspension',i.suspensionStatus,i.suspensionNotes],['Fluids',i.fluidsStatus,i.fluidsNotes],['Battery',i.batteryStatus,i.batteryNotes],['Lights',i.lightsStatus,i.lightsNotes],['Wipers',i.wipersStatus,i.wipersNotes],['Filters',i.filtersStatus,i.filtersNotes],['Leaks',i.leaksStatus,i.leaksNotes]].filter(x=>x[1]||x[2])}
function formatDate(value){if(!value)return'Not provided';const d=new Date(value);return Number.isNaN(d.getTime())?'Not provided':d.toLocaleDateString(undefined,{month:'short',day:'numeric',year:'numeric'})}
async function load(){
  if(!id){report.innerHTML='<div class="error">Missing inspection ID.</div>';return}
  try{
    const r=await fetch('/api/public-inspection?id='+encodeURIComponent(id)),j=await r.json();
    if(!r.ok||j.status!=='success')throw new Error('Inspection not found.');
    const i=j.inspection,shopName=cfg.name||j.shop?.name||'AUTO SHOP';
    const dynamic=Array.isArray(i.inspection_items)&&i.inspection_items.length?i.inspection_items.map(x=>[x.title,x.status,x.notes]):legacyItems(i);
    report.innerHTML=`
      <header class="report-hero">
        <div class="brand-row"><div class="brand"><div class="brand-mark">${esc(shopName.charAt(0).toUpperCase())}</div><span>${esc(shopName)}</span></div></div>
        <div class="hero-main"><h1>Inspection Results</h1><div class="hero-meta">Inspected ${esc(formatDate(i.createdAt))}</div></div>
      </header>
      <div class="report-body">
        <section class="section"><div class="section-head"><h2>Customer & Vehicle</h2><p>Inspection details at a glance</p></div><div class="info-grid">
          <div class="info-card"><span class="info-label">Customer</span><div class="info-value">${esc(i.customerName||'Not provided')}</div></div>
          <div class="info-card"><span class="info-label">Vehicle</span><div class="info-value">${esc(i.vehicle||'Not provided')}</div></div>
          <div class="info-card"><span class="info-label">Mileage</span><div class="info-value">${esc(i.mileage||'—')}</div></div>
          <div class="info-card"><span class="info-label">Technician</span><div class="info-value">${esc(i.technician||'Not provided')}</div></div>
          <div class="info-card"><span class="info-label">Inspection Date</span><div class="info-value">${esc(formatDate(i.createdAt))}</div></div>
        </div></section>
        <section class="section"><div class="section-head"><h2>Inspection Details</h2><p>Green is good, orange should be monitored, and red needs attention</p></div><div class="results">${dynamic.length?dynamic.map(x=>item(x[0],x[1],x[2])).join(''):'<div class="inspection-notes empty">No inspection items were added.</div>'}</div></section>
        <section class="section"><div class="section-head"><h2>Technician Recommendations</h2></div><div class="recommendations">${esc(i.recommendations||'No additional recommendations were added.')}</div></section>
        <footer class="report-footer"><span>Prepared by ${esc(shopName)}</span></footer>
      </div>`;
  }catch(e){report.innerHTML=`<div class="error">${esc(e.message||'Inspection not found.')}</div>`}
}
load();
</script>
</body>
</html>
