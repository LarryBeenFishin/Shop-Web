<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>Inspection History</title><style>*{box-sizing:border-box}body{margin:0;font-family:Arial,sans-serif;background:#f4f7fb;color:#163051;padding:18px}.wrap{max-width:1100px;margin:auto}.top{display:flex;justify-content:space-between;align-items:center;gap:14px;flex-wrap:wrap;margin-bottom:18px}.brand{background:#fff;padding:14px 18px;border-radius:14px;font-weight:900;font-size:20px}.card{background:#fff;border-radius:18px;padding:18px;box-shadow:0 8px 24px rgba(22,48,81,.08);margin-bottom:14px}.inspection{border-left:5px solid #af2727}.inspection h3{margin:0 0 6px;font-size:22px}.meta{color:#60708a;font-size:14px;line-height:1.6}.status{display:inline-block;margin-top:8px;padding:5px 10px;border-radius:999px;background:#eef3fa;font-weight:800;font-size:12px}input{width:100%;padding:14px;border:1px solid #d8dee9;border-radius:12px;font-size:16px;margin:10px 0 18px}button,.btn{border:0;border-radius:12px;padding:12px 18px;background:#af2727;color:#fff;font-weight:800;cursor:pointer;font-size:15px;text-decoration:none;display:inline-block}.blue{background:#163051}.green{background:#1d7f4f}.light{background:#eef3fa;color:#163051}.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}@media(max-width:700px){body{padding:12px}.top{justify-content:center;text-align:center}.actions{flex-direction:column}.actions>*{width:100%;text-align:center}}</style></head><body><script src="/config.js"></script><div class="wrap"><div class="top"><div class="brand" id="brand">AUTO SHOP</div><a class="btn blue" href="/admin">Back to Admin</a></div><div class="card"><h1>Inspection History</h1><p>Search past inspections by customer name, phone, vehicle, date, or status.</p><input id="search" placeholder="Search inspections..." oninput="render()"><div class="actions"><button onclick="load()">Refresh History</button><a class="btn green" href="/admin/inspection">Create New Inspection</a></div><div id="notice"></div></div><div id="list"></div></div><script>brand.textContent=(window.SHOP_CONFIG||{}).name||'AUTO SHOP';let inspections=[];function esc(v){return String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}async function load(){notice.textContent='Loading inspections...';const r=await fetch('/api/admin-data?action=inspections');if(r.status===401){location.href='/admin';return}const j=await r.json();inspections=j.inspections||[];notice.textContent=`${inspections.length} inspection(s) found.`;render()}function render(){const q=search.value.toLowerCase(),rows=inspections.filter(i=>[i.id,i.created_at,i.customer_name,i.phone,i.email,i.vehicle,i.mileage,i.technician,i.overall_status,i.recommendations].join(' ').toLowerCase().includes(q));list.innerHTML=rows.length?rows.map(i=>`<div class="card inspection"><h3>${esc(i.customer_name||'Customer')}</h3><div class="meta"><strong>Vehicle:</strong> ${esc(i.vehicle||'Not provided')}<br><strong>Phone:</strong> ${esc(i.phone||'Not provided')}<br><strong>Email:</strong> ${esc(i.email||'Not provided')}<br><strong>Mileage:</strong> ${esc(i.mileage||'Not provided')}<br><strong>Technician:</strong> ${esc(i.technician||'Not provided')}<br><strong>Created:</strong> ${new Date(i.created_at).toLocaleString()}<br><strong>ID:</strong> ${esc(i.id)}</div><div class="status">${esc(i.overall_status||'Monitor')}</div><div class="actions"><a class="btn blue" target="_blank" href="/inspection?id=${i.id}">Open Report</a><button class="light" onclick="copyLink('${i.id}')">Copy Link</button>${i.phone?`<a class="btn light" href="tel:${esc(i.phone)}">Call</a>`:''}${i.email?`<a class="btn light" href="mailto:${esc(i.email)}">Email</a>`:''}</div></div>`).join(''):'<div class="card">No inspections found.</div>'}async function copyLink(id){const u=location.origin+'/inspection?id='+id;await navigator.clipboard.writeText(u);notice.textContent='Inspection link copied.'}load();</script></body></html>
