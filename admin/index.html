<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Appointment Admin</title><style>
*{box-sizing:border-box}body{margin:0;font-family:Arial,sans-serif;background:#f5f7fa;color:#0f172a}.wrap{max-width:1180px;margin:auto;padding:28px 18px}h1{margin:0 0 6px;color:#1a3455}.sub{color:#64748b;margin:0 0 24px}.card{background:#fff;border:1px solid #e2e8f0;border-radius:20px;padding:20px;box-shadow:0 10px 28px rgba(15,23,42,.06)}.login{max-width:440px;margin:10vh auto}.login input{width:100%;padding:14px;border:1px solid #cbd5e1;border-radius:12px;margin:12px 0}.btn{border:0;border-radius:12px;padding:12px 16px;font-weight:800;cursor:pointer;background:#1a3455;color:#fff}.btn.gray{background:#e2e8f0;color:#334155}.top{display:flex;gap:12px;justify-content:space-between;align-items:center;flex-wrap:wrap;margin-bottom:18px}.filters{display:flex;gap:8px;flex-wrap:wrap}.filters input{padding:10px;border:1px solid #cbd5e1;border-radius:10px}.grid{display:grid;gap:12px}.appt{display:grid;grid-template-columns:1.1fr 1.1fr 1.2fr .9fr;gap:16px;align-items:center;border:1px solid #e2e8f0;border-radius:16px;padding:16px;background:#fff}.name{font-size:17px;font-weight:900;color:#1a3455}.muted{color:#64748b;font-size:13px;line-height:1.5}.when{font-weight:900}.status{width:100%;padding:10px;border:1px solid #cbd5e1;border-radius:10px;background:#fff}.empty{text-align:center;padding:38px;color:#64748b}@media(max-width:760px){.appt{grid-template-columns:1fr}.wrap{padding:18px 12px}}
</style></head><body><div class="wrap"><div id="app"></div></div><script>
const app=document.getElementById('app');let list=[];
function esc(v){return String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function loginView(msg=''){app.innerHTML=`<div class="card login"><h1>Appointment Admin</h1><p class="sub">Sign in to view and manage appointment requests.</p>${msg?`<p style="color:#b91c1c">${esc(msg)}</p>`:''}<input id="pw" type="password" placeholder="Admin password"><button class="btn" id="login">Sign In</button></div>`;document.getElementById('login').onclick=login;document.getElementById('pw').onkeydown=e=>{if(e.key==='Enter')login()}}
async function login(){const r=await fetch('/api/admin-login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({password:document.getElementById('pw').value})});if(!r.ok){loginView('Incorrect password.');return}load()}
async function load(){const today=new Date().toISOString().slice(0,10);const r=await fetch('/api/admin-appointments?from='+today);if(r.status===401){loginView();return}const j=await r.json();list=j.appointments||[];render()}
function render(){app.innerHTML=`<div class="top"><div><h1>Appointments</h1><p class="sub">Upcoming website appointment requests.</p></div><div class="filters"><button class="btn gray" id="refresh">Refresh</button><button class="btn gray" id="logout">Log Out</button></div></div><div class="grid" id="grid"></div>`;document.getElementById('refresh').onclick=load;document.getElementById('logout').onclick=async()=>{await fetch('/api/admin-logout',{method:'POST'});loginView()};const grid=document.getElementById('grid');if(!list.length){grid.innerHTML='<div class="card empty">No upcoming appointments.</div>';return}grid.innerHTML=list.map(a=>`<div class="appt"><div><div class="name">${esc(a.name)}</div><div class="muted">${esc(a.phone)}${a.email?' • '+esc(a.email):''}</div></div><div><div class="when">${esc(a.preferred_date_label||a.appointment_date)}<br>${esc(a.appointment_time)}</div><div class="muted">${a.drop_off?'Drop-off':'Waiting / unspecified'}</div></div><div><strong>${esc(a.year+' '+a.make+' '+a.model)}</strong><div class="muted">${esc(a.service)}${a.message?'<br>'+esc(a.message):''}</div></div><div><select class="status" data-id="${esc(a.id)}"><option value="pending" ${a.status==='pending'?'selected':''}>Pending</option><option value="confirmed" ${a.status==='confirmed'?'selected':''}>Confirmed</option><option value="completed" ${a.status==='completed'?'selected':''}>Completed</option><option value="cancelled" ${a.status==='cancelled'?'selected':''}>Cancelled</option></select></div></div>`).join('');grid.querySelectorAll('.status').forEach(s=>s.onchange=()=>update(s.dataset.id,s.value))}
async function update(id,status){const r=await fetch('/api/admin-appointments',{method:'PATCH',headers:{'Content-Type':'application/json'},body:JSON.stringify({id,status})});if(!r.ok)alert('Could not update appointment.');}
load();
</script></body></html>
